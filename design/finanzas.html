<script>
window.HOJA = {
  id: "finanzas",
  nombre: "Finanzas",
  pregunta: "¿Cuánto dinero entró, salió y queda?",
  fuentes: ["AXION"],

  pintar: function (M, D) {
    var H = "";
    var _pb = perPartes();
    if (!_pb.hist && String(_pb.anio) !== String((D.flujo || {}).anio || ""))
      H += '<p class="linea-meta"><b>Elegiste un período de ' + _pb.anio +
        ' y esta hoja todavía mide la caja de ' +
        esc(String((D.flujo || {}).anio || "")) + '.</b> El control de ' +
        'ingresos y gastos de ' + _pb.anio + ' está completo en la ' +
        'subpestaña <b>Gastos</b>, que sí sigue este filtro — igual que ' +
        'Rentabilidad y las tarjetas de Resultados.</p>';
    H += this.caja(D);
    H += avisoAlcance(
      "el gasto por obra del libro de caja",
      "la caja mes a mes, el detalle por mes y los indicadores del scorecard");
    H += this.mesAMes(D);
    return H;
  },

  caja: function (D) {
    var f = D.flujo || {};
    var ms = f.meses || [];
    if (!f.hay || !ms.length) return "";
    this._meses = ms;

    var cob = 0, sal = 0, i;
    for (i = 0; i < ms.length; i++) { cob += ms[i].entro || 0; sal += ms[i].salio || 0; }
    var neto = cob - sal;
    var ac = f.acumulado || {};
    var hip = f.hipotecas || {};

    var mSel = null;
    if (P !== "None" && P !== null && P !== undefined) {
      for (i = 0; i < ms.length; i++)
        if (String(ms[i].mes) === String(P)) { mSel = ms[i]; break; }
    }
    var nomPer = mSel ? esc(mSel.etiqueta) : esc(f.anio);
    if (mSel) { cob = mSel.entro || 0; sal = mSel.salio || 0; neto = cob - sal; }
    var nCob = mSel ? ((mSel.top_cobros || {}).filas || 0) : ac.filas_entro;
    var nSal = mSel ? ((mSel.top_gastos || {}).filas || 0) : ac.filas_salio;
    var porEnt = mSel ? (mSel.por_entrar || 0) : ac.por_entrar;

    var h = '<div class="sol">' +
      '<span class="overline">La caja de ' + nomPer + ' · lo cobrado sale de Cuentas por Cobrar y ' +
        'lo gastado del Registro de Movimientos · ' +
        (mSel
          ? 'el filtro de mes SÍ recorta estas tres cifras · '
          : 'son los ' + ms.length + ' meses del año juntos · ') +
        'los de razón social y obra no se pueden aplicar acá porque el ' +
        (ac.sin_obra && ac.salio
          ? pct(100 * ac.sin_obra.monto / ac.salio)
          : 'la mayor parte') +
        ' del gasto no lleva obra cargada — recortarlo dejaría «Queda» ' +
        'restando dos poblaciones distintas</span>' +
      '<div class="sol-tres">' +
      this.cifraCaja("caja-entro", "Entró", cob,
        (nCob ? ent(nCob) + " cobros" : "cobros") +
        ": iniciales de crédito y cuotas que Cobranzas anotó contra el cliente, " +
        "cada una con su recibo" +
        (mSel && mSel.corte && mSel.corte.cobro
          ? " · cargados hasta el " + esc(mSel.corte.cobro) : ""),
        "Ver de qué se compone") +
      this.cifraCaja("caja-salio", "Salió", sal,
        (nSal ? ent(nSal) + " movimientos" : "movimientos") +
        " de gasto del Registro de Movimientos en " + nomPer +
        " · el presupuesto no entra acá: no es caja" +
        (mSel && mSel.corte && mSel.corte.gasto
          ? " · cargados hasta el " + esc(mSel.corte.gasto) : ""),
        "Ver los rótulos que lo componen") +
      this.cifraCaja("caja-neto", "Queda", neto,
        "lo cobrado menos lo gastado · fuera de esta resta hay " +
        soles(porEnt) + " en cuotas con cronograma que vencen en " + nomPer +
        " y todavía no entraron, y " +
        ent(hip.ventas) + " hipotecas por " + soles(hip.monto) +
        " que el banco todavía no desembolsa" +
        (mSel ? " — las hipotecas NO se recortan por mes: AXION no les carga " +
                "fecha de desembolso, así que no caen en ninguno" : ""),
        "Ver qué queda fuera de esta resta") +
      '</div>' +
      ((mSel && mSel.corte && mSel.corte.cobro && mSel.corte.gasto &&
        mSel.corte.cobro !== mSel.corte.gasto)
        ? '<p class="linea-meta" style="margin-top:var(--e3)"><b>Los dos lados no ' +
          'están cargados hasta la misma fecha.</b> Los cobros llegan hasta el ' +
          esc(mSel.corte.cobro) + ' y los gastos hasta el ' + esc(mSel.corte.gasto) +
          '. Mientras esa diferencia exista, «Queda» de este mes muestra días de ' +
          'gasto que todavía no tienen su cobro al lado, y se lee peor de lo que va.</p>'
        : '');

    var gf = D.gasto_fuera || {};
    var gfh = D.gasto_fuera_hist || {};
    var difLib = (f.cobros_del_libro || 0) - (ac.entro || 0);
    var piezas = [];
    if (gf.hay && gf.monto) {
      piezas.push('<b>' + soles(gf.monto) + '</b> de lo que salió —' +
        ent(gf.movimientos) + ' movimientos— se fue a <b>' +
        esc((gf.proyectos || []).slice(0, 2).join(" y ") || "proyectos ajenos") +
        '</b>, cuyos rótulos no emparejan ninguna obra de AXION: en su ' +
        'mayoría compras de dólares enviadas afuera' +
        (gfh.monto > (gf.monto || 0) + 0.5
          ? ' — y eso es solo ' + esc(String((D.flujo || {}).anio || "")) +
            ': contando también ' + esc((gfh.anios || []).join(" y ") || "los años anteriores") +
            ', son <b>' + soles(gfh.monto) + '</b> en ' + ent(gfh.movimientos) +
            ' movimientos'
          : '') +
        '. Miami no existe como obra; ' +
        '«Chancay» coincide con la ubicación de LA PRADERA DE QUEPEPAMPA ' +
        '(anteproyecto) — si son de esa obra lo decide Administración');
    }
    if (difLib > 0) {
      piezas.push('<b>' + soles(difLib) + '</b> son cobros que Administración anotó ' +
        'en su Registro de Movimientos y que Cobranzas no tiene registrados contra la ' +
        'cuota de ningún cliente — el tablero publica lo de Cobranzas, así se acordó');
    }
    if (piezas.length) {
      var netoAnio = (ac.entro || 0) - (ac.salio || 0);
      var conTodo = netoAnio + (gf.monto || 0) + (difLib > 0 ? difLib : 0);
      h += '<div class="hallazgo' + (gf.hay ? ' abrible" data-abre="fuera-alcance" ' +
        'aria-expanded="false" tabindex="0" role="button' : '') +
        '" style="margin-top:var(--e4)">' +
        '<span class="q">Por qué «Queda» sale ' + (neto < 0 ? 'en rojo' : 'así') + '</span>' +
        (mSel
          ? 'Lo de abajo es del AÑO, no de ' + nomPer + ': ninguna de las dos piezas ' +
            'está medida por mes. En el año quedan ' + soles(netoAnio) + '. '
          : 'No es que el grupo haya perdido ' + soles(Math.abs(neto)) + '. ') +
        piezas.join('; y ') + '. <b>Contando las dos cosas el año cierra en ' +
        soles(conTodo) + '</b>. Ninguna se descuenta de la resta: la primera es dinero ' +
        'que salió de verdad, y la segunda es una diferencia de registro entre dos ' +
        'áreas que le toca resolver a Habitat.' +
        (gf.hay ? ' <span class="abrir">Ver los ' +
          ent(gfh.movimientos || gf.movimientos) + ' movimientos' +
          ((gfh.anios || []).length
            ? ' · ' + esc((gfh.anios || []).concat(
                [String((D.flujo || {}).anio || "")]).join(" y ")) : '') +
          ' ▸</span>' : '') + '</div>';
    }

    h += '<div class="detalle" id="det-caja-entro"></div>' +
      '<div class="detalle" id="det-caja-salio"></div>' +
      '<div class="detalle" id="det-caja-neto"></div>' +
      '<div class="detalle" id="det-fuera-alcance"></div>' +
      this.grafico(D, ms) +
      '</div>';
    return h;
  },

  cifraCaja: function (id, k, v, n, rotulo) {
    return '<div class="abrible" data-abre="' + id + '" aria-expanded="false" ' +
      'tabindex="0" role="button">' +
      '<span class="k">' + esc(k) + '</span>' +
      '<div class="v">' + (v === null || v === undefined || isNaN(v) ? "—" : soles(v)) + '</div>' +
      '<div class="n">' + esc(n) + '</div>' +
      '<div class="abrir abrir-osc"><span>' + esc(rotulo) + '</span>' +
      '<span class="flecha">▸</span></div></div>';
  },

  grafico: function (D, ms) {
    var vivos = ms.filter(function (m) {
      return (m.entro || 0) > 0 || (m.salio || 0) > 0;
    });
    if (!vivos.length) return "";
    var max = 0;
    vivos.forEach(function (m) {
      max = Math.max(max, m.entro || 0, m.salio || 0);
    });
    if (!max) return "";
    var ALTO = 160;
    var h = '<div class="graf" style="margin-top:var(--e5)">' +
      '<span class="rot">Mes a mes · lo que se cobró y lo que salió de caja</span>' +
      '<div class="graf-caja">';
    vivos.forEach(function (m) {
      var k = String(m.mes), abrible = !!D.meses[k];
      var nb = (m.entro || 0) - (m.salio || 0);
      h += '<div class="col' + (P === k ? ' col-on' : '') + '"' +
        (abrible ? ' data-mes="' + k + '" tabindex="0" role="button"' : '') +
        ' title="' + esc(m.etiqueta) + ' · entró ' + soles(m.entro) +
          ' · salió ' + soles(m.salio) + ' · queda ' + soles(nb) + '">' +
        '<span class="cif-col">' + solesM(nb) + '</span>' +
        '<div class="par">' +
          '<span class="b be" style="height:' +
            (100 * (m.entro || 0) / max) + '%"></span>' +
          '<span class="b bf" style="height:' +
            (100 * (m.salio || 0) / max) + '%"></span>' +
        '</div>' +
        '<span class="mes">' + esc(String(m.etiqueta).slice(0, 3)) + '</span>' +
        '</div>';
    });
    h += '</div><div class="graf-ley">' +
      '<span><i class="be"></i>Entró · Cuentas por Cobrar</span>' +

  detMes: function (n) {
    var ms = this._meses || ((D.flujo || {}).meses || []);
    var m = ms.filter(function (x) { return x.mes === n; })[0];
    if (!m) return '<button class="cerrar">Cerrar</button><p>Ese mes no está en el flujo.</p>';

    var filtroObra = !!(RS || OBRA || TIPO);
    var _filtra = function (xs) {
      return (xs || []).filter(function (x) { return entraObra(x.obra || ""); });
    };
    var _suma = function (xs) {
      return xs.reduce(function (s, x) { return s + (x.monto || 0); }, 0);
    };
    var _topDe = function (xs, tope) {
      var ord = xs.slice().sort(function (a, b) { return (b.monto || 0) - (a.monto || 0); });
      var top = ord.slice(0, tope || 10);
      var totMonto = _suma(ord), topMonto = _suma(top);
      return {filas: ord.length, monto: totMonto, detalle: top,
              resto: totMonto - topMonto, resto_filas: ord.length - top.length};
    };
    var fCobroTodas = m.filas_cobro || [], fGastoTodas = m.filas_gasto || [];
    var fCobro = filtroObra ? _filtra(fCobroTodas) : fCobroTodas;
    var fGasto = filtroObra ? _filtra(fGastoTodas) : fGastoTodas;

    var hayCifra = (m.entro || 0) !== 0 || (m.salio || 0) !== 0;
    var llego = !!(m.pasado || m.en_curso);
    var vivo = llego || hayCifra;
    var c = filtroObra ? _suma(fCobro) : (m.entro || 0);
    var s = filtroObra ? _suma(fGasto) : (m.salio || 0);
    var fut = (((D.flujo || {}).futuros || {}).detalle || []).filter(function (x) {
      return Number(String(x.fecha || "").slice(5, 7)) === m.mes;
    });
    if (filtroObra) fut = fut.filter(function (x) { return entraObra(x.obra || ""); });

    var acum = 0;
    for (var i = 0; i < ms.length; i++) {
      var ei = filtroObra ? _suma(_filtra(ms[i].filas_cobro || [])) : (ms[i].entro || 0);
      var si = filtroObra ? _suma(_filtra(ms[i].filas_gasto || [])) : (ms[i].salio || 0);
      acum += ei - si;
      if (ms[i].mes === n) break;
    }
    var filas = [
      ["Entró · Cuentas por Cobrar", vivo ? c : null],
      ["Salió · Registro de Movimientos", vivo ? (s ? -s : 0) : null],
      ["Queda en el mes", vivo ? c - s : null],
      ["Acumulado desde enero hasta este mes", vivo ? acum : null],
      ["Cuotas del mes sin cobrar", m.por_entrar || null]
    ];
    if (m.sin_clasificar) filas.push(["Sin clasificar", m.sin_clasificar]);

    var h = '<button class="cerrar">Cerrar</button><h3>' + esc(m.etiqueta) + '</h3>' +
      '<div class="regla">' +
      (m.en_curso ? "Mes en curso: lo que se ve es lo cargado hasta hoy, no el mes cerrado. "
        : llego ? "Mes cerrado. "
        : hayCifra ? "El mes todavía no llegó: lo que se ve son cobros cargados con fecha " +
            "futura, y sí están dentro del total del año. "
        : "Mes que todavía no ocurrió: no hay nada cargado y " +
          "por eso las dos primeras filas van con raya, no con cero. ") +
      '«Entró» sale de Cuentas por Cobrar y «Salió» del Registro de Movimientos. ' +
      '«Cuotas del mes sin cobrar» son ' +
      'las que vencen en este mes y todavía no entraron: no incluye las hipotecas, que no tienen ' +
      'fecha de desembolso. <b>«Acumulado» no es el saldo del banco</b>: es la suma de los ' +
      '«Queda» desde enero, y AXION no publica con cuánto dinero arrancó cada cuenta.' +
      ((m.corte && m.corte.cobro && m.corte.gasto && m.corte.cobro !== m.corte.gasto)
        ? ' <b>Ojo con este mes:</b> los cobros están cargados hasta el ' +
          esc(m.corte.cobro) + ' y los gastos hasta el ' + esc(m.corte.gasto) +
          ', así que «Queda» tiene días de gasto sin su cobro al lado.'
        : '') +
      (filtroObra
        ? ' <b>Con el filtro puesto, esta tarjeta es un piso:</b> solo suma los ' +
          'movimientos que llevan la obra o la razón social elegida cargada — los que ' +
          'no tienen obra no se le pueden atribuir a nadie, así que quedan afuera. «Cuotas ' +
          'del mes sin cobrar» sigue siendo del grupo entero: esa cuenta no distingue obra.'
        : '') + '</div>' +
      '<div class="envoltura-tabla"><table class="datos"><thead><tr>' +
      '<th>Concepto</th><th class="num">Monto</th></tr></thead><tbody>';
    filas.forEach(function (x, i) {
      h += '<tr' + (i === 2 ? ' class="total"' : '') + '><td class="obra">' + esc(x[0]) + '</td>' +
        '<td class="num">' + (x[1] === null || x[1] === undefined
          ? '<span class="raya">—</span>'
          : '<b' + (x[1] < 0 ? ' style="color:var(--rojo)"' : '') + '>' + soles(x[1]) + '</b>') +
        '</td></tr>';
    });
    h += '</tbody></table></div>';

    if (fut.length) {
      h += '<h3 style="margin-top:var(--e4)">Cobros fechados en este mes que todavía no llegaron</h3>' +
        '<div class="envoltura-tabla"><table class="datos"><thead><tr>' +
        '<th>Fecha</th><th>Quién</th><th>Unidad</th><th class="num">Monto</th>' +
        '</tr></thead><tbody>';
      fut.forEach(function (x) {
        h += '<tr><td>' + esc(x.fecha) + '</td><td class="obra">' + esc(x.quien) + '</td>' +
          '<td>' + esc(x.unidad) + '</td><td class="num">' + soles(x.monto) + '</td></tr>';
      });
      h += '</tbody></table></div>' +
        '<p class="mas">Su fecha todavía no llegó, pero están cargados como cobro y por eso ' +
        '<b>sí se cuentan</b> en «Entró» de este mes y en el total del año.</p>';
    }

    var tc = filtroObra ? _topDe(fCobro, 10) : (m.top_cobros || {});

    var bancos = Array.from(new Set(fGasto.map(function (x) { return x.cuenta || ""; })
      .filter(function (x) { return x; }))).sort();
    var bancoSel = refiltro("mes-" + n);
    var fGastoBanco = bancoSel ? fGasto.filter(function (x) { return (x.cuenta || "") === bancoSel; }) : fGasto;
    var tg = filtroObra || bancoSel ? _topDe(fGastoBanco, 10) : (m.top_gastos || {});

    var hayEntro = llego && (tc.detalle || []).length;
    if (hayEntro) {
      h += '<h3 style="margin-top:var(--e4)">Qué entró</h3>';
    }
    if (hayEntro) {
      h += '<div class="envoltura-tabla"><table class="datos"><thead><tr>' +
        '<th>Fecha</th><th>Quién</th><th>Unidad</th><th>Proyecto</th><th>Qué pagó</th>' +
        '<th class="num">Monto</th></tr></thead><tbody>';
      tc.detalle.forEach(function (x) {
        h += '<tr><td>' + esc(x.fecha) + '</td><td class="obra">' + esc(x.quien || "\u2014") + '</td>' +
          '<td>' + esc(x.unidad || "\u2014") + '</td>' +
          '<td>' + esc(x.obra || "\u2014") + '</td>' +
          '<td>' + esc(x.tipo === "inicial" ? "inicial de crédito" : "cuota") + '</td>' +
          '<td class="num">' + soles(x.monto) + '</td></tr>';
      });
      h += '</tbody></table></div>' +
        '<p class="mas">' + (tc.resto_filas
          ? 'Son los <b>' + ent(tc.detalle.length) + ' cobros más grandes</b> de los ' +
            ent(tc.filas) + ' del mes. Los otros ' + ent(tc.resto_filas) + ' suman ' +
            soles(tc.resto) + ', y los ' + ent(tc.filas) + ' juntos dan ' + soles(tc.monto) +
            ' — el mismo «Entró» de arriba.'
          : (tc.filas === 1
              ? 'Es el <b>único cobro del mes</b>: '
              : 'Son los <b>' + ent(tc.filas) + ' cobros del mes</b>, todos: suman ') +
            soles(tc.monto) + ', el mismo «Entró» de arriba.') +
        ((m.entro_inicial || m.entro_cuota)
          ? ' De los ' + soles(c) + ' que entraron, <b>' + soles(m.entro_inicial || 0) +
            '</b> son cuotas iniciales de crédito y <b>' + soles(m.entro_cuota || 0) +
            '</b> son cuotas del cronograma.'
          : '') +
        ' Es la misma cifra que la tarjeta «Cobrado» de Resultados y que el bloque ' +
        '«Cobrado» de la hoja Cobranza: una sola lectura, tres pantallas.</p>';
    }

    if (bancos.length > 1 || (tg.detalle || []).length) {
      h += '<h3 style="margin-top:var(--e4);display:flex;align-items:center;gap:var(--e3);' +
        'flex-wrap:wrap"><span>Qué salió</span>' +
        (bancos.length > 1
          ? '<label style="font:inherit;font-weight:var(--p-cuerpo);display:flex;' +
            'align-items:center;gap:6px"><span class="mas" style="margin:0">Banco</span>' +
            '<select data-refiltra style="font:inherit"><option value=""' +
            (bancoSel ? '' : ' selected') + '>Todos</option>' +
            bancos.map(function (b) { return '<option' + (b === bancoSel ? ' selected' : '') +
              '>' + esc(b) + '</option>'; }).join('') + '</select></label>'
          : '') + '</h3>';
    }
    if ((tg.detalle || []).length) {
      h += '<div class="envoltura-tabla"><table class="datos"><thead><tr>' +
        '<th>Fecha</th><th>Concepto</th><th>Rótulo</th><th>Proyecto</th><th>Cuenta</th>' +
        '<th class="num">Monto</th></tr></thead><tbody>';
      tg.detalle.forEach(function (x) {
        h += '<tr><td>' + esc(x.fecha) + '</td><td class="obra">' + esc(x.concepto || "\u2014") + '</td>' +
          '<td>' + esc(x.rotulo || "\u2014") + '</td><td>' + esc(x.obra || "\u2014") + '</td>' +
          '<td>' + esc(x.cuenta || "\u2014") + '</td>' +
          '<td class="num">' + soles(x.monto) + '</td></tr>';
      });
      h += '</tbody></table></div>' +
        '<p class="mas">' + (tg.resto_filas
          ? 'Son los <b>' + ent(tg.detalle.length) + ' gastos más grandes</b> de los ' +
            ent(tg.filas) + ' movimientos del mes. Los otros ' + ent(tg.resto_filas) +
            ' suman ' + soles(tg.resto) + ', y los ' + ent(tg.filas) + ' juntos dan ' +
            soles(tg.monto) + ' — el mismo «Salió» de arriba. El rótulo va tal como lo ' +
            'escribe AXION.'
          : (tg.filas === 1
              ? 'Es el <b>único movimiento del mes</b>: '
              : 'Son los <b>' + ent(tg.filas) + ' movimientos del mes</b>, todos: suman ') +
            soles(tg.monto) + ', el mismo «Salió» de arriba.') + '</p>';
    } else if (bancoSel) {
      h += '<p class="mas">Ningún movimiento de este mes salió de «' + esc(bancoSel) +
        '» con el resto de los filtros puestos.</p>';
    }

    var _repartoDe = function (xs, campo, tope) {
      var g = {};
      xs.forEach(function (x) {
        var k = (x[campo] || "").trim() || (campo === "rotulo" ? "(sin rótulo en AXION)"
          : campo === "obra" ? "(sin obra cargada)" : "(sin cuenta cargada)");
        g[k] = g[k] || {que: k, monto: 0, filas: 0};
        g[k].monto += x.monto || 0; g[k].filas++;
      });
      var ord = Object.keys(g).map(function (k) { return g[k]; })
        .sort(function (a, b) { return b.monto - a.monto; });
      var out = ord.slice(0, tope || 8);
      if (ord.length > (tope || 8)) {
        var resto = ord.slice(tope || 8);
        out.push({que: "otros " + resto.length,
                  monto: resto.reduce(function (s, x) { return s + x.monto; }, 0),
                  filas: resto.reduce(function (s, x) { return s + x.filas; }, 0)});
      }
      return out;
    };
    var rg = filtroObra || bancoSel
      ? {rotulo: _repartoDe(fGastoBanco, "rotulo", 8), obra: _repartoDe(fGastoBanco, "obra", 8),
         cuenta: _repartoDe(fGastoBanco, "cuenta", 8)}
      : (m.reparto_gasto || {});
    var cortes = [["rotulo", "Por rótulo de AXION"], ["obra", "Por obra"],
                  ["cuenta", "Por cuenta bancaria"]];
    var hayCorte = cortes.some(function (q) { return (rg[q[0]] || []).length; });
    if (hayCorte) {
      h += '<h3 style="margin-top:var(--e4)">Todo lo que salió, repartido</h3>' +
        '<p class="mas">Los tres cortes reparten los mismos ' + soles(s) + ': cada uno suma el ' +
        '«Salió» del mes por su cuenta, así que se leen por separado y no se suman entre sí.</p>' +
        '<div class="rejilla-3" style="margin-top:var(--e3)">';
      cortes.forEach(function (q) {
        var xs = rg[q[0]] || [];
        if (!xs.length) return;
        h += '<div><span class="overline" style="display:block;margin-bottom:6px">' +
          esc(q[1]) + '</span><table class="datos"><thead><tr><th>Concepto</th>' +
          '<th class="num">Monto</th></tr></thead><tbody>';
        xs.forEach(function (x) {
          h += '<tr><td class="obra"><span class="ob-nom">' + esc(x.que) + '</span>' +
            '<span class="ob-sub">' + ent(x.filas) +
            (x.filas === 1 ? ' movimiento' : ' movimientos') + '</span></td>' +
            '<td class="num">' + soles(x.monto) + '</td></tr>';
        });
        h += '</tbody></table></div>';
      });
      h += '</div>';
    }
    return h;
  },

  detInd: function (i) {
    var x = (this._ind || [])[i];
    if (!x) return '<button class="cerrar">Cerrar</button><p>Ese indicador ya no está.</p>';
    var per = (this._per || []).filter(function (y) { return y.indicador === x.indicador; })[0];
    var campos = [
      ["Cómo se calcula", x.calculo],
      ["Alcance de la cifra", x.alcance],
      ["Por qué no se puede calcular", x.motivo],
      ["Qué hace falta", x.necesita],
      ["Ojo con esto", x.ojo],
      ["Área que lo responde", x.area || x.area_bsc],
      ["Estado", x.estado + (x.propio ? " · indicador propuesto por el proyecto, no de Habitat" : "")]
    ];
    if (per && per.valor !== null && per.valor !== undefined)
      campos.push(["En el período elegido (" + ((D.nombres_mes || {})[P] || P) + ")",
        (function(u){ return u === "%" ? pct(per.valor) : u === "N°" ? ent(per.valor)
                                                                     : soles(per.valor); })(x.unidad_valor || x.unidad)]);

    var s = (D.series || {})[x.indicador];
    var h = '<button class="cerrar">Cerrar</button><h3>' + esc(x.indicador) + '</h3>' +
      '<div class="regla">' + esc(x.objetivo || "") + '</div>';
    h += '<div class="rejilla-2"><div>';
    var mitad = Math.ceil(campos.filter(function (c) { return c[1]; }).length / 2), k = 0;
    campos.forEach(function (c) {
      if (!c[1]) return;
      if (k === mitad) h += '</div><div>';
      h += '<span class="overline" style="display:block;margin-bottom:4px' +
        (k === 0 || k === mitad ? '' : ';margin-top:var(--e3)') + '">' + esc(c[0]) + '</span>' +
        '<p>' + esc(c[1]) + '</p>';
      k++;
    });
    h += '</div></div>';

    if (s && s.puntos) {
      var ks = Object.keys(s.puntos).sort(function (a, b) { return a - b; });
      h += '<h3 style="margin-top:var(--e4)">Mes a mes</h3>';
      if (s.plana) {
        h += '<p class="mas">Esta cifra es una foto de hoy, no una serie: da el mismo valor en ' +
          'los ' + ks.length + ' meses porque no se mide por mes. Se muestra el valor, no una ' +
          'curva que no existe.</p>';
      }
      h += '<div class="envoltura-tabla"><table class="datos"><thead><tr>';
      ks.forEach(function (kk) {
        h += '<th class="num">' + esc((D.nombres_mes || {})[kk] || kk) + '</th>';
      });
      h += '</tr></thead><tbody><tr>';
      ks.forEach(function (kk) {
        var v = s.puntos[kk];
        h += '<td class="num">' +
          (function(u){ return u === "%" ? pct(v) : u === "N°" ? ent(v) : soles(v); })(x.unidad_valor || x.unidad) + '</td>';
      });
      h += '</tr></tbody></table></div>';
      if (s.en_curso && s.dia && s.dias_mes)
        h += '<p class="mas">El último mes va al día ' + ent(s.dia) + ' de ' + ent(s.dias_mes) +
          ': no es comparable contra un mes cerrado.</p>';
    }
    return h;
  },

  conectar: function (M, D) {
    document.querySelectorAll(".graf-caja .col[data-mes]").forEach(function (c) {
      var ir = function () {
        var k = c.getAttribute("data-mes");
        P = (P === k) ? "None" : k;
        var sp = document.getElementById("f-periodo");
        if (sp) sp.value = P;
        pintar();
        var r = document.getElementById("caja-meses");
        if (r) r.scrollIntoView({behavior: "smooth", block: "start"});
      };
      c.addEventListener("click", ir);
      c.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ir(); }
      });
    });
    var n = this.listaHallazgos(D).length;
    sello(n ? n + " hallazgos de data · quién los responde" : "", "hallazgos");
  }
};
