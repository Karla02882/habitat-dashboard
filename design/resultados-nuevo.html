<script>
window.HOJA = {
  id: "resultados",
  nombre: "Resultados",
  filtros: ["tipo"],
  pregunta: "",
  fuentes: ["AXION", "KOMMO"],
  pintar: function (M, D) { return __cuerpo(M, D); },
  detalle: function (id, el) {
    if (id.indexOf("proy-") === 0) return detalleProyeccion(id.slice(5));
    if (id.indexOf("cajames-") === 0) return detalleCajaMes(id.slice(8));
    if (id.indexOf("arrmes-") === 0) return panelArrastreMes(D, id.slice(7));
    if (id === "caja") return detalleCaja();
    if (id === "modalidad") return detalleModalidad(el.getAttribute("data-mod"));
    if (id === "obra")      return detalleObra(el.getAttribute("data-obra"));
    if (id === "asesor")    return detalleAsesor(el.getAttribute("data-asesor"));
    if (id === "hsc")       return detalleVentasDe(null,
      "Ventas cuyo cobro no se puede leer en ningún lado",
      "No tienen nada cargado en cuentas por cobrar, y el módulo de ventas tampoco registra " +
      "dinero entregado. Quedan fuera de los DOS lados del porcentaje — no suman en lo cobrado ni " +
      "en la base. No dice que no hayan pagado: dice que no hay dónde verlo.");
    if (id === "hsci")      return detalleVentasDe("sin_cargar",
      "Ventas cobradas que no están cargadas en cuentas por cobrar",
      "El módulo de ventas dice que estas ventas ya recibieron dinero, pero cuentas por cobrar " +
      "—que es de donde sale toda cifra de cobro de este tablero— no tiene ningún pago de ellas. " +
      "Por eso figuran en cero. Cargarlas es de Contabilidad.");
    if (id === "hcomp")     return detalleVentasDe("hermana",
      "Ventas que comparten crédito con otra del mismo cliente",
      "Un solo crédito cubre dos unidades —«COCHERA 6 + DPTO 1003»— porque el cliente compró dos " +
      "y en AXION se unificaron. El crédito queda del lado de una de las dos para no contar sus " +
      "pagos dos veces, y la otra aparece acá. Su cobro SÍ está contado, del lado de la venta " +
      "hermana: estas ventas siguen dentro de la base del porcentaje.");
    if (id === "hfuturo") {
      var pf2 = (D.flujo || {}).pagos_futuros || [];
      var h2 = '<button class="cerrar">Cerrar</button><h3>Pagos con fecha futura · ' +
        pf2.length + '</h3>' +
        '<div class="regla">Fechados después de hoy y sumando en el «Cobrado» del año. ' +
        'Es data de Habitat: se muestra y no se corrige — decidir si el pago ocurrió o si la ' +
        'fecha está mal es de ellos.</div>' +
        '<div class="envoltura-tabla"><table class="datos"><thead><tr>' +
        '<th class="fecha">Fecha cargada</th><th>Cliente</th><th>Unidad</th><th>Tipo</th>' +
        '<th class="num">Monto</th></tr></thead><tbody>';
      pf2.forEach(function(x){
        h2 += '<tr><td class="fecha">' + esc(x.fecha) + '</td><td class="obra">' +
          esc(x.quien) + '</td><td>' + esc(x.unidad) + '</td><td>' + esc(x.tipo) + '</td>' +
          '<td class="num">' + soles(x.monto) + '</td></tr>';
      });
      return h2 + '</tbody></table></div>';
    }
    if (id === "hcontado")  return detalleContado(
      (D.meses[P] || D.meses["None"]).estructura.contado_incompleto,
      "Ventas «al contado» que no están pagadas completas",
      "El contado se paga entero al firmar. Estas no lo están, y llevan los días que dice la " +
      "última columna. O el pago existe y falta registrarlo en AXION, o la venta no era al " +
      "contado y está mal clasificada. Cualquiera de las dos la resuelve Habitat: el tablero " +
      "las muestra, no las corrige.");
    if (id === "hfresco")   return detalleContado(
      (D.meses[P] || D.meses["None"]).estructura.contado_recien_firmado,
      "«Al contado» firmadas esta semana",
      "Todavía dentro del plazo de gracia. Se listan para que se vean, no para reclamarlas.");
    return null;          /* que lo resuelva el drill genérico del motor */
  },
  conectar: function () { conectarGrafico(); conectarBuscadorObras(); }
};


function conectarBuscadorObras(){
  var t = document.getElementById("tabla-obras");
  if (!t) return;
  var i = document.querySelector(".fo-txt"),
      sel = document.querySelector(".fo-sel"),
      mes = document.querySelector(".fo-mes"),
      res = document.querySelector(".fo-resumen");
  var filas = [].slice.call(t.querySelectorAll("tbody tr.fila-obra"));

  if (mes) {
    mes.innerHTML = "";
    Object.keys(D.nombres_mes).forEach(function(k){
      var o = document.createElement("option");
      o.value = k; o.textContent = D.nombres_mes[k]; mes.appendChild(o);
    });
    mes.value = P;
    mes.addEventListener("change", function(){
      P = mes.value;
      document.getElementById("f-periodo").value = P;
      pintar();
    });
    mes.addEventListener("click", function(e){ e.stopPropagation(); });
  }

  /* saltar directo a una obra: la abre y la deja a la vista */
  if (sel) {
    sel.innerHTML = '<option value="">Todas · ' + filas.length + '</option>';
    filas.forEach(function(f){
      var n = f.getAttribute("data-obra");
      var o = document.createElement("option"); o.value = n; o.textContent = n; sel.appendChild(o);
    });
    sel.addEventListener("change", function(){
      var n = sel.value;
      filas.forEach(function(f){
        var esa = f.getAttribute("data-obra") === n;
        if (f.getAttribute("aria-expanded") === "true") f.click();
        f.style.display = (!n || esa) ? "" : "none";
      });
      var tot = t.querySelector("tr.total");
      if (tot) tot.style.display = n ? "none" : "";
      if (n) {
        var f = filas.filter(function(x){ return x.getAttribute("data-obra") === n; })[0];
        if (f) { f.click(); f.scrollIntoView({behavior:"smooth", block:"center"}); }
      }
      if (res) res.textContent = n ? "1 de " + filas.length + " obras" : "";
    });
    sel.addEventListener("click", function(e){ e.stopPropagation(); });
  }

  if (i) {
    i.addEventListener("input", function(){
      var q = i.value.trim().toLowerCase(), n = 0;
      filas.forEach(function(f){
        var ok = !q || f.cells[0].textContent.toLowerCase().indexOf(q) >= 0;
        f.style.display = ok ? "" : "none";
        if (ok) n++;
      });
      var tot = t.querySelector("tr.total");
      if (tot) tot.style.display = q ? "none" : "";
      if (res) res.textContent = q ? n + " de " + filas.length + " obras" : "";
    });
    i.addEventListener("click", function(e){ e.stopPropagation(); });
  }
}

function conectarGrafico(){
  document.querySelectorAll(".graf-caja .col").forEach(function(c){
    var ir = function(){
      var k = c.getAttribute("data-mes");
      P = (P === k) ? "None" : k;
      document.getElementById("f-periodo").value = P;
      pintar();
      document.querySelector(".heroe").scrollIntoView({behavior:"smooth", block:"start"});
    };
    c.addEventListener("click", ir);
    c.addEventListener("keydown", function(e){
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ir(); } });
  });
}

function cifraSol(id, k, v, n, clave, extra){
  return '<div class="col-sol"><div' +
    (clave ? ' class="abrible" data-abre="' + id + '" data-drill="' + esc(clave) +
      '" aria-expanded="false" tabindex="0" role="button"' : '') +
    '><span class="k">' + esc(k) + '</span>' +
    '<div class="v"' + (v == null ? ' style="color:var(--gris-300)"' : '') + '>' +
    (v == null ? "—" : soles(v)) + '</div><div class="n">' + esc(n) + '</div>' +
    (clave ? '<div class="abrir abrir-osc"><span>Ver las filas que la componen</span>' +
             '<span class="flecha">▸</span></div>' : '') + '</div>' +
    (extra || "") + '</div>';
}

function desgloseModalidad(E){
  var m = E.modalidad || [];
  if (!m.length) return "";
  var T = E.contratado || 0;
  var h = '<div class="desglose"><span class="rot">De qué está hecho · clic para abrir cada uno</span>';
  m.forEach(function(x, i){
    var bm = (x.base !== undefined && x.base !== null) ? x.base : x.monto;
    var pEntro = bm > 0 ? 100 * x.entro / bm : null;
    h += '<div class="mod-linea abrible" data-abre="modalidad" data-mod="' + i + '" ' +
         'aria-expanded="false" tabindex="0" role="button">' +
         '<div class="mod-top"><span class="mod-nom">' + esc(x.modalidad) + '</span>' +
         '<span class="mod-monto">' + soles(x.monto) + '</span></div>' +
         '<span class="rielm"><span style="width:' + (T ? Math.max(1, 100*x.monto/T) : 0) + '%"></span></span>' +
         '<div class="mod-pie"><span>' + x.ventas + ' ventas · ' + pct(T ? 100*x.monto/T : 0) +
         ' de lo firmado</span><span class="mod-entro"' +
         (x.sin_credito ? ' title="' + x.sin_credito + ' venta(s) de esta modalidad sin crédito cargado quedan fuera de los dos lados de la división"' : '') +
         '>' + (pEntro === null ? 'sin dónde medirlo' : 'entró ' + pct(pEntro)) +
         '</span></div>' +
         (pEntro !== null && pEntro > 100.5
           ? '<p class="mod-aviso" style="margin:2px 0 0;font-size:12px;color:var(--texto-suave)">' +
             'entró más de lo firmado: hay ventas que cobraron por encima de su precio — ' +
             'abrí la fila para verlas, con su recibo</p>'
           : '') +
         '</div>';
  });
  return h + '</div>';
}

function desgloseCobranza(res, M){
  var kPC = drillDe(M, ["Por cobrar"]), kVen = drillDe(M, ["De eso, ya vencido"]);
  var vPC = cifraDe(res, ["Por cobrar"]), vVen = cifraDe(res, ["De eso, ya vencido"]);
  if (vPC == null && vVen == null) return "";
  var h = '<div class="desglose"><span class="rot">La cartera entera · no es del período</span>';
  if (vPC != null)
    h += lineaCobranza("porcobrar", kPC, "Por cobrar", vPC,
      "lo que FALTA cobrar a hoy, de todos los créditos vivos — no es dinero que entró ni cifra del período");
  if (vVen != null)
    h += lineaCobranza("vencido", kVen, "De eso, ya venció", vVen,
      "de ese saldo, lo que ya venció y sigue sin cobrarse · tampoco es del período", true);
  return h + '</div>';
}
function lineaCobranza(id, clave, rot, v, nota, alerta){
  return '<div class="mod-linea' + (clave ? ' abrible' : '') + '"' +
    (clave ? ' data-abre="' + id + '" data-drill="' + esc(clave) + '" aria-expanded="false" ' +
             'tabindex="0" role="button"' : '') + '>' +

  });

      '</div>' +

function detalleCajaMes(mes){
  if (mes === "arr") return panelArrastre(D);
  if (String(mes).indexOf("arrmes-") === 0) return panelArrastreMes(D, String(mes).slice(7));
  var ms = window.__meses || [];
  var m = ms.filter(function(x){ return String(x.mes) === String(mes); })[0];
  if (!m) return '<button class="cerrar">Cerrar</button><p>Ese mes no está.</p>';

  var filtroObra = !!(RS || OBRA || TIPO);
  var _filtra = function (xs) {
    return (xs || []).filter(function (x) { return entraObra(x.obra || ""); });
  };
  var _suma = function (xs) {
    return xs.reduce(function (s, x) { return s + (x.monto || 0); }, 0);
  };
  var _topDe = function (xs, tope) {
    var ord = xs.slice().sort(function (a, b) { return (b.monto || 0) - (a.monto || 0); });
    var top = ord.slice(0, tope || 10);
    var totMonto = _suma(ord), topMonto = _suma(top);
    return {filas: ord.length, monto: totMonto, detalle: top,
            resto: totMonto - topMonto, resto_filas: ord.length - top.length};
  };
  var fCobroTodas = m.filas_cobro || [], fGastoTodas = m.filas_gasto || [];
  var fCobro = filtroObra ? _filtra(fCobroTodas) : fCobroTodas;
  var fGasto = filtroObra ? _filtra(fGastoTodas) : fGastoTodas;
  var tc = filtroObra ? _topDe(fCobro, 10) : (m.top_cobros || {});

  var bancos = Array.from(new Set(fGasto.map(function (x) { return x.cuenta || ""; })
    .filter(function (x) { return x; }))).sort();
  var bancoSel = refiltro("cajames-" + mes);
  var fGastoBanco = bancoSel ? fGasto.filter(function (x) { return (x.cuenta || "") === bancoSel; }) : fGasto;
  var tg = filtroObra || bancoSel ? _topDe(fGastoBanco, 10) : (m.top_gastos || {});
  var bancoHtml = bancos.length > 1
    ? '<label style="font:inherit;font-weight:var(--p-cuerpo);display:inline-flex;' +
      'align-items:center;gap:6px;margin-left:var(--e3)"><span class="mas" style="margin:0">Banco</span>' +
      '<select data-refiltra style="font:inherit"><option value=""' +
      (bancoSel ? '' : ' selected') + '>Todos</option>' +
      bancos.map(function (b) { return '<option' + (b === bancoSel ? ' selected' : '') +
        '>' + esc(b) + '</option>'; }).join('') + '</select></label>'
    : '';

  function lado(titulo, d, cols, regla, extraHtml){
    if (!d.filas) return '<div><span class="overline">' + esc(titulo) + '</span>' +
      (extraHtml || '') +
      '<p style="color:var(--texto-suave)">Sin movimientos este mes.</p></div>';
    var h2 = '<div><span class="overline">' + esc(titulo) + ' · ' + soles(d.monto) +
      ' en ' + ent(d.filas) + '</span>' + (extraHtml || '') +
      '<p class="linea-meta" style="margin:var(--e2) 0">' + regla + '</p>' +
      '<div class="envoltura-tabla"><table class="datos"><thead><tr>' +
      cols.map(function(c){ return '<th' + (c.num ? ' class="num"' : '') + '>' +
        esc(c.rot) + '</th>'; }).join('') + '</tr></thead><tbody>';
    (d.detalle || []).forEach(function(x){
      h2 += '<tr>' + cols.map(function(c){
        var v = c.num ? soles(x[c.k]) : esc(x[c.k] || '—');
        return '<td' + (c.num ? ' class="num"' : (c.obra ? ' class="obra"' : '')) +
          '>' + v + '</td>';
      }).join('') + '</tr>';
    });
    h2 += '</tbody></table></div>';
    return h2 + '</div>';
  }

  return '<button class="cerrar">Cerrar</button><h3>' + esc(m.etiqueta) +
    ' · de qué está hecho</h3>' +
    (filtroObra ? '<p class="linea-meta">Con el filtro puesto, es un piso: solo cuenta lo que ' +
      'lleva la obra o la razón social elegida cargada.</p>' : '') +
    '<div class="dos-lados">' +
    lado('Top 10 de lo cobrado', tc,
         [{rot:'Fecha', k:'fecha'}, {rot:'Cliente', k:'quien', obra:true},
          {rot:'Obra', k:'obra'}, {rot:'Unidad', k:'unidad'}, {rot:'Tipo', k:'tipo'},
          {rot:'Monto', k:'monto', num:true}],
         'Sale de <b>cuentas por cobrar</b>: iniciales de crédito y cuotas, ' +
         'cada una con su recibo.') +
    lado('Top 10 de los gastos de caja', tg,
         [{rot:'Fecha', k:'fecha'}, {rot:'Concepto', k:'concepto', obra:true},
          {rot:'Obra', k:'obra'}, {rot:'Monto', k:'monto', num:true}],
         'Sale del <b>Registro de Movimientos</b>. La columna «Obra» viene ' +
         'vacía antes de agosto: ese campo empezó a cargarse recién este mes.',
         bancoHtml) +
    '</div>';
}

function obrasDelPeriodo(M){
  var E = M.estructura || {}, mapa = {};
  /* la etapa la declara AXION en `Project`; el motor la publica en /obras */
  var etapa = {};
  (D.obras || []).forEach(function(o){ etapa[o.obra] = o.etapa; });
  (E.modalidad || []).forEach(function(m){
    (m.detalle || []).forEach(function(x){
      if (!entraObra(x.obra)) return;
      var o = mapa[x.obra] || (mapa[x.obra] = {
        obra: x.obra, etapa: etapa[x.obra] || "", ventas: 0, contratado: 0,
        entro: 0, entro_axion: 0, falta: 0, sin_credito: 0, compartido: 0,
        base: 0, mods: {} });
      o.ventas++;
      o.contratado += x.precio || 0;
      o.entro += x.entro || 0;
      o.entro_axion += x.entro_axion || 0;
      o.falta += x.falta || 0;
      if (!x.entro_de) o.sin_credito++; else o.base += x.precio || 0;
      if (x.credito_compartido) o.compartido++;
      o.mods[m.modalidad] = (o.mods[m.modalidad] || 0) + 1;
    });
  });
  return Object.keys(mapa).map(function(k){
    var o = mapa[k];
    o.ticket = o.ventas ? o.contratado / o.ventas : 0;
    return o;
  }).sort(function(a,b){ return b.contratado - a.contratado; });
}

function seccionObras(M){
  var obras = obrasDelPeriodo(M);
  if (!obras.length) return '<section class="seccion"><div class="tarjeta">' +
    '<p>Ninguna obra firmó en este período con el filtro puesto.</p></div></section>';
  var tot = 0, tv = 0, te = 0, tf = 0, tsc = 0, tbase = 0, tcomp = 0;
  obras.forEach(function(o){ tot += o.contratado; tv += o.ventas; te += o.entro;
                             tf += o.falta; tsc += o.sin_credito;
                             tbase += o.base; tcomp += o.compartido; });
  var max = obras[0].contratado || 1;
  var h = '<section class="seccion" id="obras"><div class="seccion-cab">' +
    '<h2>Ventas por proyecto</h2></div>' +
    '<div class="tarjeta" style="padding:var(--e4) var(--e2)">' +
    '<div class="envoltura-tabla"><table class="datos" id="tabla-obras"><thead><tr>' +
      '<th>Proyecto</th><th style="width:42%">Contratado y cobrado</th>' +
      '<th class="num">Cobrado</th><th class="num">%</th></tr></thead><tbody>';
  obras.forEach(function(o){
    var p = o.base > 0 ? 100 * o.entro / o.base : null;
    var anchoTotal = Math.max(3, 100 * o.contratado / max);
    h += '<tr class="fila-obra abrible" data-abre="obra" data-obra="' + esc(o.obra) + '" ' +
      'aria-expanded="false" tabindex="0" role="button">' +
      '<td class="obra"><span class="ob-nom">' + esc(o.obra) +
        (o.sin_credito ? ' <span class="marca" title="' + o.sin_credito +
          ' venta(s) de esta obra no tienen nada en cuentas por cobrar ni dinero registrado en el módulo de ventas: su cobro no se puede leer en ningún lado, así que quedan fuera de los dos lados de este porcentaje">' +
          o.sin_credito + (o.sin_credito === 1 ? ' venta sin cobro legible' : ' ventas sin cobro legible') + '</span>' : '') +
        '</span></td>' +
      '<td><span class="riel-obra" style="width:' + anchoTotal + '%">' +
        '<span class="lleno" style="width:' + Math.max(o.entro ? 1.5 : 0, p || 0) + '%"></span></span></td>' +
      '<td class="num">' + (o.entro ? soles(o.entro)
        : '<span class="raya" title="ninguna venta de esta obra tiene su cobro cargado en cuentas por cobrar">sin dato</span>') + '</td>' +
      '<td class="num">' + (p === null
        ? '<b class="pct-obra raya" title="las ' + o.sin_credito + ' ventas de esta obra ' +
          'están sin crédito cargado: no hay dónde leer el cobro">s/d</b>'
        : '<b class="pct-obra">' + pct(p) + '</b>') + '</td></tr>';
  });
  h += '<tr class="total"><td class="obra"><span class="ob-nom">TOTAL</span>' +
    '<span class="ob-sub">' + tv + ' ventas · falta cobrar ' + soles(tf) + '</span></td>' +
    '<td><span class="riel-obra" style="width:100%"><span class="lleno" style="width:' +
      (tbase ? 100*te/tbase : 0) + '%"></span></span></td>' +
    '<td class="num">' + soles(te) + '</td>' +
    '<td class="num"><b class="pct-obra">' + pct(tbase ? 100*te/tbase : 0) + '</b></td></tr>' +
    '</tbody></table></div>' +
(tsc ? '<p class="mas" style="padding:0 var(--e2)"><b>' + tsc +
      (tsc === 1 ? ' venta del período no tiene su cobro cargado en ningún lado'
                 : ' ventas del período no tienen su cobro cargado en ningún lado') +
      '</b> — ni cronograma dentro del crédito, ni el campo «INGRESO REAL» de la venta ' +
      'de la venta. Por eso quedan fuera de los dos lados del porcentaje de arriba: no suman en lo ' +
      'cobrado ni en la base. <b>No dice que no hayan pagado, dice que no hay dónde verlo</b>, y ' +
      'cargarlo es de Comercial.' +
      '</p>' : '') +
    '</div><div class="detalle" id="det-obra"></div>' +
    '<div class="detalle" id="det-vendido"></div></section>';
  return h;
}

function seccionHallazgos(E){
  var hs = [];
  var ci = E.contado_incompleto || [];
  var cf = E.contado_recien_firmado || [];
  if (ci.length) {
    var falta = ci.reduce(function(s,x){ return s + (x.falta||0); }, 0);
    var viejo = ci.filter(function(x){ return (x.dias||0) > 30; });
    hs.push({ id: "hcontado", q: ci.length + ' ventas «al contado» que no están pagadas completas',
      txt: 'El contado se paga todo al firmar. Faltan <b class="cif">' + soles(falta) + '</b>' +
           (viejo.length ? ', y <b class="cif">' + viejo.length + '</b> de ellas llevan más de un ' +
             'mes así — la más vieja, ' + Math.max.apply(null, ci.map(function(x){return x.dias||0;})) +
             ' días.' : '.') +
           ' O fueron al contado y falta registrar el pago, o no eran contado. Las dos ' +
           'posibilidades las resuelve Habitat, no el tablero.',
      quien: "Cobranzas", n: ci.length, filas: ci });
  }
  if (cf.length) {
    hs.push({ id: "hfresco", q: cf.length + ' venta(s) «al contado» firmadas esta semana',
      txt: 'Todavía no cuentan como problema: tienen <b class="cif">' + (E.dias_gracia || 7) +
           ' días</b> de gracia para que se registre el pago. Se muestran aparte para que nadie ' +
           'las confunda con las atrasadas.',
      quien: "—", n: cf.length, filas: cf });
  }
  if (E.sin_credito) {
    hs.push({ id: "hsincred", q: E.sin_credito + " ventas sin cobro legible en AXION",
      txt: 'Suman <b class="cif">' + soles(E.monto_sin_credito) + '</b>. Lo cobrado se lee dentro ' +
           'del crédito, así que sin él no hay dónde mirarlo: estas ventas quedan fuera de los dos ' +
           'lados del porcentaje de cobranza.',
      quien: "Comercial", n: E.sin_credito });
  }
  if (E.clientes_con_varias_ventas) {
    hs.push({ q: E.clientes_con_varias_ventas + " clientes con más de una venta en el período",
      txt: 'No es un error por sí solo —un cliente puede comprar dos unidades—, pero es donde ' +
           'aparecen los registros duplicados. Vale revisarlos uno por uno.',
      quien: "Comercial", n: E.clientes_con_varias_ventas });
  }
  var pf = (D.flujo || {}).pagos_futuros || [];
  if (pf.length) {
    var mpf = pf.reduce(function(s,x){ return s + (x.monto||0); }, 0);
    hs.push({ id: "hfuturo", q: pf.length + ' pago(s) con fecha FUTURA dentro de lo cobrado',
      txt: 'Suman <b class="cif">' + soles(mpf) + '</b> y están fechados después de hoy, pero ' +
           'ya cuentan en el «Cobrado» del año como si hubieran entrado. O son pagos ' +
           'programados cargados como cobrados, o la fecha está mal tipeada.',
      quien: "Cobranzas", n: pf.length, filas: pf });
  }
  var dg = (D.flujo || {}).diagnostico_presupuesto;
  if (dg) {
    hs.push({ q: 'Lo cargado como «presupuesto» no es un plan de gasto',
      txt: 'En <b class="cif">' + dg.meses + ' meses</b> coincide con el gasto real al centavo — ' +
        'en ' + esc(dg.ejemplo_mes) + ', <b class="cif">' + soles(dg.ejemplo_dif) + '</b> de ' +
        'diferencia sobre ' + soles(dg.ejemplo_gasto) + '. Son <b class="cif">' + dg.total_filas +
        '</b> traspasos entre cuentas del propio grupo, <b class="cif">' + dg.sin_obra +
        '</b> sin obra. <b>Se retiró de la tabla</b> hasta que se cargue un plan de verdad: ' +
        'mostrarla haría creer que el presupuesto se cumple todos los meses.',
      quien: "Administración" });
  }
  if (E.descuadre) {
    hs.push({ q: "El saldo de AXION y la resta no coinciden",
      txt: 'Contratado menos lo que entró da <b class="cif">' + soles(E.falta) + '</b>, pero el ' +
           'saldo que AXION declara para esas mismas ventas es <b class="cif">' + soles(E.saldo) +
           '</b>. Difieren en <b class="cif">' + soles(Math.abs(E.descuadre)) + '</b>. ' +
           'Las dos cifras son legítimas y miden cosas distintas — hay que decir cuál manda ' +
           'antes de publicar «lo que falta cobrar».',
      quien: "Cobranzas" });
  }
  var sello = document.getElementById("sello-hallazgos");
  if (sello) {
    sello.textContent = hs.length
      ? "Ver los " + hs.length + (hs.length === 1 ? " hallazgo" : " hallazgos") + " ↓"
      : "sin hallazgos en este período";
    sello.style.display = "";
    sello.classList.toggle("clicable", hs.length > 0);
    sello.onclick = hs.length ? function(){
      var s = document.getElementById("hallazgos");
      if (s) s.scrollIntoView({behavior:"smooth", block:"start"});

  if (!hs.length) return "";
  var h = '<section class="seccion" id="hallazgos"><div class="seccion-cab"><h2>' + hs.length +

              '<span class="flecha">▸</span></div>' : '') + '</div>' +
      (abre ? '<div class="detalle" id="det-' + x.id + '"></div>' : '');
  });
  return h + '</section>';
}


function celdaEntro(x){
  var de = x.entro_de, ec = x.entro || 0;
  if (de === "credito") return soles(ec);
  if (de === "sin_cargar") return '<span title="El módulo de ventas registra ' +
    soles(x.entro_axion || 0) + ' cobrados de esta venta, y cuentas por cobrar no tiene ningún ' +
    'pago suyo. Este tablero cuenta lo que dice cuentas por cobrar, así que figura en cero.">' +
    '<span class="raya">0.00</span> <small class="marca">sin cargar</small></span>';
  if (de === "hermana") return '<span class="raya" title="Un solo crédito cubre esta unidad y otra ' +
    'del mismo cliente. Su cobro está contado del lado de la venta hermana; ponerlo también acá ' +
    'sería contar el mismo dinero dos veces.">contado en la hermana</span>';
  return '<span class="raya" title="ni cuentas por cobrar ni el módulo de ventas registran nada entregado">—</span>';
}

function detalleVentasDe(de, titulo, regla){

    '</div>' +
    '<div class="envoltura-tabla"><table class="datos"><thead><tr>' +

function detalleContado(filas, titulo, regla){

    h += '<tr><td class="obra"><span class="ob-nom">' + esc(x.cliente || "—") + '</span>' +

      '<td>' + esc(x.obra || "—") + '</td><td>' + esc(x.unidad || "—") + '</td>' +
      '<td>' + esc(x.asesor || "—") + '</td>' +

        : '<span class="raya" title="esta venta no tiene crédito cargado en AXION">sin crédito</span>') +
      '</td>' +
      '<td class="num">' + ((x.abonado_axion || 0) > 0 ? soles(x.abonado_axion)
        : '<span class="raya" title="el campo «INGRESO REAL» de la venta tampoco registra nada">—</span>') +

      '<td class="num">' + soles(x.falta) + '</td>' +
      '<td class="num">' + (x.dias === undefined || x.dias === null ? "—" : x.dias) + '</td></tr>';
  });
  return h + '</tbody></table></div>' +

    'los DOS registros de AXION</b>: el crédito y el campo INGRESO de la venta. Si cualquiera de ' +
    'los dos la da por pagada, no se lista — acusar de impago a un cliente que pagó es peor que ' +
    'no reportar nada.' +
    (nDisc ? ' <b>En ' + nDisc + (nDisc === 1 ? ' de estas ventas los dos registros no coinciden'
                                              : ' de estas ventas los dos registros no coinciden') +

function asesoresDelPeriodo(M){
  var mapa = {};
  ((M.estructura || {}).modalidad || []).forEach(function(m){
    (m.detalle || []).forEach(function(x){
      if (!entraObra(x.obra)) return;
      var k = (x.asesor || "").trim() || "— sin asesor declarado —";
      var a = mapa[k] || (mapa[k] = { asesor: k, ventas: 0, contratado: 0,
                                      entro: 0, entro_axion: 0, falta: 0, base: 0,
                                      sin_credito: 0, obras: {} });
      a.ventas++; a.contratado += x.precio || 0;
      a.entro += x.entro || 0; a.falta += x.falta || 0;
      a.entro_axion += x.entro_axion || 0;
      if (!x.entro_de) a.sin_credito++; else a.base += x.precio || 0;
      a.obras[x.obra] = 1;
    });
  });
  return Object.keys(mapa).map(function(k){
    var a = mapa[k];
    a.ticket = a.ventas ? a.contratado / a.ventas : 0;
    a.n_obras = Object.keys(a.obras).length;
    return a;
  }).sort(function(x, y){ return y.contratado - x.contratado; });
}

function detalleObra(nombre){
  var M = D.meses[P] || D.meses["None"];
  var filas = [];
  ((M.estructura || {}).modalidad || []).forEach(function(m){
    (m.detalle || []).forEach(function(x){
      if (x.obra === nombre) filas.push({...x, modalidad: m.modalidad});
    });
  });
  if (!filas.length) return '<button class="cerrar">Cerrar</button>' +
    '<p>Sin ventas de «' + esc(nombre) + '» en este período.</p>';
  var _numDe = function (s) {
    var m = String(s || "").match(/\d+/);
    return m ? parseInt(m[0], 10) : null;
  };
  filas.sort(function (a, b) {
    var na = _numDe(a.unidad), nb = _numDe(b.unidad);
    if (na !== null && nb !== null && na !== nb) return na - nb;
    return String(a.unidad || "").localeCompare(String(b.unidad || ""));
  });
  var _porCliente = {};
  filas.forEach(function (x) {
    var k = x.cliente || "";
    (_porCliente[k] = _porCliente[k] || []).push(x);
  });
  filas.forEach(function (x) {
    if (x.entro_de !== "hermana") return;
    var otras = (_porCliente[x.cliente] || []).filter(function (y) {
      return y !== x && y.unidad !== x.unidad;
    });
    x._parejaTxt = otras.length === 1 ? otras[0].unidad
      : otras.length > 1 ? otras.map(function (y) { return y.unidad; }).join(" / ")
      : "";
  });
  var sp = 0, se = 0, sf = 0;
  filas.forEach(function(x){ sp += x.precio || 0; se += x.entro || 0; sf += x.falta || 0; });
  var h = '<button class="cerrar">Cerrar</button><h3>' + esc(nombre) + ' · ' + filas.length +
    ' ventas por ' + soles(sp) + '</h3>' +
    '<div class="resumen-det"><span class="suma">Contratado · <b>' + soles(sp) + '</b></span>' +
    '<span class="suma">Ya entró · <b>' + soles(se) + '</b> · ' + pct(sp ? 100*se/sp : 0) + '</span>' +
    '<span class="suma">Falta · <b>' + soles(sf) + '</b></span></div>' +
    '<div class="envoltura-tabla"><table class="datos"><thead><tr>' +
    '<th>Fecha</th><th>Unidad</th><th>Cliente</th><th>Asesor</th><th>Modalidad</th><th>Banco</th>' +
    '<th class="num">Precio</th><th class="num">Entró</th><th class="num">Falta</th>' +
    '</tr></thead><tbody>';
  filas.forEach(function(x){
    h += '<tr><td>' + esc(x.fecha) + '</td><td class="obra">' + esc(x.unidad) + '</td>' +
      '<td>' + esc(x.cliente) + '</td><td>' + esc(x.asesor || "—") + '</td>' +
      '<td>' + esc(x.modalidad) + '</td>' +
      '<td>' + (x.banco ? esc(x.banco) :
        (x.sin_credito ? '<span class="marca">sin crédito</span>' : '<span class="raya">—</span>')) + '</td>' +
      '<td class="num">' + soles(x.precio) + '</td>' +
      '<td class="num">' + (x._parejaTxt
        ? '<span class="raya" title="Un solo crédito cubre esta unidad y ' + esc(x._parejaTxt) +
          ', del mismo cliente. Su cobro está contado del lado de esa otra unidad.">contado en ' +
          esc(x._parejaTxt) + '</span>'
        : celdaEntro(x)) + '</td>' +
      '<td class="num"' + (x.falta > 0 ? ' style="color:var(--rojo);font-weight:var(--p-etiqueta)"' : '') +
      '>' + (x.falta ? soles(x.falta) : '<span class="raya">—</span>') + '</td></tr>';
  });
  return h + '</tbody></table></div>';
}

      '</td><td class="num"' + (net < 0 ? ' style="color:var(--rojo)"' : '') + '>' +
      (net ? soles(net) : '<span class="raya">—</span>') +
      '</td><td class="num">' + (porEnt ? soles(porEnt) : '<span class="raya">—</span>') +
      '</td></tr>';
  });
  h += '<tr class="total"><td class="obra">TOTAL DEL AÑO</td>' +
    '<td class="num">' + soles(tC) + '</td><td class="num">' + soles(tS) + '</td>' +
    '<td class="num"' + (tC - tS < 0 ? ' style="color:var(--rojo)"' : '') + '>' + soles(tC - tS) + '</td>' +
    '<td class="num">' + soles(tP) + '</td></tr>';
  h += '</tbody></table></div>';
  ms.forEach(function(m){
    h += '<div class="detalle" id="det-cajames-' + m.mes + '"></div>';
  });
  if (((D.flujo || {}).arrastre || {}).hay)
    h += '<div class="detalle" id="det-cajames-arr"></div>';
  return h;
}


function __cuerpo(M, D){
  var _pb = perPartes();
  var _bannerAnio = (!_pb.hist &&
      String(_pb.anio) !== String((D.flujo || {}).anio || ""))
    ? '<p class="linea-meta"><b>Elegiste un período de ' + _pb.anio + '.</b> ' +
      'Las dos tarjetas grandes y sus detalles miden ese período. Los bloques ' +
      'de más abajo —«La caja del año», la proyección, la cola de registro y ' +
      'lo movido entre cuentas— siguen midiendo el año en curso, como dice el ' +
      'título de cada uno. El control completo de ' + _pb.anio + ' está en ' +
      'Finanzas · Gastos.</p>'
    : '';
  var E = M.estructura || {};
  var res = porEtiqueta(M.resultados);
  var kFirmado = drillDe(M, ["Vendido", "Vendido en el mes"]);
  var kCobrado = drillDe(M, ["Cobrado", "Cobrado en el mes"]);
  var vFirmado = cifraDe(res, ["Vendido", "Vendido en el mes"]);
  var vCobrado = cifraDe(res, ["Cobrado", "Cobrado en el mes"]);
  if (OBRA || RS || TIPO) {
    var fO = sumaFiltrada(M, kFirmado), cO = sumaFiltrada(M, kCobrado);
    if (fO !== null) vFirmado = fO;
    if (cO !== null) vCobrado = cO;
  }

  var H = _bannerAnio + '<div class="sol"><span class="overline">Lo firmado y lo cobrado · ' +
    'son preguntas distintas y no se suman entre sí</span>' +
    '<div class="sol-tres sol-dos">' +
      cifraSol("firmado", "Firmado · AXION", vFirmado,
               "Contrato suscrito: mide el compromiso, no la caja." +
               (E && E.entro > 0
                 ? " De esto ya entró " + soles(E.entro) +
                   ((E.base_comparable || vFirmado)
                     ? " — el " + pct(100 * E.entro / (E.base_comparable || vFirmado)) +
                       (E.base_comparable && E.base_comparable < vFirmado - 1
                         ? " de " + soles(E.base_comparable) + ", que es lo firmado " +
                           "menos " + soles(vFirmado - E.base_comparable) + " de " +
                           ent(E.sin_credito || 0) +
                           ((E.sin_credito || 0) === 1 ? " venta cuyo cobro" : " ventas cuyo cobro") +
                           " no se puede leer ni en el crédito ni en la venta"
                         : "")
                     : "") + "."
                 : "") +
               "",
               kFirmado, desgloseModalidad(E)) +
      cifraSol("cobrado", "Cobrado · cuentas por cobrar", vCobrado,
               (perPartes().mes !== null
                 ? "Pagos que Cobranzas anotó contra la cuota de un cliente, con su recibo. " +
                   (vCobrado ? "" : "Este mes no anotó ninguno. ")
                 : (perPartes().hist
                 ? "Plata que entró, con su recibo, en todos los años. "
                 : "Plata que entró en " + perPartes().anio + ", con su recibo. La venta que " +
                   "la origina puede ser de otro año. ")) +
               "",
               kCobrado, desgloseCobranza(res, M)) +
    '</div>' +
    '<div class="detalle" id="det-firmado"></div>' +
    '<div class="detalle" id="det-cobrado"></div>' +
    '<div class="detalle" id="det-modalidad"></div>' +
    '<div class="detalle" id="det-porcobrar"></div>' +
    '<div class="detalle" id="det-vencido"></div></div>';

  H += avisoAlcance(
    "Firmado, Cobrado, la tabla de obras, los asesores, todos los detalles y la caja del año",
    "el porcentaje de abajo, el desglose por modalidad y el gráfico mes a mes");

  var _fil = [];
  (E.modalidad || []).forEach(function(m){
    (m.detalle || []).forEach(function(x){ if (entraObra(x.obra)) _fil.push(x); });
  });
  var contratadoF = 0, entroF = 0, baseCob = 0, sinMedirF = 0, montoSinMedirF = 0;
  _fil.forEach(function(x){
    contratadoF += x.precio || 0;
    entroF += x.entro || 0;
    if (x.entro_de) baseCob += x.precio || 0;
    else { sinMedirF++; montoSinMedirF += x.precio || 0; }
  });
  var pctCob  = baseCob > 0 ? 100 * entroF / baseCob : null;
  var anchoEntro = baseCob > 0 ? Math.max(2, Math.min(100, pctCob)) : 0;
  E = Object.assign({}, E, {
    contratado: contratadoF, entro: entroF, ventas: _fil.length,
    sin_credito: sinMedirF, monto_sin_credito: montoSinMedirF,
    sin_credito_con_ingreso: _fil.filter(function(x){ return x.entro_de === "sin_cargar"; }).length,
    monto_sin_credito_con_ingreso: _fil.filter(function(x){ return x.entro_de === "sin_cargar"; })
      .reduce(function(a, x){ return a + (x.precio || 0); }, 0),
    /* lo que falta cargar: la plata que el módulo de ventas da por cobrada */
    monto_sin_cargar: _fil.filter(function(x){ return x.entro_de === "sin_cargar"; })
      .reduce(function(a, x){ return a + (x.entro_axion || 0); }, 0),
    credito_compartido: _fil.filter(function(x){ return x.entro_de === "hermana"; }).length,
    monto_credito_compartido: _fil.filter(function(x){ return x.entro_de === "hermana"; })
      .reduce(function(a, x){ return a + (x.precio || 0); }, 0)
  });
  H += '<section class="heroe"><div class="barrita"></div><div class="heroe-grid"><div>' +
    '<span class="ov-heroe">Cobrado de lo firmado en el período</span>' +
    (pctCob === null
      ? '<div class="pct-caja"><span class="pct-heroe sin-medir">no se puede medir</span></div>' +
        '<p class="nota-heroe"><b>' + (E.ventas === 1
            ? 'La única venta del período está sin crédito cargado en AXION'
            : 'Las ' + E.ventas + ' ventas del período están sin crédito cargado en AXION') +
        '</b> — ' + soles(E.contratado) + ' en total. ' +
        'Lo cobrado se lee dentro del crédito, así que sin él no hay dónde mirarlo: ' +
        '<b>esto no dice que no hayan pagado, dice que no se puede ver</b>. Es carga pendiente de ' +
        'Comercial.</p>'
      : '<div class="pct-caja"><span class="pct-heroe">' + pct(pctCob) + '</span>' +
        '<span class="pie">' + soles(E.entro) + '<br>de ' + soles(baseCob) +
        (E.monto_sin_credito
          ? '<br><span class="pie-resta">' + soles(E.contratado) + ' firmados − ' +
            soles(E.monto_sin_credito) + ' que no se pueden medir en ningún lado</span>'
          : '') + '</span></div>' +
        '<div class="barra-partida"><div class="entro" style="width:' + anchoEntro + '%">' +
        solesM(E.entro) + ' entró</div></div>' +
        '<div class="barra-pies"><span>ya entró a caja</span><span>' +
        soles(baseCob - E.entro) + ' falta cobrar</span></div>' +
        (function () {
          var chips = [];
          if (E.sin_credito_con_ingreso)
            chips.push('<span class="chip-heroe chip-fuera abrible" data-abre="hsci" ' +
              'aria-expanded="false" tabindex="0" role="button" title="El módulo de ventas dice ' +
              'que ya cobraron, y cuentas por cobrar no lo tiene. Figuran en cero.">' +
              E.sin_credito_con_ingreso +
              (E.sin_credito_con_ingreso === 1 ? ' venta sin cargar' : ' ventas sin cargar') +
              ' en cuentas por cobrar · ' + soles(E.monto_sin_cargar) + ' ▸</span>');
          if (E.credito_compartido)
            chips.push('<span class="chip-heroe abrible" data-abre="hcomp" aria-expanded="false" ' +
              'tabindex="0" role="button" title="Un solo crédito cubre dos unidades del mismo ' +
              'cliente. Su cobro está contado del lado de la hermana.">' + E.credito_compartido +
              (E.credito_compartido === 1 ? ' venta comparte' : ' ventas comparten') +
              ' crédito · ' + soles(E.monto_credito_compartido) + ' ▸</span>');
          if (E.sin_credito)
            chips.push('<span class="chip-heroe chip-fuera abrible" data-abre="hsc" ' +
              'aria-expanded="false" tabindex="0" role="button" title="No hay dónde leer su cobro: ' +
              'ni cuentas por cobrar ni el módulo de ventas registran nada. Quedan fuera de los ' +
              'dos lados del porcentaje.">' +
              E.sin_credito + (E.sin_credito === 1 ? ' venta fuera' : ' ventas fuera') +
              ' del cálculo · ' + soles(E.monto_sin_credito) + ' ▸</span>');
          return chips.length ? '<div class="chips-heroe">' + chips.join("") + '</div>' : '';
        })() +
        faltaPorModalidad(E)) +
    '</div>' + graficoMensual() + '</div>' +
    '<div class="detalle" id="det-hsci"></div>' +
    '<div class="detalle" id="det-hsc"></div>' +
    '<div class="detalle" id="det-hcomp"></div>' +
    '</section>';

  H += seccionCaja();
  H += seccionProyeccion();
  H += seccionObras(M);
  H += seccionAsesores(M);
  H += seccionStock(M);
  return H;
}
</script>
