<body>
<div class="envoltorio">

    <span class="hoja-nombre" id="hoja-nombre"></span>
    <span class="cabecera-der" id="cab-der"></span></div></header>
  <nav class="nav" id="nav"></nav>
  <div class="subnav" id="subnav"></div>
  <div class="filtros-zona"><div class="filtros">
    <div class="filtro"><label for="f-periodo">Período</label><select id="f-periodo"></select></div>
    <div class="filtro" id="caja-rs"><label for="f-rs">Razón social</label><select id="f-rs"></select></div>
    <div class="filtro" id="caja-obra"><label for="f-obra">Proyecto</label><select id="f-obra"></select></div>
  </div></div>
  <div class="fuentes" id="fuentes"></div>
  <div id="cargando">leyendo <code>tablero_datos.json</code>…</div>
  <div id="hoja" hidden></div>
</div>

<script>
window.HOJA = {
  id: "contasis",
  nombre: "ContaSis",
  pregunta: "¿Cómo les fue a las cuatro empresas según el contador?",
  fuentes: ["CONTASIS"],
  sinRazonObra: true,
  sinPeriodo: true,


  _tab: null,
  _mesSel: null,
  _emp: "20605163557",
  _kpis: null,
  _kpisC: null,
  _M: null, _D: null,

  _RAT: [
    ["liquidez", "Liquidez corriente", "x", "💧"],
    ["prueba_acida", "Prueba ácida", "x", "🧪"],
    ["endeudamiento", "Endeudamiento", "x", "⚖"],
    ["roe", "ROE", "%", "📈"]
  ],
  _IND: [
    ["flujo", "Flujo del mes", "S", "⇅"],
    ["variacion", "Variación de la caja", "%", "📊"],
    ["cobros_salidas", "Cobros ÷ salidas", "%", "⇄"],
    ["gastos_cobros", "Gastos ÷ cobros", "%", "🧾"],
    ["grupo_salidas", "Enviado al grupo ÷ salidas", "%", "🏢"],
    ["meses_caja", "Meses de caja", "m", "🏦"]
  ],
  _CORTO: {
    "Entradas del mes": "entró", "Salidas del mes": "salió",
    "Saldo inicial": "inicial", "Saldo final": "final",
    "Cobros de clientes (cuentas 12 y 13)": "cobros",
    "Gastos (cuentas 60 a 68)": "gastos",
    "Enviado a empresas del grupo y al socio": "al grupo y al socio"
  },

    ["20608888188", "CONSTRUCTORA VELASCO LEON S.A.C."],
    ["20607720224", "CORPORACION HABITAT S.A.C."],
    ["20611216565", "ESCALAR Y HABITAT GRUPO INMOBILIARIO S.A.C."],
    ["20605163557", "HABITAT BIENES RAICES E.I.R.L."]
  ],
  _MESN: ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio",
          "Agosto", "Setiembre", "Octubre", "Noviembre", "Diciembre"],

  _mesTxt: function (k) {
    var m = /^(\d{4})-(\d{2})$/.exec(String(k || ""));
    return m ? this._MESN[Number(m[2]) - 1] + " " + m[1] : String(k || "");
  },
  _pad: function (n) { return (n < 10 ? "0" : "") + n; },

  _fmt: function (v, u) {
    if (v === null || v === undefined || isNaN(v)) return "—";
    if (u === "%") return fmt1(v) + "%";
    if (u === "S") return soles(v);
    if (u === "m") return fmt1(v) + " meses";
    return Number(v).toFixed(2);
  },
  _fmtCorto: function (v, u) {
    if (v === null || v === undefined || isNaN(v)) return "—";
    if (u === "S") return solesM(v);
    return this._fmt(v, u);
  },
  _hayValor: function (x) {
    return !!x && x.valor !== null && x.valor !== undefined && !isNaN(x.valor);
  },

  _E: function () {
    return ((this._D || {}).contasis_mensual || {}).empresas || {};
  },

  /* LOS MESES CON EXCEL: libro caja, cierres y registros de las cuatro. */
  _meses: function () {
    var E = this._E(), ks = {};
    Object.keys(E).forEach(function (r) {
      Object.keys(E[r].caja || {}).forEach(function (k) { ks[k] = 1; });
      Object.keys(E[r].cierres || {}).forEach(function (k) { ks[k] = 1; });
      var R = E[r].registros || {};
      Object.keys(R).forEach(function (t) { if (R[t].periodo) ks[R[t].periodo] = 1; });
    });
    return Object.keys(ks).sort();
  },
  _mes: function () {
    var ks = this._meses();
    if (!ks.length) return null;
    return ks.indexOf(this._mesSel) >= 0 ? this._mesSel : ks[ks.length - 1];
  },

  _tabsDe: function (e, mes) {
    var c = (e.cierres || {})[mes], cj = (e.caja || {})[mes], R = e.registros || {};
    var cp = (e.cierres || {})[this._mesAntes(mes)];
    var t = [];
    if (c && c.ratios) t.push(["ratios", "Ratios"]);
    if (c && c.esf) t.push(["esf", "Situación financiera"]);
    if (c && c.er) t.push(["er", "Resultados"]);
    if (c && c.esf && c.er && cp && cp.esf && cp.er) t.push(["epn", "Cambios en el patrimonio"]);
    if (cj) t.push(["efe", "Flujo de efectivo"]);
    if (c && c.er) t.push(["ori", "Resultados integrales"]);
    if (c && c.balance) t.push(["mayor", "Libro mayor"]);
    if (cj) t.push(["caja", "Libro caja"]);
    if (cj) t.push(["movs", "Movimientos de caja"]);
    if (Object.keys(R).some(function (x) { return R[x].periodo === mes; }))
      t.push(["regs", "Ventas y compras"]);
    return t;
  },

  pintar: function (M, D) {
    this._M = M; this._D = D;
    var self = this;
    if (!this._kpis) {
      this._kpis = {};
      this._RAT.forEach(function (r) { self._kpis[r[0]] = true; });
    }
    if (!this._kpisC) {
      this._kpisC = {};
      this._IND.forEach(function (r) { self._kpisC[r[0]] = true; });
    }
    return '<div id="cs-caja">' + this._cuerpo() + '</div>';
  },

  _cuerpo: function () {
    var self = this, E = this._E(), mes = this._mes();
    if (!mes) return '';
    var emps = this._EMPS.filter(function (e) {
      return E[e[0]] && self._tabsDe(E[e[0]], mes).length;
    });
    if (!emps.length) return '';
    if (!emps.some(function (e) { return e[0] === self._emp; })) this._emp = emps[0][0];
    var emp = E[this._emp];
    var tabs = this._tabsDe(emp, mes);
    if (!tabs.some(function (t) { return t[0] === self._tab; })) this._tab = tabs[0][0];

    var mesesK = this._meses();
    var queTiene = function (k) {
      var n = 0, completo = 0;
      self._EMPS.forEach(function (e) {
        var E2 = E[e[0]]; if (!E2) return;
        if (self._tabsDe(E2, k).length) n++;
        if ((E2.cierres || {})[k]) completo++;
      });
      return completo ? '' : ' · solo libro caja';
    };
    var h = '<div class="d-lienzo"><div class="cs-barra">' +
      '<label class="cs-f">Mes<select id="cs-mes">' +
      mesesK.map(function (k) {
        return '<option value="' + k + '"' + (k === mes ? ' selected' : '') + '>' +
          esc(self._mesTxt(k)) + esc(queTiene(k)) + '</option>';
      }).join('') + '</select></label>' +
      '<label class="cs-f">Empresa<select id="cs-emp">' +
      emps.map(function (e) {
        return '<option value="' + e[0] + '"' + (self._emp === e[0] ? ' selected' : '') +
          '>' + esc(e[1]) + '</option>';
      }).join('') + '</select></label>' +
      '<span class="cs-dato">' + ent(tabs.length) + ' reportes de ' +
      esc(self._mesTxt(mes)) + '</span></div>' +
      '<div class="pills-emp cs-tabs" role="tablist">' + tabs.map(function (t) {
        return '<button type="button" class="pill-emp' + (self._tab === t[0] ? ' activa' : '') +
          '" data-cs-tab="' + t[0] + '" role="tab" aria-selected="' +
          (self._tab === t[0]) + '">' + esc(t[1]) + '</button>';
      }).join('') + '</div>';

    var c = (emp.cierres || {})[mes];
    var cuerpo = '';
    if (this._tab === "ratios") cuerpo = this._ratios(emp, c, mes, E);
    else if (this._tab === "esf") cuerpo = this._esf(emp, c, mes);
    else if (this._tab === "er") cuerpo = this._er(emp, c, mes);
    else if (this._tab === "epn") cuerpo = this._epn(emp, c, mes);
    else if (this._tab === "efe") cuerpo = this._efe(emp, mes);
    else if (this._tab === "ori") cuerpo = this._ori(emp, c, mes);
    else if (this._tab === "mayor") cuerpo = this._mayor(emp, c, mes);
    else if (this._tab === "caja") cuerpo = this._caja(emp, mes, E);
    else if (this._tab === "movs") cuerpo = this._movs(emp, mes);
    else if (this._tab === "regs") cuerpo = this._registros(emp, mes);
    return h + cuerpo + '</div>';
  },

  _tarjeta: function (id, chip, preg, cifra, exacta, pie, rojo, pieRojo) {
    return '<div class="d-carta d-abrible abrible" data-abre="' + id +
      '" aria-expanded="false" tabindex="0" role="button">' +
      '<div class="d-cab"><span class="d-chip">' + chip + '</span><span class="d-preg">' +
      esc(preg) + '</span></div>' +
      '<div class="d-cifra"' + (rojo ? ' style="color:var(--rojo)"' : '') + '>' + cifra + '</div>' +
      '<div class="d-exacta">' + exacta + '</div>' +
      '<div class="d-pie"' + (pieRojo ? ' style="color:var(--rojo)"' : '') + '>' + pie + '</div></div>';
  },

  _ratios: function (emp, c, mes, E) {
    var self = this, R = c.ratios || {};
    var h = '';
    var vis = this._RAT.slice();
    var conValor = vis.filter(function (r) { return self._hayValor(R[r[0]]); });

    if (conValor.length) {
      h += '<div class="d-kpis">';
      conValor.forEach(function (r) {
        var x = R[r[0]];
        var mal = r[2] === "%" && x.valor < 0;
        h += self._tarjeta("cs-r-" + r[0], r[3], r[1], self._fmtCorto(x.valor, r[2]),
          esc(emp.nombre) + ' · ' + esc(self._mesTxt(mes)),
          x.aviso ? 'Costo de ventas vacío o casi cero · Contabilidad' : 'ContaSis', mal, !!x.aviso);
      });
      h += '</div>';
      conValor.forEach(function (r) { h += '<div class="detalle" id="det-cs-r-' + r[0] + '"></div>'; });
    }

    /* las empresas con cierre ese mes */
    var cols = this._EMPS.filter(function (e) {
      var cc = ((E[e[0]] || {}).cierres || {})[mes];
      return cc && cc.ratios;
    });
    h += '<div class="d-carta"><h3 class="d-tit">Ratios por empresa · ' +
      esc(this._mesTxt(mes)) + '</h3><div class="envoltura-tabla"><table class="datos"><thead><tr>' +
      '<th>Ratio</th>' + cols.map(function (e) {
        return '<th class="num">' + esc(e[1]) + '</th>'; }).join('') +
      '</tr></thead><tbody>';
    vis.forEach(function (r) {
      h += '<tr><td class="obra">' + esc(r[1]) + '</td>' + cols.map(function (e) {
        var x = E[e[0]].cierres[mes].ratios[r[0]];
        return '<td class="num' + (e[0] === self._emp ? ' cs-sel' : '') + '">' +
          self._fmt(x ? x.valor : null, r[2]) + '</td>';
      }).join('') + '</tr>';
    });
    return h + '</tbody></table></div></div>';
  },

  _esTotal: function (s) {
    var n = String(s || "").toUpperCase();
    return n.indexOf("TOTAL") === 0 || n.indexOf("T O T A L") === 0;
  },
  _tablaLineas: function (titulo, lineas, bold) {
    var filas = (lineas || []).filter(function (l) {
      return l[1] !== null && l[1] !== undefined; });
    if (!filas.length) return '';
    var h = '<div class="d-carta"><h3 class="d-tit">' + titulo + '</h3>' +
      '<div class="envoltura-tabla"><table class="datos sin-orden"><thead><tr><th>Cuenta</th>' +
      '<th class="num">Monto</th></tr></thead><tbody>';
    filas.forEach(function (l) {
      h += '<tr' + (bold(l[0]) ? ' class="total"' : '') + '><td class="obra">' + esc(l[0]) +
        '</td><td class="num"' + (l[1] < 0 ? ' style="color:var(--rojo)"' : '') + '>' +
        soles(l[1]) + '</td></tr>';
    });
    return h + '</tbody></table></div></div>';
  },

  _ESF_A: [
    ["a", "h", "Activos"],
    ["ac", "h2", "Activos Corrientes"],
    ["a_efe", "l", "Efectivo y Equivalentes al Efectivo", "ac:efectivo y equivalentes de efectivo"],
    ["a_oaf", "l", "Otros Activos Financieros", "ac:otros activos financieros"],

    ["a_cxcr", "i", "Cuentas por Cobrar a Entidades Relacionadas", "ac:cuentas por cobrar a entidades relaciona"],

      "ac:total activos ctes distin manten venta o", ["a_efe", "a_oaf", "a_cxc", "a_inv", "a_bio", "a_imp", "a_onf", "a_pig"]],
    ["a_mant", "l", "Activos no Corrientes o Grupos de Activos para su Disposición Clasificados como Mantenidos para la Venta o como Mantenidos para Distribuir a los Propietarios",
      "ac:act no cte mantenidos para la venta o di"],

    ["a_tac", "t", "Total Activos Corrientes", "ac:total activo corriente", ["a_tdist", "a_mant"]],
    ["anc", "h2", "Activos No Corrientes"],
    ["n_oaf", "l", "Otros Activos Financieros", "anc:otros activos financieros"],
    ["n_inv", "l", "Inversiones en Subsidiarias, Negocios Conjuntos y Asociadas", "anc:inversiones en subsidiarias, negocios co"],
    ["n_cxc", "s", "Cuentas por Cobrar Comerciales y Otras Cuentas por Cobrar", "", ["n_cxcc", "n_cxcr", "n_ocxc", "n_ant"]],
    ["n_cxcc", "i", "Cuentas por Cobrar Comerciales", "anc:ctas por cobrar comerciales"],
    ["n_cxcr", "i", "Cuentas por Cobrar a Entidades Relacionadas", "anc:cuentas por cobrar a entidades relaciona"],
    ["n_ocxc", "i", "Otras Cuentas por Cobrar", "anc:otras cuentas por cobrar"],
    ["n_ant", "i", "Anticipos", "anc:anticipos"],
    ["n_invt", "l", "Inventarios", ""],
    ["n_bio", "l", "Activos Biológicos", "anc:activos biologicos"],
    ["n_pinv", "l", "Propiedades de Inversión", "anc:propiedades de inversion"],

    ["n_int", "l", "Activos Intangibles Distintos de la Plusvalía", "anc:activos intangibles distintos de la pl"],
    ["n_aid", "l", "Activos por Impuestos Diferidos", "anc:activos por impuestos diferidos"],
    ["n_aic", "l", "Activos por Impuestos Corrientes, no Corrientes", ""],
    ["n_plus", "l", "Plusvalía", "anc:plusvalia"],
    ["n_onf", "l", "Otros Activos no Financieros", "anc:otros activos no financieros"],
    ["n_pig", "l", "Activos no Corrientes Distintos al Efectivo Pignorados como Garantía Colateral", ""],
    ["n_tanc", "t", "Total Activos No Corrientes", "anc:total activo no corriente",
      ["n_oaf", "n_inv", "n_cxc", "n_invt", "n_bio", "n_pinv", "n_ppe", "n_int", "n_aid", "n_aic", "n_plus", "n_onf", "n_pig"]],
    ["a_tot", "T", "TOTAL DE ACTIVOS", "anc:t o t a l a c t i v o", ["a_tac", "n_tanc"]]
  ],
  _ESF_P: [
    ["p", "h", "Pasivos y Patrimonio"],
    ["pc", "h2", "Pasivos Corrientes"],
    ["p_opf", "l", "Otros Pasivos Financieros", "pc:otros pasivos financieros"],
    ["p_cxp", "s", "Cuentas por Pagar Comerciales y Otras Cuentas por Pagar", "", ["p_cxpc", "p_cxpr", "p_ocxp"]],
    ["p_cxpc", "i", "Cuentas por Pagar Comerciales", "pc:cuentas por pagar comerciales"],
    ["p_cxpr", "i", "Cuentas por Pagar a Entidades Relacionadas", "pc:cuentas por pagar a entidades relacionad"],
    ["p_ocxp", "i", "Otras Cuentas por Pagar", "pc:otras cuentas por pagar"],
    ["p_idif", "l", "Ingresos Diferidos", "pc:ingresos diferidos"],
    ["p_pben", "l", "Provisión por Beneficios a los Empleados", "pc:provision por beneficios a los empleados"],
    ["p_oprov", "l", "Otras Provisiones", "pc:otras provisiones"],
    ["p_pimp", "l", "Pasivos por Impuestos a las Ganancias", "pc:pasivos por impuestos a las ganancias"],
    ["p_onf", "l", "Otros Pasivos no Financieros", "pc:otros pasivos no financieros"],
    ["p_tdist", "t", "Total de Pasivos Corrientes Distintos de Pasivos Incluidos en Grupos de Activos para su Disposición Clasificados como Mantenidos para la Venta",
      "pc:total pasivo cte distin mant venta", ["p_opf", "p_cxp", "p_idif", "p_pben", "p_oprov", "p_pimp", "p_onf"]],
    ["p_mant", "l", "Pasivos incluidos en Grupos de Activos para su Disposición Clasificados como Mantenidos para la Venta", "pc:pasivo incluido en activo mantenido para"],
    ["p_tpc", "t", "Total Pasivos Corrientes", "pc:total pasivos corrientes", ["p_tdist", "p_mant"]],
    ["pnc", "h2", "Pasivos No Corrientes"],
    ["q_opf", "l", "Otros Pasivos Financieros", "pnc:otros pasivos financieros"],
    ["q_cxp", "s", "Cuentas por Pagar Comerciales y Otras Cuentas por Pagar", "", ["q_cxpc", "q_cxpr", "q_ocxp"]],

    ["q_tpnc", "t", "Total Pasivos No Corrientes", "pnc:total pasivos no corrientes",
      ["q_opf", "q_cxp", "q_idif", "q_pben", "q_oprov", "q_pid", "q_pic", "q_onf"]],
    ["p_tot", "T", "Total Pasivos", "pnc:total pasivo", ["p_tpc", "q_tpnc"]],
    ["k", "h", "Patrimonio"],

    ["k_tpat", "t", "Total Patrimonio", "pat:total patrimonio",

    ["pp_tot", "T", "TOTAL PASIVO Y PATRIMONIO", "pat:total pasivo y patrimonio neto", ["p_tot", "k_tpat"]]
  ],
  _ER_F: [
    ["r_ing", "l", "Ingresos de Actividades Ordinarias", "f:ingresos de actividades ordinarias"],
    ["r_cv", "l", "Costo de Ventas", "f:costo de ventas"],
    ["r_bruta", "t", "Ganancia (Pérdida) Bruta", "f:ganancia (perdida) bruta", ["r_ing", "r_cv"]],
    ["r_gv", "l", "Gastos de Ventas y Distribución", "f:gastos de ventas y distribucion"],
    ["r_ga", "l", "Gastos de Administración", "f:gastos de administracion"],
    ["r_oio", "l", "Otros Ingresos Operativos", "f:otros ingresos operativos"],
    ["r_ogo", "l", "Otros Gastos Operativos", "f:otros gastos operativos"],

  _MESC: ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "set", "oct", "nov", "dic"],
  _mesAntes: function (mes) {
    var m = /^(\d{4})-(\d{2})$/.exec(String(mes || ""));
    if (!m) return "";
    var a = Number(m[1]), n = Number(m[2]) - 1;
    if (n < 1) { a--; n = 12; }
    return a + "-" + this._pad(n);
  },
  _alCierre: function (mes) {
    var m = /^(\d{4})-(\d{2})$/.exec(String(mes || ""));
    if (!m) return String(mes || "");
    return new Date(Number(m[1]), Number(m[2]), 0).getDate() + "-" +
      this._MESC[Number(m[2]) - 1] + "-" + m[1];
  },
  _norm: function (s) {
    return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "")
      .toLowerCase().replace(/\s+/g, " ").trim();
  },
  _cero: function (v) {
    return v === null || v === undefined || isNaN(v) || Math.abs(v) < 0.005;
  },
  _nf: function (v) {
    if (v === null || v === undefined || isNaN(v)) return "—";
    var a = Math.abs(v) < 0.005 ? 0 : v;
    var t = Math.abs(a).toLocaleString("es-PE", {minimumFractionDigits: 2, maximumFractionDigits: 2});
    return a < 0 ? "(" + t + ")" : t;
  },
  _fila: function (plantilla, id) {
    for (var i = 0; i < plantilla.length; i++) if (plantilla[i][0] === id) return plantilla[i];
    return null;
  },

  _porRotulo: function (lineas, inicio) {
    var self = this, sec = inicio, out = {};
    (lineas || []).forEach(function (l) {
      var n = self._norm(l[0]);
      if (!n) return;
      if (n === "activos no corrientes") sec = "anc";
      else if (n === "pasivos no corrientes") sec = "pnc";
      else if (n === "patrimonio") sec = "pat";
      var k = sec + ":" + n;
      if (!(k in out)) out[k] = {v: l[1], rot: l[0], usado: false};
    });
    return out;
  },
  _evaluar: function (plantilla, dato) {
    var self = this, v = {}, calc = {}, desc = [];
    plantilla.forEach(function (f) {
      if (f[1] === "l" || f[1] === "i" || f[1] === "x") {
        var x = dato(f);
        v[f[0]] = self._cero(x) ? 0 : x;
      }
    });
    plantilla.forEach(function (f) {
      var t = f[1];
      if (t !== "s" && t !== "t" && t !== "T") return;
      var suma = (f[4] || []).reduce(function (a, k) { return a + (v[k] || 0); }, 0);
      var x = t === "s" ? null : dato(f);
      if (x === null || x === undefined) {
        v[f[0]] = suma;
        if (t !== "s") calc[f[0]] = true;
      } else {
        v[f[0]] = x;
        if (Math.abs(suma - x) >= 0.005)
          desc.push({id: f[0], rot: f[2], suma: suma, fuente: x});
      }
    });
    return {v: v, calc: calc, desc: desc};
  },
  _valContaSis: function (plantilla, R) {
    var self = this;
    var r = this._evaluar(plantilla, function (f) {
      var x = f[3] ? R[f[3]] : null;
      if (!x) return null;
      x.usado = true;
      return x.v;
    });
    r.sueltas = Object.keys(R).map(function (k) { return R[k]; })
      .filter(function (x) { return !x.usado && !self._cero(x.v); });
    return r;
  },
  _valESF: function (c) {

    var RA = this._porRotulo(c.esf.activo, "ac"), RP = this._porRotulo(c.esf.pasivo, "pc");

      var t = {n: 0, base: 0, igv: 0, otros: 0, sin_desglose: 0, total: 0};
      var celdaResto = function (v) {
        return conResto ? '<td class="num"' + (Math.abs(v) >= 0.005 ? ' style="color:var(--rojo)"' : '') +
          '>' + soles(v) + (Math.abs(v) >= 0.005 ? '<span class="ob-sub"> · Contabilidad</span>' : '') +
          '</td>' : '';
      };
      var ids = [];
      ks.forEach(function (k) {
        var m = rg.meses[k];
        Object.keys(t).forEach(function (x) { t[x] += m[x] || 0; });
        var a = (rg.filas || []).some(function (f) { return String(f[0]).slice(0, 7) === k; }) ?
          "cs-reg~" + tipo + "~" + k : null;
        if (a) ids.push(a);
        h += '<tr' + (a ? ' class="abrible" data-abre="' + a + '" aria-expanded="false" tabindex="0" role="button"' : '') +
          '><td class="obra">' + esc(self._mesTxt(k)) + '</td><td class="num">' +
          ent(m.n) + '</td><td class="num">' + soles(m.base) + '</td><td class="num">' +
          soles(m.igv) + '</td><td class="num">' + soles(m.otros || 0) + '</td>' +
          celdaResto(m.sin_desglose || 0) + '<td class="num">' + soles(m.total) + '</td></tr>';
      });
      h += '<tr class="total"><td class="obra">TOTAL</td><td class="num">' + ent(t.n) +
        '</td><td class="num">' + soles(t.base) + '</td><td class="num">' + soles(t.igv) +
        '</td><td class="num">' + soles(t.otros) + '</td>' + celdaResto(t.sin_desglose) +
        '<td class="num">' + soles(t.total) + '</td></tr></tbody></table></div></div>';
      ids.forEach(function (a) { h += '<div class="detalle" id="det-' + a + '"></div>'; });
      return h;
    };
    var R = emp.registros || {};
    var suf = esc(emp.nombre);
    var h = '<div class="d-dos">' +
      tabla('Registro de ventas · ' + suf, R.ventas, "ventas") +
      tabla('Registro de compras · ' + suf, R.compras, "compras") + '</div>';
    var pv = R.compras && R.compras.periodo === mes ? (R.compras.proveedores || []) : [];
    if (!pv.length) return h;
    h += '<div class="d-carta"><h3 class="d-tit">Proveedores con más compras · ' + suf +
      '</h3><div class="envoltura-tabla"><table class="datos"><thead><tr><th>Proveedor</th>' +
      '<th class="num">Comprobantes</th><th class="num">Total</th></tr></thead><tbody>';
    /* el proveedor abre sus comprobantes del registro */
    var idsP = [], conFilas = (R.compras.filas || []).length > 0;
    pv.forEach(function (p, i) {
      var a = conFilas ? "cs-prov~" + i : null;
      if (a) idsP.push(a);
      h += '<tr' + (a ? ' class="abrible" data-abre="' + a + '" aria-expanded="false" tabindex="0" role="button"' : '') +
        '><td class="obra">' + esc(p.proveedor) + '</td><td class="num">' + ent(p.n) +
        '</td><td class="num">' + soles(p.total) + '</td></tr>';
    });
    h += '</tbody></table></div></div>';
    idsP.forEach(function (a) { h += '<div class="detalle" id="det-' + a + '"></div>'; });
    return h;
  },

  detalle: function (id) {
    var t = '<button class="cerrar">Cerrar</button>';
    var E = this._E(), emp = E[this._emp], mes = this._mes();
    if (!emp || !mes) return null;
    var p = String(id).split("~");
    if (p.length >= 3 && (p[p.length - 2] === "s" || p[p.length - 2] === "t")) {
      var ce = emp, cm = mes;
      if (p[0] === "cs-lce") ce = E[p[1]];
      if (p[0] === "cs-lcm") cm = p[1];
      if (p[0] === "cs-lct") ce = E[p[2]];
      var cj = ce && (ce.caja || {})[cm];
      if (!cj) return null;
      var k = p[p.length - 1], marca = p[p.length - 2];
      var nom = marca === "s" ? (this._NOMDIARIO(cj)[k] || '') :
        (((cj.tipos || []).filter(function (x) { return x.cuenta === k; })[0] || {}).nombre || '');
      return t + this._tablaAsientos((marca === "s" ? 'Subcuenta ' : 'Cuenta ') + k + ' · ' + nom +
        ' · ' + ce.nombre + ' · ' + this._mesTxt(cm), cj, function (r, ix) {
          return marca === "s" ? r[ix.cuenta] === k : String(r[ix.cuenta] || "").slice(0, 2) === k;
        });
    }
    if (p[0] === "cs-esf") return this._detEsf(emp, mes, p[1], p);
    if (p[0] === "cs-er") return this._detEr(emp, mes, p[1], p);
    if (p[0] === "cs-efe") return this._detEfe(emp, mes, p[1], p);
    if (p[0] === "cs-epn") return this._detEpn(emp, mes, p[1]);
    if (p[0] === "cs-ori") {
      if (p.length > 2) { var po = this._panelCuenta(emp, mes, p[2], p.join("~")); return po ? t + po : null; }
      return this._detOri(emp, mes);
    }
    if (p[0] === "cs-cta") {
      if (p.length > 2) { var pq = this._panelCuenta(emp, mes, p[2], p.join("~")); return pq ? t + pq : null; }
      return this._detCta(emp, mes, p[1]);
    }
    if (p[0] === "cs-mt") {
      var cjm = (emp.caja || {})[mes];
      var tp = ((cjm && cjm.tipos) || []).filter(function (x) { return x.cuenta === p[1]; })[0];
      if (!tp) return null;
      return t + '<h3>' + esc(p[1]) + ' · ' + esc(tp.nombre) + ' · ' + esc(emp.nombre) + ' · ' +
        esc(this._mesTxt(mes)) + '</h3>' +
        this._tablaSubs('Subcuentas', this._subsDe(cjm, p[1]), "cs-mt~" + p[1], cjm);
    }
    if (p[0] === "cs-mc") {
      var cjc = (emp.caja || {})[mes];
      if (!cjc) return null;
      var nm = this._NOMDIARIO(cjc)[p[1]] || '';
      return t + '<h3>' + esc(p[1]) + ' · ' + esc(nm) + ' · ' + esc(emp.nombre) + ' · ' +
        esc(this._mesTxt(mes)) + '</h3>' + this._tablaAsientos('Asientos', cjc, function (r, ix) {
          return r[ix.cuenta] === p[1]; });
    }
    if (p[0] === "cs-lce" || p[0] === "cs-lcm") {
      var e2 = p[0] === "cs-lce" ? E[p[1]] : emp, m2 = p[0] === "cs-lcm" ? p[1] : mes;
      var cj2 = e2 && (e2.caja || {})[m2];
      if (!cj2) return null;
      return t + '<h3>Libro caja · ' + esc(e2.nombre) + ' · ' + esc(this._mesTxt(m2)) + '</h3>' +
        this._tablaTipos('Por contrapartida', cj2, p.join("~"));
    }
    if (p[0] === "cs-lct") return this._detTipoSalidas(E, mes, p[1]);
    if (p[0] === "cs-reg") {
      var rg = (emp.registros || {})[p[1]];
      if (!rg) return null;
      return t + '<h3>' + (p[1] === "compras" ? 'Registro de compras' : 'Registro de ventas') + ' · ' +
        esc(emp.nombre) + ' · ' + esc(this._mesTxt(p[2])) + '</h3>' +
        this._tablaComprobantes('Comprobantes', rg, p[2]);
    }
    if (p[0] === "cs-prov") {
      var rc = (emp.registros || {}).compras, pv = rc && (rc.proveedores || [])[Number(p[1])];
      if (!pv) return null;
      var quien = pv.proveedor === "Personas naturales" ? "Persona natural" : pv.proveedor;
      var sub = {filas_cols: rc.filas_cols, filas: (rc.filas || []).filter(function (f) { return f[3] === quien; })};
      var meses = {};
      sub.filas.forEach(function (f) { meses[String(f[0]).slice(0, 7)] = 1; });
      var self2 = this;
      return t + '<h3>' + esc(pv.proveedor) + ' · ' + esc(emp.nombre) + ' · registro de compras</h3>' +
        Object.keys(meses).sort().map(function (k) {
          return self2._tablaComprobantes(self2._mesTxt(k), sub, k);
        }).join('');
    }
    var mi = /^cs-i-(.+)$/.exec(id);
    if (mi) {
      var mc = (emp.caja || {})[mes];
      var xi = mc && mc.indicadores ? mc.indicadores[mi[1]] : null;
      if (!this._hayValor(xi)) return null;
      var di = this._IND.filter(function (x) { return x[0] === mi[1]; })[0] || [mi[1], mi[1], "x"];
      var hi = t + '<h3>' + esc(di[1]) + ' · de dónde sale · ' + esc(emp.nombre) +
        ' · ' + esc(this._mesTxt(mes)) + '</h3><div class="envoltura-tabla"><table class="datos">' +
        '<thead><tr><th>Partida del libro caja</th><th class="num">Monto</th></tr></thead><tbody>';
      Object.keys(xi.insumos || {}).forEach(function (k) {
        hi += '<tr><td class="obra">' + esc(k) + '</td><td class="num">' +
          soles(xi.insumos[k]) + '</td></tr>';
      });
      return hi + '<tr class="total"><td class="obra">' + esc(di[1]) + '</td><td class="num">' +
        this._fmt(xi.valor, di[2]) + '</td></tr></tbody></table></div>';
    }
    var m = /^cs-r-(.+)$/.exec(id);
    if (m) {
      var c = (emp.cierres || {})[mes];
      var r = c && c.ratios ? c.ratios[m[1]] : null;
      if (!this._hayValor(r)) return null;
      var def = this._RAT.filter(function (x) { return x[0] === m[1]; })[0] || [m[1], m[1], "x"];
      var h = t + '<h3>' + esc(def[1]) + ' · de dónde sale · ' + esc(emp.nombre) + ' · ' +
        esc(this._mesTxt(mes)) + '</h3><div class="envoltura-tabla"><table class="datos"><thead><tr>' +
        '<th>Partida</th><th class="num">Monto</th></tr></thead><tbody>';
      Object.keys(r.insumos || {}).forEach(function (k) {
        var v = r.insumos[k];
        h += '<tr><td class="obra">' + esc(k) + '</td><td class="num">' +
          (v === null || v === undefined ? 'vacío en el archivo' : soles(v)) + '</td></tr>';
      });
      return h + '<tr class="total"><td class="obra">' + esc(def[1]) + ' · ' + esc(r.formula || '') +
        '</td><td class="num">' + this._fmt(r.valor, def[2]) + '</td></tr></tbody></table></div>';
    }
    return null;
  },

  conectar: function () {
    var self = this;
    var caja = document.getElementById("cs-caja");
    if (!caja) return;
    caja.addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest("[data-cs-tab]") : null;
      if (!b || b.disabled) return;
      self._tab = b.getAttribute("data-cs-tab");
      caja.innerHTML = self._cuerpo();
      if (typeof conectarAbribles === "function") conectarAbribles(caja);
    });
    caja.addEventListener("change", function (e) {
      var s = e.target;
      if (!s || !s.id) return;
      if (s.id === "cs-mes") self._mesSel = s.value;
      else if (s.id === "cs-emp") self._emp = s.value;
      else return;
      caja.innerHTML = self._cuerpo();
      if (typeof conectarAbribles === "function") conectarAbribles(caja);
    });
  }
};
</script>
