<script>
window.HOJA = {
  id: "ventas",
  nombre: "Ventas",
  pregunta: "¿Vamos al ritmo que necesitamos?",
  fuentes: ["AXION"],
  filtros: ["asesor"],


  pintar: function (M, D) {
    var V = ventasDelPeriodo(M);
    return avisoAlcance(
      "el ritmo mes a mes, las separaciones y las ventas caídas",
      "el avance por proyecto y el stock libre, que salen del padrón de unidades y no tienen fecha",
      "el avance de venta por proyecto ni el stock libre: el padrón de unidades no guarda quién " +
      "vendió cada una, y una unidad libre todavía no la vendió nadie") +
           this.ritmo(M, D, V) +
           this.razonSocial(M, D, V) +
           this.avance(D, V) +
           this.noCerrado(D) +
           this.stock(M) +
           '<div class="detalle" id="det-ventas"></div>';
  },

  razonSocial: function (M, D, V) {
    if (!(V.filas || []).length) return "";
    var mapa = D.empresa_de_obra || {};
    var corto = function (r) {
      return String(r).replace(/ SOCIEDAD ANONIMA CERRADA$/, " S.A.C.")
                      .replace(/ EMPRESA INDIVIDUAL DE RESPONSABILIDAD LIMITADA$/, " E.I.R.L.");
    };
    var g = {};
    V.filas.forEach(function (f) {
      var r = mapa[String(f.obra || "")] || "(obra sin empresa en el mapa)";
      if (!g[r]) g[r] = {razon: r, n: 0, monto: 0, filas: [], obras: {}};
      g[r].n++; g[r].monto += f.precio; g[r].filas.push(f);
      g[r].obras[String(f.obra || "—")] = 1;
    });
    var L = Object.keys(g).map(function (k) { return g[k]; })
      .sort(function (a, b) { return b.monto - a.monto; });
    this._rs = L;
    var total = 0, nV = 0;
    L.forEach(function (x) { total += x.monto; nV += x.n; });
    var maxM = L[0].monto || 1;

    var h = cabSeccion("Cuánto vendió cada razón social",
      "AXION · la empresa sale del mapa proyecto→razón social del motor, la misma " +
      "fuente que el filtro de arriba · " + ent(nV) + " ventas del período", "razones");

    h += '<div class="tarjeta" style="padding:var(--e4) var(--e2)">' +
      '<div class="envoltura-tabla sin-tope"><table class="datos"><thead><tr>' +
      '<th>Razón social</th><th style="width:26%">Reparto del contratado</th>' +
      '<th class="num">Ventas</th><th class="num">Contratado</th>' +
      '<th class="num">% del contratado</th></tr></thead><tbody>';
    L.forEach(function (x, i) {
      var nOb = Object.keys(x.obras).length;
      h += '<tr class="abrible" data-abre="rs-' + i + '">' +
        '<td class="obra"><span class="ob-nom">' + esc(corto(x.razon)) + '</span>' +
        '<span class="ob-sub">' + nOb + (nOb === 1 ? ' proyecto' : ' proyectos') +
        ' · ver sus ' + ent(x.n) + (x.n === 1 ? ' venta' : ' ventas') + ' ▸</span></td>' +
        '<td><span class="riel-obra" style="width:' + Math.max(3, 100 * x.monto / maxM) + '%">' +
        '<span class="lleno" style="width:100%"></span></span></td>' +
        '<td class="num">' + ent(x.n) + '</td>' +
        '<td class="num">' + soles(x.monto) + '</td>' +
        '<td class="num"><b>' + pct(total ? 100 * x.monto / total : null) + '</b></td></tr>';
    });
    h += '<tr class="total"><td class="obra"><span class="ob-nom">TOTAL</span></td><td></td>' +
      '<td class="num">' + ent(nV) + '</td><td class="num">' + soles(total) + '</td>' +
      '<td class="num">100.0%</td></tr></tbody></table></div></div>' +
      L.map(function (x, i) {
        return '<div class="detalle" id="det-rs-' + i + '"></div>'; }).join("");

    return h + '</section>';
  },

  ritmo: function (M, D, V) {
    if (!V.filas.length) return cabSeccion("El ritmo, mes a mes",
      "sin ventas con los filtros puestos", "ritmo") +
      '<div class="tarjeta"><p>Ninguna venta cae dentro de los filtros elegidos.</p></div></section>';

    var porMes = {};
    V.filas.forEach(function (r) {
      var m = mesDe(r.fecha); if (!m) return;
      porMes[m] = porMes[m] || {k: String(m), monto: 0, ventas: 0};
      porMes[m].monto += r.precio; porMes[m].ventas++;
    });
    var datos = Object.keys(porMes).map(function (k) { return porMes[k]; })
      .sort(function (a, b) { return a.k - b.k; });
    datos.forEach(function (d) {
      d.nom = MES3[+d.k] || d.k;
      d.ticket = d.ventas ? d.monto / d.ventas : 0;
      d.curso = (+d.k === V.mesEnCurso);
    });

    var cerrados = datos.filter(function (d) { return !d.curso; });
    var base = cerrados.length ? cerrados : datos;
    var suma = base.reduce(function (s, d) { return s + d.monto; }, 0);
    var prom = suma / base.length;
    var max = Math.max.apply(null, datos.map(function (d) { return d.monto; })) || 1;
    var mejor = datos.filter(function (d) { return d.monto === max; })[0];
    var enCurso = datos.filter(function (d) { return d.curso; })[0];

    var h = cabSeccion("El ritmo, mes a mes",
      V.filas.length + (V.filas.length === 1 ? " venta" : " ventas") + " · " +
      soles(V.contratado) + " · clic en un mes para abrirlo", "ritmo");

    h += '<div class="tarjeta"><div class="graf-caja" style="height:220px">';
    datos.forEach(function (d) {
      h += '<div class="col abrible col-mes' + (P === d.k ? ' col-on' : '') + '" ' +
        'data-abre="ventas" data-mes="' + d.k + '" aria-expanded="false" tabindex="0" ' +
        'role="button" ' +
        'title="' + esc(d.nom) + ' · ' + d.ventas + ' ventas · ' + soles(d.monto) +
        (d.curso ? ' · mes en curso' : '') + ' — clic para abrirlo">' +
        '<span class="cif-col" style="color:var(--texto-fuerte)">' + solesM(d.monto) + '</span>' +
        '<div class="par"><span class="b" style="height:' + (100 * d.monto / max) +
          '%;width:22px;background:' + (d.curso ? "var(--navy-300)" : "var(--navy-700)") +
          '"></span></div>' +
        '<span class="mes" style="color:var(--texto-suave)">' + esc(d.nom) +
          (d.curso ? "*" : "") + '</span>' +
        '<span class="pct-col" style="color:var(--texto-suave-app)">' + d.ventas + ' v</span></div>';
    });
    h += '</div>';

    h += '<p class="mas" style="margin-top:var(--e3)"><b>Mejor mes: ' + esc(mejor.nom) + '</b> con ' +
      soles(mejor.monto) + ' en ' + mejor.ventas + (mejor.ventas === 1 ? ' venta' : ' ventas') +
      '. El promedio de los ' + base.length + ' meses cerrados es ' + soles(prom) + '.' +
      (enCurso
        ? ' <b>' + esc(enCurso.nom) + ' va por el día ' + V.dia + ' de ' + V.diasMes +
          '</b>: su barra es un mes a medias y por eso NO entra en ese promedio.'
        : '') + '</p>';
    h += '<div class="detalle" id="det-mes-ventas"></div></div></section>';
    return h;
  },

  avance: function (D, V) {
    var lista = Object.keys(D.avance).map(function (k) {
      var v = D.avance[k];
      return {obra: k, u_vend: v.u_vend, u_tot: v.u_tot, vendido: v.vendido,
              total: v.total, sin_precio: v.sin_precio,
              u_vend_precio: v.u_vend_precio, u_tot_precio: v.u_tot_precio};
    }).filter(function (o) { return entraObra(o.obra); });
    if (!lista.length) return "";

    lista.sort(function (a, b) { return b.u_vend - a.u_vend || b.vendido - a.vendido; });
    var maxU = Math.max.apply(null, lista.map(function (o) { return o.u_tot; })) || 1;
    var tU = 0, tT = 0, tV = 0, tS = 0;
    lista.forEach(function (o) {
      tU += o.u_vend; tT += o.u_tot; tV += o.vendido; tS += o.sin_precio; });

    var h = cabSeccion("Avance de venta, proyecto por proyecto",
      tU + " de " + tT + " unidades vendidas en " + lista.length +
      (lista.length === 1 ? " proyecto" : " proyectos") + " · clic en cualquiera para abrirla", "avance");
    h += '<div class="tarjeta" style="padding:var(--e4) var(--e2)">' +
      '<p class="mas" style="padding:0 var(--e2);margin-bottom:var(--e3)">' +
      '<b>Esta tabla no sigue al filtro de período ni al de vendedor</b>, y no puede: el padrón ' +
      'de unidades no tiene fecha ni guarda quién vendió cada una — una unidad no se «vendió en ' +
      'marzo» para efectos del padrón, está vendida y punto. El filtro de proyecto y el de razón ' +
      'social sí la mueven.</p>' +
      '<div class="envoltura-tabla"><table class="datos"><thead><tr>' +
      '<th>Proyecto</th><th style="width:30%">Del padrón, cuánto se vendió</th>' +
      '<th class="num">Vendidas</th><th class="num">Padrón</th><th class="num">%</th>' +
      '<th class="num">Vendido S/</th></tr></thead><tbody>';
    lista.forEach(function (o) {
      var p = o.u_tot ? 100 * o.u_vend / o.u_tot : 0;
      h += '<tr class="fila-obra abrible" data-abre="ventas" data-obra="' + esc(o.obra) + '" ' +
        'aria-expanded="false" tabindex="0" role="button"><td class="obra">' +
        '<span class="ob-nom">' + esc(o.obra) + '</span>' +
        '<span class="ob-sub">' +
          (o.sin_precio
            ? o.sin_precio + (o.sin_precio === 1 ? ' unidad sin precio cargado: cuenta en el padrón, no en los soles'
                                                 : ' unidades sin precio cargado: cuentan en el padrón, no en los soles')
            : 'las ' + o.u_tot + ' tienen precio cargado') + '</span></td>' +
        '<td><span class="riel-obra" style="width:' + Math.max(3, 100 * o.u_tot / maxU) + '%">' +
          '<span class="lleno" style="width:' + Math.max(o.u_vend ? 1.5 : 0, p) + '%"></span></span></td>' +
        '<td class="num">' + o.u_vend + '</td><td class="num">' + o.u_tot + '</td>' +
        '<td class="num"><b class="pct-obra">' + pct(p) + '</b></td>' +
        '<td class="num">' + soles(o.vendido) + '</td></tr>';
    });
    h += '<tr class="total"><td class="obra"><span class="ob-nom">TOTAL</span></td><td></td>' +
      '<td class="num">' + tU + '</td><td class="num">' + tT + '</td>' +
      '<td class="num"><b class="pct-obra">' + pct(tT ? 100 * tU / tT : 0) + '</b></td>' +
      '<td class="num">' + soles(tV) + '</td></tr></tbody></table></div>' +
      (tS ? '<p class="mas" style="padding:0 var(--e2)"><b>' + tS +
        (tS === 1 ? ' unidad no tiene' : ' unidades no tienen') + ' precio cargado en AXION.</b> ' +
        'Cuentan en el padrón y en las vendidas —una unidad vendida está vendida— pero no pueden ' +
        'entrar en la columna de soles: cero no es un precio, es un dato que falta. Es carga ' +
        'pendiente de <b>Comercial</b>.</p>' : '') +
      '</div></section>';
    return h;
  },

  noCerrado: function (D) {
    var af = D.areas_filas.Ventas || [];
    var sep = af.filter(function (b) { return b.nombre === "Separaciones"; })[0];
    var dev = af.filter(function (b) { return b.nombre === "Devoluciones"; })[0];
    if (!sep && !dev) return "";
    var cuenta = function (b) {
      var n = 0, s = 0;
      ((b && b.filas) || []).forEach(function (r) {
        if (!entraObra(String(r.obra || ""))) return;
        if (!entraAsesor(r.asesor)) return;
        n++; var v = num(r.monto); if (v !== null) s += v;
      });
      return {n: n, s: s};
    };
    var cS = cuenta(sep), cD = cuenta(dev);
    if (!cS.n && !cD.n) return "";

    var h = cabSeccion("Lo que no se cerró",
      "de todos los años · no sigue al filtro de período", "nocerrado");
    h += '<div class="tarjeta"><div class="rejilla-2">' +
      tarjetaAbrible("sep", cS.n + (cS.n === 1 ? " separación" : " separaciones"), cS.s,
        "lo que los clientes ENTREGARON para apartar — no es el precio de la unidad, y no entra " +
        "en el contratado", "Ver las " + cS.n, null) +
      tarjetaAbrible("dev", cD.n + (cD.n === 1 ? " venta caída" : " ventas caídas"), cD.s,
        "lo que los clientes ENTREGARON y habría que devolverles — tampoco es el precio pactado",
        "Ver las " + cD.n, null) +
      '</div>' +
      '<p class="mas" style="margin-top:var(--e3)">Las dos cifras son <b>lo entregado</b>, no lo ' +
      'apalabrado: es el único monto que AXION registra para estos casos, y es el que le importa ' +
      'a Cobranzas.</p>' +
      '<div class="detalle" id="det-sep"></div><div class="detalle" id="det-dev"></div>' +
      '</div></section>';
    return h;
  },

  stock: function (M) {
    var dr = (M.drills || {})["Falta vender"];
    if (!dr) return "";
    var iObra = colDe(dr, ["obra"]), ult = (dr.cols || []).length - 1;
    var mapa = {}, n = 0, tot = 0;
    (dr.filas || []).forEach(function (r) {
      var o = iObra >= 0 ? String(r[iObra]) : "—";
      if (!entraObra(o)) return;
      var v = num(r[ult]) || 0;
      mapa[o] = mapa[o] || {obra: o, u: 0, m: 0};
      mapa[o].u++; mapa[o].m += v; n++; tot += v;
    });
    var lista = Object.keys(mapa).map(function (k) { return mapa[k]; })
      .sort(function (a, b) { return b.m - a.m; });
    if (!n) return "";
    var max = lista[0].m || 1;

    var A = D.avance || {}, pTot = 0, pVend = 0;
    Object.keys(A).forEach(function (k) {
      if (!entraObra(k)) return;
      pTot += A[k].u_tot; pVend += A[k].u_vend;
    });
    var otras = pTot - pVend - n;

    var h = cabSeccion("Qué queda por vender",
      n + (n === 1 ? " unidad libre" : " unidades libres") + " · " + soles(tot) +
      " · clic en un proyecto para ver sus unidades", "stock");
    h += '<div class="tarjeta" style="padding:var(--e4) var(--e2)">' +
      '<div class="envoltura-tabla"><table class="datos"><thead><tr>' +
      '<th>Proyecto</th><th style="width:34%">Valor del stock</th>' +
      '<th class="num">Unidades</th><th class="num">Suma de precios</th>' +
      '</tr></thead><tbody>';
    lista.forEach(function (o) {
      h += '<tr class="fila-obra abrible" data-abre="ventas" data-stock="' + esc(o.obra) + '" ' +
        'aria-expanded="false" tabindex="0" role="button">' +
        '<td class="obra"><span class="ob-nom">' + esc(o.obra) + '</span></td>' +
        '<td><span class="riel-obra" style="width:' + Math.max(3, 100 * o.m / max) + '%">' +
          '<span class="lleno" style="width:100%"></span></span></td>' +
        '<td class="num">' + o.u + '</td><td class="num">' + soles(o.m) + '</td></tr>';
    });
    h += '<tr class="total"><td class="obra"><span class="ob-nom">TOTAL</span></td><td></td>' +
      '<td class="num">' + n + '</td><td class="num">' + soles(tot) + '</td></tr>' +
      '</tbody></table></div>' +
      '<p class="mas" style="padding:0 var(--e2)">El padrón tiene <b>' + pTot + '</b> unidades: ' +
      pVend + ' vendidas, ' + n + ' libres' +
      (otras > 0 ? ' y ' + otras + ' que no son ninguna de las dos —bloqueadas o separadas—' : '') +
      '. <b>El stock no tiene fecha ni dueño</b>, así que ni el filtro de período ni el de ' +
      'vendedor lo mueven: una unidad libre todavía no la vendió nadie, y filtrarla por vendedor ' +
      'la dejaría siempre en cero.</p>' +
      '</div></section>';
    return h;
  },

  detalle: function (id, el) {
    if (id.indexOf("rs-") === 0) {
      var x = (this._rs || [])[parseInt(id.slice(3), 10)];
      if (!x) return '<button class="cerrar">Cerrar</button><p>Fila no encontrada.</p>';
      var fs = x.filas.slice().sort(function (a, b) { return b.precio - a.precio; });
      var hh = '<button class="cerrar">Cerrar</button><h3>Las ' + ent(fs.length) +
        (fs.length === 1 ? ' venta' : ' ventas') + ' de ' + esc(x.razon) +
        ' · ' + soles(x.monto) + '</h3>' +
        '<div class="regla">La empresa de cada venta sale del mapa obra→razón social que ' +
        'publica el motor. Ordenadas de mayor a menor precio.</div>' +
        '<div class="envoltura-tabla"><table class="datos"><thead><tr>' +
        '<th>Fecha</th><th>Proyecto</th><th>Unidad</th><th>Cliente</th><th>Asesor</th>' +
        '<th>Modalidad</th><th class="num">Precio</th></tr></thead><tbody>';
      fs.slice(0, 250).forEach(function (f) {
        hh += '<tr><td>' + esc(String(f.fecha || "—")) + '</td>' +
          '<td class="obra">' + esc(String(f.obra || "—")) + '</td>' +
          '<td>' + esc(String(f.unidad || "—")) + '</td>' +
          '<td>' + esc(String(f.cliente || "—")) + '</td>' +
          '<td>' + esc(String(f.asesor || "—")) + '</td>' +
          '<td>' + esc(String(f.modalidad || "—")) + '</td>' +
          '<td class="num">' + soles(f.precio) + '</td></tr>';
      });
      hh += '</tbody></table></div>';
      if (fs.length > 250) hh += '<p class="mas">Se muestran las 250 primeras de ' +
        ent(fs.length) + '.</p>';
      return hh;
    }

    if (id === "sep") return this.filasArea("Separaciones",
      "Lo que el cliente entregó para apartar la unidad. NO entra en el contratado: sumarlo " +
      "contaría como firmado algo que todavía puede soltar.");
    if (id === "dev") return this.filasArea("Devoluciones",
      "Lo que el cliente entregó y que habría que devolverle. No es el precio pactado.");
    if (id !== "ventas") return null;
    var mes = el.getAttribute("data-mes");
    if (mes) return this.detalleMes(mes);
    var obra = el.getAttribute("data-obra");
    if (obra) return this.detalleObra(obra);
    var st = el.getAttribute("data-stock");
    if (st) return this.detalleStock(st);
    return null;
  },

  detalleMes: function (mes) {
    var V = ventasDelPeriodo(D.meses[P] || D.meses["None"]);
    var f = V.filas.filter(function (r) { return String(mesDe(r.fecha)) === String(mes); });
    return tablaVentas(f, (MES[+mes] || ("Mes " + mes)),
      "Las ventas con estado «Vendido» firmadas en " + (MES[+mes] || mes) +
      ", con los filtros de proyecto y razón social puestos.");
  },
  detalleObra: function (obra) {
    var V = ventasDelPeriodo(D.meses[P] || D.meses["None"]);
    var f = V.filas.filter(function (r) { return String(r.obra) === obra; });
    var a = (D.avance || {})[obra] || {};
    return tablaVentas(f, obra,
      "Padrón de " + (a.u_tot || 0) + " unidades · " + (a.u_vend || 0) + " vendidas" +
      (a.sin_precio ? " · " + a.sin_precio + " sin precio cargado, que cuentan en el padrón " +
       "pero no en los soles" : "") +
      ". Abajo, las ventas de esta obra que caen en el período elegido.");
  },
  detalleStock: function (obra) {
    var dr = (D.meses[P] || D.meses["None"]).drills["Falta vender"];
    var i = colDe(dr, ["obra"]);
    var f = (dr.filas || []).filter(function (r) { return String(r[i]) === obra; });
    if (!f.length) return '<button class="cerrar">Cerrar</button><p>Sin unidades libres.</p>';
    var h = '<button class="cerrar">Cerrar</button><h3>' + esc(obra) + ' · ' + f.length +
      (f.length === 1 ? ' unidad libre' : ' unidades libres') + '</h3>' +
      '<div class="envoltura-tabla"><table class="datos"><thead><tr>' +
      (dr.cols || []).map(function (c, k) {
        return '<th' + (k === dr.cols.length - 1 ? ' class="num"' : '') + '>' + esc(c) + '</th>';
      }).join("") + '</tr></thead><tbody>';
    f.forEach(function (r) {
      h += '<tr>' + r.map(function (c, k) {
        return '<td' + (k === r.length - 1 ? ' class="num"' : '') + '>' + esc(String(c)) + '</td>';
      }).join("") + '</tr>';
    });
    return h + '</tbody></table></div>';
  },

  filasArea: function (nombre, regla) {
    var b = (D.areas_filas.Ventas || []).filter(function (x) { return x.nombre === nombre; })[0];
    if (!b) return '<button class="cerrar">Cerrar</button><p>Sin filas.</p>';
    var filas = (b.filas || []).filter(function (r) {
      return entraObra(String(r.obra || "")) && entraAsesor(r.asesor);
    });
    if (!filas.length) return '<button class="cerrar">Cerrar</button>' +
      '<p>Ninguna fila con el filtro puesto.</p>';

    var nMedio = Math.max.apply(null, filas.map(function (r) { return (r.d || []).length; }));
    var decl = (b.cols || []).slice(2, -1);
    var medio = [];
    for (var k = 0; k < nMedio; k++) medio.push(decl[k] !== undefined ? decl[k] : "Detalle");
    var cab = ["Fecha", "Obra"].concat(medio, ["Entregado"]);

    var s = 0;
    filas.forEach(function (r) { var n = num(r.monto); if (n !== null) s += n; });
    var h = '<button class="cerrar">Cerrar</button><h3>' + esc(nombre) + ' · ' + filas.length +
      (filas.length === 1 ? ' fila' : ' filas') + '</h3>' +
      '<div class="regla">' + esc(regla) + '</div>' +
      '<div class="resumen-det"><span>' + filas.length + ' de ' + (b.filas || []).length +
      ' filas</span><span class="suma">Entregado · <b>' + soles(s) + '</b></span></div>' +
      '<div class="envoltura-tabla"><table class="datos"><thead><tr>';
    cab.forEach(function (c, i) {
      h += '<th' + (i === cab.length - 1 ? ' class="num"' : '') + '>' + esc(c) + '</th>';
    });
    h += '</tr></thead><tbody>';
    filas.forEach(function (r) {
      h += '<tr><td>' + esc(r.fecha) + '</td><td class="obra">' + esc(r.obra) + '</td>';
      for (var k = 0; k < nMedio; k++) h += '<td>' + esc((r.d || [])[k] || "") + '</td>';
      h += '<td class="num">' + soles(r.monto) + '</td></tr>';
    });
    return h + '</tbody></table></div>';
  },

  conectar: function () {}
};

var MES  = ["", "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio",
            "Agosto", "Setiembre", "Octubre", "Noviembre", "Diciembre"];
var MES3 = ["", "Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul",
            "Ago", "Set", "Oct", "Nov", "Dic"];

function mesDe(f) {
  var m = /^(\d{4})-(\d{2})/.exec(String(f || ""));
  return m ? +m[2] : 0;
}

function ventasDelPeriodo(M) {
  var E = (M && M.estructura) || {};
  var filas = [];
  (E.modalidad || []).forEach(function (mo) {
    (mo.detalle || []).forEach(function (v) {
      if (!entraObra(String(v.obra || ""))) return;
      if (!entraAsesor(v.asesor)) return;
      filas.push({
        cliente: v.cliente, obra: v.obra, unidad: v.unidad, fecha: v.fecha,
        asesor: v.asesor, banco: v.banco, modalidad: mo.modalidad || "",
        precio: num(v.precio) || 0, entro: num(v.entro) || 0
      });
    });
  });
  var hoy = new Date();
  return {
    filas: filas,
    contratado: filas.reduce(function (s, r) { return s + r.precio; }, 0),
    entro: filas.reduce(function (s, r) { return s + r.entro; }, 0),
    mesEnCurso: hoy.getMonth() + 1,
    dia: hoy.getDate(),
    diasMes: new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0).getDate()
  };
}

function tablaVentas(filas, titulo, regla) {
  if (!filas.length) return '<button class="cerrar">Cerrar</button><h3>' + esc(titulo) +
    '</h3><p>Ninguna venta con los filtros puestos.</p>';
  var suma = filas.reduce(function (s, r) { return s + r.precio; }, 0);
  var ent = filas.reduce(function (s, r) { return s + r.entro; }, 0);
  var h = '<button class="cerrar">Cerrar</button>' +
    '<h3>' + esc(titulo) + ' · ' + filas.length +
    (filas.length === 1 ? ' venta' : ' ventas') + '</h3>' +
    (regla ? '<div class="regla">' + esc(regla) + '</div>' : '') +
    '<div class="cifras-ficha">' +
      '<div class="cf"><span class="cf-rot">Contratado</span>' +
        '<span class="cf-val">' + soles(suma) + '</span></div>' +
      '<div class="cf"><span class="cf-rot">De eso, ya entró</span>' +
        '<span class="cf-val">' + soles(ent) + '</span></div>' +
      '<div class="cf"><span class="cf-rot">Ticket promedio</span>' +
        '<span class="cf-val">' + soles(suma / filas.length) + '</span></div>' +
    '</div>' +
    '<div class="envoltura-tabla"><table class="datos"><thead><tr>' +
    '<th>Fecha</th><th>Proyecto</th><th>Unidad</th><th>Modalidad</th><th>Asesor</th>' +
    '<th class="num">Precio</th><th class="num">Entró</th></tr></thead><tbody>';
  filas.slice().sort(function (a, b) { return String(a.fecha).localeCompare(String(b.fecha)); })
    .forEach(function (r) {
      h += '<tr><td>' + esc(r.fecha) + '</td>' +
        '<td class="obra">' + esc(r.obra) + '</td>' +
        '<td>' + esc(r.unidad || "—") + '</td>' +
        '<td>' + esc(r.modalidad) + '</td>' +
        '<td>' + esc(r.asesor || "—") + '</td>' +
        '<td class="num">' + soles(r.precio) + '</td>' +
        '<td class="num">' + soles(r.entro) + '</td></tr>';
    });
  return h + '</tbody></table></div>' +
    '<p class="mas">El cliente no se publica en el tablero: la lista con nombres y teléfonos sale ' +
    'aparte, con <code>exportar_seguimiento.py</code>, y se entrega en mano.</p>';
}
</script>
