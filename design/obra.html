<script>
window.HOJA = {
  id: "obra",
  nombre: "Obra",
  pregunta: "¿Vamos en plazo y cuánto costó?",
  fuentes: ["AXION"],

  pintar: function (M, D) {
    var f = this.filas(M, D);
    var H = "";
    H += this.sol(M, D, f);
    H += avisoAlcance(
      "las obras, su etapa, su avance declarado y su costo registrado",
      "las órdenes de compra, los proveedores y los materiales");
    H += this.tabla(M, D, f);
    H += this.sinObra(D);
    H += this.faltantes(M, D);
    H += this.logistica(M, D);
    return H;
  },

  filas: function (M, D) {
    var avf = {};
    (D.avance_fisico || []).forEach(function (x) { avf[x.obra] = x; });
    var self = this;
    return (M.obras || []).filter(function (o) { return entraObra(o.obra); })
      .map(function (o) {
        var a = avf[o.obra] || {};
        var c = (o.costo === undefined || o.costo === null) ? null : o.costo;
        return {
          obra: o.obra,
          etapa: o.etapa || a.etapa || "—",
          pct: (a.pct === undefined || a.pct === null) ? null : a.pct,
          costo: c,
          mov: self.movDe(o.costo_nota),
          nota: o.costo_nota || "",
          empresa: o.empresa || ""
        };
      });
  },
  movDe: function (nota) {
    var m = /^(\d+)\s*mov/.exec(String(nota || ""));
    return m ? parseInt(m[1], 10) : null;
  },

  sol: function (M, D, f) {
    var per = D.nombres_mes[P] || "";
    var ejec = f.filter(function (o) { return o.etapa === "Ejecución"; });
    var conPct = ejec.filter(function (o) { return o.pct !== null; });
    var avance = conPct.length
      ? conPct.reduce(function (s, o) { return s + o.pct; }, 0) / conPct.length : null;
    var enCero = f.filter(function (o) { return o.pct === 0; }).length;

    var otras = {}, ord = [];
    f.forEach(function (o) {
      if (o.etapa === "Ejecución") return;
      if (otras[o.etapa] === undefined) { otras[o.etapa] = 0; ord.push(o.etapa); }
      otras[o.etapa]++;
    });
    var restoTxt = ord.map(function (e) { return otras[e] + " en " + e.toLowerCase(); }).join(" · ");

    var conCosto = f.filter(function (o) { return o.costo !== null; });
    var costo = conCosto.reduce(function (s, o) { return s + o.costo; }, 0);
    var mov = conCosto.reduce(function (s, o) { return s + (o.mov || 0); }, 0);

    var r = (D.movimientos || {}).resumen || {};
    var gTot = ((r.gasto || {}).monto) || 0;
    var pctSin = gTot ? 100 * (r.gasto_sin_atribuir || 0) / gTot : null;
    var pctSinPer = this.pctSinDelPeriodo(M);

    var h = '<div class="sol"><span class="overline">La obra al corte · ' +
      esc(per) + '</span><div class="sol-tres">';

    h += cifraSol({
      k: "Obras en ejecución",
      v: ent(ejec.length),
      raya: !ejec.length,
      n: "de " + f.length + plu(f.length, " obra", " obras") +
         (OBRA || RS ? " en el alcance elegido" : " declaradas en AXION") +
         (restoTxt ? " · " + esc(restoTxt) : "") +
         " · la etapa la declara Obra en la ficha de cada proyecto"
    });

    h += cifraSol({
      k: "Avance físico de las obras en ejecución",
      v: avance === null ? "—" : pct(avance),
      raya: avance === null,
      n: avance === null
        ? "ninguna obra del alcance está en ejecución"
        : "promedio simple de " + (conPct.length === 1 ? "la única obra en ejecución"
            : "las " + conPct.length + " obras en ejecución") +
          (conPct.length !== ejec.length
            ? " (" + (ejec.length - conPct.length) + " sin avance declarado, fuera del promedio)" : "") +
          " · lo escribe Obra a mano en AXION y <b>no tiene fecha</b>: es la foto de hoy, " +
          "no la del mes elegido" +
          (enCero ? " · " + enCero + plu(enCero, " obra del alcance está", " obras del alcance están") +
            " en 0% de avance" : "")
    });

    h += cifraSol({
      k: "Costo de obra registrado · " + per,
      v: conCosto.length ? soles(costo) : "—",
      raya: !conCosto.length,
      abre: "costo", rot: "Ver mes por mes",
      n: conCosto.length
        ? ent(mov) + " movimientos del libro de caja de AXION que llevan escrito el " +
          "nombre de la obra · " + conCosto.length + " de " + f.length +
          plu(f.length, " obra", " obras") +
          (pctSinPer === null ? "" :
            " · <b>el " + pct(pctSinPer) + " del gasto de caja de " + esc(per) +
            " no lleva ninguna obra escrita y no está sumado acá</b>")
        : "ningún movimiento del libro de caja lleva el nombre de " +
          (f.length === 1 ? "esta obra" : "estas obras") + " en " +
          esc(per) + " · no es un cero: es que no hay con qué"
    });

    return h + '</div><div class="detalle" id="det-costo"></div></div>';
  },

  pctSinDelPeriodo: function (M) {
    var g = null;
    (M.resultados || []).forEach(function (x) {
      if (/^Gasto (registrado|del mes)$/.test(String(x.etiqueta)) &&
          typeof x.valor === "number") g = x.valor;
    });
    if (!g) return null;
    var a = 0;
    (M.obras || []).forEach(function (o) {
      if (o.costo !== null && o.costo !== undefined) a += o.costo;
    });
    if (a > g) return null;
    return 100 * (g - a) / g;
  },

  tabla: function (M, D, f) {
    if (!f.length) return "";
    var per = D.nombres_mes[P] || "";
    var lista = f.slice().sort(function (a, b) {
      if ((a.costo === null) !== (b.costo === null)) return a.costo === null ? 1 : -1;
      return (b.costo || 0) - (a.costo || 0) || (b.pct || 0) - (a.pct || 0);
    });
    var maxC = Math.max.apply(null, lista.map(function (o) { return o.costo || 0; })) || 1;
    var tC = 0, tM = 0, nC = 0, sin = [];
    lista.forEach(function (o) {
      if (o.costo === null) { sin.push(o.obra); return; }
      tC += o.costo; tM += (o.mov || 0); nC++;
    });

    var h = cabSeccion("Proyecto por proyecto", "", "obras");
    h += '<div class="tarjeta" style="padding:var(--e4) var(--e2)">' +
      '<div class="envoltura-tabla"><table class="datos"><thead><tr>' +
      '<th>Proyecto</th><th style="width:32%">Costo (ancho) · avance declarado (relleno)</th>' +
      '<th class="num">Costo registrado</th><th class="num">Movimientos</th>' +
      '<th class="num">Avance</th></tr></thead><tbody>';

    lista.forEach(function (o, i) {
      h += filaRiel({
        nombre: o.obra,
        sub: o.etapa + " · " + (o.nota ||
          ("ningún movimiento de caja a su nombre en " + per)),
        ancho: 100 * (o.costo || 0) / maxC,
        pct: o.pct,
        abre: "ob" + i,
        datos: 'data-o="' + esc(o.obra) + '"',
        celdas: [
          o.costo === null ? '<span class="raya">—</span>' : soles(o.costo),
          o.mov === null ? '<span class="raya">—</span>' : ent(o.mov)
        ]
      });
    });

    h += '<tr class="total"><td class="obra"><span class="ob-nom">TOTAL</span>' +
      '<span class="ob-sub">' + nC + ' de ' + lista.length +
      plu(lista.length, ' obra', ' obras') +
      ' con costo a su nombre en ' + esc(per) + '</span></td>' +
      '<td><span class="riel-obra" style="width:100%"><span class="lleno" ' +
      'style="width:100%"></span></span></td>' +
      '<td class="num">' + (nC ? soles(tC) : '<span class="raya">—</span>') + '</td>' +
      '<td class="num">' + ent(tM) + '</td><td class="num"></td></tr>' +
      '</tbody></table></div>';

    if (sin.length) {
      var hist = {};
      ((D.movimientos || {}).por_obra || []).forEach(function (x) { hist[x.obra] = x; });
      var conHist = sin.filter(function (o) { return hist[o]; });
      var nunca = sin.filter(function (o) { return !hist[o]; });
      h += '<p class="mas" style="padding:0 var(--e2)"><b>' + sin.length +
        plu(sin.length, ' obra no tiene ningún movimiento a su nombre en ',
                        ' obras no tienen ningún movimiento a su nombre en ') +
        esc(per) + ':</b> ' + esc(sin.join(" · ")) +
        '. Van con raya y no con cero: no significa que no hayan costado, ' +
        'significa que ningún movimiento las nombra <b>en ' + esc(per) + '</b>.' +
        (conHist.length
          ? ' De hecho ' + esc(conHist.map(function (o) {
              return o + " (" + ent(hist[o].movimientos) + " mov. · " +
                     soles(hist[o].gasto) + ")"; }).join(" y ")) +
            plu(conHist.length, ' sí tiene', ' sí tienen') +
            ' gasto a su nombre en el libro completo, fuera de este período.'
          : '') +
        (nunca.length && conHist.length
          ? ' Las otras ' + nunca.length + ' no aparecen en ningún año.'
          : '') + '</p>';
    }

    h += '</div>';
    lista.forEach(function (o, i) {
      h += '<div class="detalle" id="det-ob' + i + '"></div>';
    });
    return h + '</section>';
  },

  sinObra: function (D) {
    var m = D.movimientos || {};
    if (!m.hay) return "";
    var r = m.resumen || {}, g = (r.gasto || {});
    var sinAtr = r.gasto_sin_atribuir, gTot = g.monto || 0;
    if (!gTot) return "";
    var pctSin = 100 * sinAtr / gTot;

    var noObra = {};
    (m.sin_atribuir || []).forEach(function (x) { noObra[x.proyecto] = true; });
    var rot = ((m.desglose || {}).gasto || []).filter(function (x) { return noObra[x.clave]; });
    var cubre = rot.reduce(function (s, x) { return s + x.monto; }, 0);
    var resto = sinAtr - cubre;
    var maxM = rot.length ? rot[0].monto : 1;
    var movObra = (m.por_obra || []).reduce(function (s, x) { return s + (x.movimientos || 0); }, 0);
    var sinFilas = (g.filas || 0) - movObra;
    var rotFilas = rot.reduce(function (s, x) { return s + (x.filas || 0); }, 0);
    var restoFilas = sinFilas - rotFilas;
    var totSA = (m.sin_atribuir || []).reduce(function (s, x) { return s + (x.monto || 0); }, 0);
    var aviso = (m.avisos || []).filter(function (a) {
      return /proyecto/i.test(String(a.etiqueta));
    })[0];

    var h = cabSeccion("El gasto que no llega a ninguna obra", "", "sinobra");

    h += '<div class="rejilla-2"><div class="tarjeta" style="padding:var(--e4) var(--e2)">' +
      '<div class="envoltura-tabla"><table class="datos"><thead><tr>' +
      '<th>Rótulo tal como lo escribe AXION</th><th style="width:30%">Peso</th>' +
      '<th class="num">Movimientos</th><th class="num">Gasto</th>' +
      '</tr></thead><tbody>';
    rot.forEach(function (x) {
      h += '<tr><td class="obra"><span class="ob-nom">' +
        esc(rotuloProyecto(x.clave)) + '</span></td>' +
        '<td><span class="riel-obra" style="width:' +
        Math.max(3, 100 * x.monto / maxM) + '%"><span class="lleno" ' +
        'style="width:100%"></span></span></td>' +
        '<td class="num">' + ent(x.filas) + '</td>' +
        '<td class="num">' + soles(x.monto) + '</td></tr>';
    });
    if (resto > 0.005)
      h += '<tr><td class="obra"><span class="ob-nom">Otros rótulos más chicos</span>' +
        '<span class="ob-sub">no entran en los ' + rot.length +
        ' de arriba, que son los mayores</span></td><td></td>' +
        '<td class="num">' + (restoFilas > 0 ? ent(restoFilas) : '<span class="raya">—</span>') +
        '</td><td class="num">' + soles(resto) + '</td></tr>';
    h += '<tr class="total"><td class="obra"><span class="ob-nom">GASTO SIN OBRA</span>' +
      '<span class="ob-sub">' + pct(pctSin) + ' del gasto del libro de caja (' +
      soles(gTot) + ' en ' + ent(g.filas) + ' movimientos)</span></td><td></td>' +
      '<td class="num">' + (sinFilas > 0 ? ent(sinFilas) : '<span class="raya">—</span>') + '</td>' +
      '<td class="num">' + soles(sinAtr) + '</td></tr>' +
      '</tbody></table></div>' +
      '<p class="mas" style="padding:0 var(--e2)">Los ' + rot.length +
      ' rótulos listados suman ' + soles(cubre) + ' — ' +
      pct(sinAtr ? 100 * cubre / sinAtr : 0) + ' de lo que no llega a ninguna obra. ' +
      'El resto está repartido en rótulos más chicos, que el payload no desglosa ' +
      'uno por uno.</p></div>';

    h += '<div>' +
      tarjetaAbrible("rotulos", "Los " + (m.sin_atribuir || []).length +
        " rótulos que no son obra", totSA,
        "el total de TODO lo que mueven esos rótulos: gasto, ventas y presupuesto " +
        "juntos — no es gasto, y por eso no se compara con la tabla de al lado",
        "Ver los " + (m.sin_atribuir || []).length + " con su monto", null);
    if (aviso)
      h += '<div class="hallazgo" style="margin-top:var(--e4)">' +
        '<span class="q">El campo «proyecto» se autodetecta del concepto</span>' +
        'Mezcla obras con centros de costo —<b>Remuneracion</b>, <b>Comisiones</b>, ' +
        '<b>Oficina</b>— y con obras que AXION no declara —<b>Miami Beeach</b>, ' +
        '<b>Proyecto Chancay</b>, <b>Jr. Islas</b>—. Nada de esto se reparte entre ' +
        'las 18 obras: se muestra tal cual, con su <span class="cif">' +
        soles(sinAtr) + '</span> de gasto.' +
        '<span class="quien">' + esc(aviso.area || "") + '</span></div>';
    h += '</div></div><div class="detalle" id="det-rotulos"></div></section>';
    return h;
  },

  faltantes: function (M, D) {
    var ind = (M.indicadores || []).filter(function (x) {
      return x.area_bsc === "Obra" && x.estado === "sin fuente";
    });
    var r = (D.movimientos || {}).resumen || {};
    var gTot = ((r.gasto || {}).monto) || 0;
    var atr = r.gasto_atribuido || 0, sinAtr = r.gasto_sin_atribuir || 0;
    var pctAtr = gTot ? 100 * atr / gTot : null;
    var pctSin = gTot ? 100 * sinAtr / gTot : null;

    var propio = {
      "Avance físico vs gasto ejecutado": {
        q: "Los dos lados existen por separado —el avance lo escribe Obra, el gasto está " +
           "en el libro de caja— pero solo el " + pct(pctAtr) + " del gasto lleva el nombre " +
           "de una obra (" + soles(atr) + " de " + soles(gTot) + "). Dividir uno por otro " +
           "hoy daría un costo por punto de avance que no es el de la obra.",
        r: "que cada gasto se cargue con su obra en el campo «proyecto», y que Obra " +
           "actualice el avance con la misma frecuencia con la que se carga el gasto"
      },
      "Costo por m² ejecutado": {
        q: "Los metros cuadrados ya están cargados en AXION, unidad por unidad. Lo que " +
           "falta es el otro lado: " + soles(sinAtr) + " de gasto (" + pct(pctSin) +
           ") no lleva obra, así que el costo por m² saldría más bajo que el real.",
        r: "el gasto con su obra escrita. Los m² no hacen falta pedirlos: ya están cargados"
      }
    };

    var bloques = ind.map(function (x) {
      var p = propio[x.indicador];
      return faltaBloque(x.indicador, (p && p.q) || x.motivo,
                         (p && p.r) || x.necesita, x.area);
    });

    var pres = r.presupuesto || {};
    var dp = ((D.movimientos || {}).desglose || {}).presupuesto || [];
    var rotPres = ((D.movimientos || {}).sin_atribuir || []).filter(function (x) {
      return x.proyecto === "Presupuesto";
    })[0];
    var prAtr = r.presupuesto_atribuido, prFilas = r.presupuesto_atribuido_filas;
    var prObras = r.presupuesto_obras || [];
    var frasePres = (prFilas === undefined || prFilas === null)
      ? ", y el payload no dice cuántos quedan pegados a una obra"
      : (prFilas === 0
          ? ", y ninguno queda pegado a una obra"
          : ", y solo " + ent(prFilas) + plu(prFilas, " queda pegado", " quedan pegados") +
            " a una obra (" + soles(prAtr) + " en " + esc(prObras.join(" y ")) + ")");
    if (pres.monto) {
      bloques.push(faltaBloque("Presupuesto por obra",
        "AXION registra " + soles(pres.monto) + " de presupuesto en " + ent(pres.filas) +
        " movimientos" + (dp.length ? " (" + dp.map(function (x) { return x.clave; }).join(" y ") + ")" : "") +
        frasePres +
        (rotPres ? ": el rótulo «Presupuesto» concentra " + ent(rotPres.filas) +
          " movimientos y no empareja con ninguna de las 18" : "") +
        ". Sin presupuesto por obra, los " + soles(atr) + " ya gastados no tienen " +
        "contra qué medirse.",
        "que cada movimiento de presupuesto lleve su obra en el campo «proyecto», " +
        "como ya lo llevan los de gasto",
        "Administración · y Obra"));
    }
    if (!bloques.length) return "";

    return cabSeccion("Lo que hace falta para contestar «¿vamos en plazo?»", "", "falta") +
      '<div class="rejilla-3">' + bloques.join("") + '</div></section>';
  },

  logistica: function (M, D) {
    var L = ((D.areas || {})["Logística"]) || [];
    if (!L.length) return "";
    var ord = L.filter(function (x) { return /Órdenes de compra/i.test(x.etiqueta); })[0];
    var v = ventana(ord ? ord.formula : "");
    var nec = {};
    (M.indicadores || []).forEach(function (i) {
      if (i.necesita) nec[i.indicador] = i.necesita;
    });
    nec["Compras fuera del precio de referencia"] = nec["Compras fuera del precio de referencia"] ||
      "que el precio de referencia del catálogo se cargue aparte de la compra: mientras " +
      "se copie de ella, la comparación da cero siempre y no puede detectar un sobreprecio";

    var cards = [], faltan = [];
    L.forEach(function (x) {
      var nulo = (x.valor === null || x.valor === undefined);
      var ciego = (x.valor === 0 && x.motivo);
      if (nulo || ciego) {
        faltan.push(faltaBloque(x.etiqueta,
          (ciego ? "El control corre y da cero, pero hoy no puede detectar nada. " : "") +
          mayus(limpio(x.motivo || x.formula || "")),
          nec[x.etiqueta] || "", x.area || "Logística"));
        return;
      }
      var nota = '<span>' + esc(limpio(x.formula || "")) + '</span>';
      if (/Concentraci/i.test(x.etiqueta)) {
        if (v && ord) nota += '<br><span style="color:var(--texto-suave-app)">con ' +
          ent(ord.valor) + ' órdenes en ' + v.dias + ' días de historia, esta cifra ' +
          'todavía no describe un patrón de compra</span>';
      } else if (x.motivo) {
        nota += '<br><span style="color:var(--texto-suave-app)">' +
          esc(limpio(x.motivo)) + '</span>';
      }
      cards.push(tarjetaSimple(x.etiqueta, null, nota, {
        crudo: true,
        html: '<div class="cifra-g">' + cifraLog(x.etiqueta, x.valor) + '</div>'
      }));
    });

    var h = cabSeccion("Logística · el módulo de compras", "", "logistica");
    if (cards.length) h += '<div class="rejilla-4">' + cards.join("") + '</div>';
    if (faltan.length) h += '<div class="rejilla-3" style="margin-top:var(--e4)">' +
      faltan.join("") + '</div>';
    return h + '</section>';
  },

  detalle: function (id, el) {
    if (id === "costo") return this.detCosto(null);
    if (/^ob\d+$/.test(id)) return this.detCosto(el.getAttribute("data-o"));
    if (id === "rotulos") return this.detRotulos();
    return null;
  },

  detCosto: function (obra) {
    var ks = Object.keys(D.meses).filter(function (k) { return /^\d{1,2}$/.test(k); })
      .sort(function (a, b) { return a - b; });
    var self = this;
    var fila = function (k) {
      var lst = (D.meses[k].obras || []).filter(function (o) {
        return entraObra(o.obra) && (!obra || o.obra === obra);
      });
      var c = 0, mv = 0, n = 0, hay = false;
      lst.forEach(function (o) {
        if (o.costo === null || o.costo === undefined) return;
        hay = true; c += o.costo; n++; mv += (self.movDe(o.costo_nota) || 0);
      });
      return {
        nom: (D.nombres_mes[k] || k).replace(/^\d{4}\s*·\s*/, ""),
        costo: hay ? c : null, mov: mv, obras: n
      };
    };
    var ms = ks.map(fila);
    var tot = ms.reduce(function (s, m) { return s + (m.costo || 0); }, 0);
    var totM = ms.reduce(function (s, m) { return s + m.mov; }, 0);
    var max = Math.max.apply(null, ms.map(function (m) { return m.costo || 0; })) || 1;

    var hist = null;
    ((D.movimientos || {}).por_obra || []).forEach(function (x) {
      if (obra ? x.obra === obra : entraObra(x.obra)) {
        hist = hist || {gasto: 0, movimientos: 0};
        hist.gasto += x.gasto; hist.movimientos += x.movimientos;
      }
    });

    var h = '<button class="cerrar">Cerrar</button><h3>' +
      esc(obra ? obra + " · costo mes por mes" : "Costo registrado, mes por mes") +
      '</h3><div class="regla">Suma de los movimientos del Registro de Movimientos de AXION ' +
      'cuyo campo «proyecto» empareja con la obra por ' +
      'palabras completas, nunca por prefijo. Las equivalencias están <b>pendientes de ' +
      'aprobar</b> por Habitat: hasta entonces lo que no empareja no se reparte. ' +
      'Esta tabla abre el año entero, no solo el mes elegido arriba.</div>';

    if (obra) {
      var fi = this.filas(D.meses[P] || D.meses["None"], D)
        .filter(function (o) { return o.obra === obra; })[0];
      if (fi) h += '<div class="resumen-det"><span>Etapa · <b>' + esc(fi.etapa) +
        '</b></span><span>Avance declarado · <b>' + pct(fi.pct) +
        '</b></span><span>Razón social · <b>' + esc(fi.empresa) + '</b></span></div>';
    }

    h += '<div class="envoltura-tabla"><table class="datos"><thead><tr>' +
      '<th>Mes</th><th style="width:34%">Peso del mes</th>' +
      '<th class="num">Movimientos</th>' + (obra ? '' : '<th class="num">Obras</th>') +
      '<th class="num">Costo del mes</th></tr></thead><tbody>';
    ms.forEach(function (m) {
      h += '<tr><td class="obra"><span class="ob-nom">' + esc(m.nom) + '</span></td>' +
        '<td><span class="riel-obra" style="width:' +
        Math.max(3, 100 * (m.costo || 0) / max) + '%"><span class="lleno" style="width:' +
        (m.costo ? 100 : 0) + '%"></span></span></td>' +
        '<td class="num">' + (m.costo === null ? '<span class="raya">—</span>' : ent(m.mov)) + '</td>' +
        (obra ? '' : '<td class="num">' + (m.costo === null ? '<span class="raya">—</span>' : ent(m.obras)) + '</td>') +
        '<td class="num">' + (m.costo === null ? '<span class="raya">—</span>' : soles(m.costo)) + '</td></tr>';
    });
    h += '<tr class="total"><td class="obra"><span class="ob-nom">TOTAL DEL AÑO</span></td>' +
      '<td></td><td class="num">' + ent(totM) + '</td>' + (obra ? '' : '<td class="num"></td>') +
      '<td class="num">' + soles(tot) + '</td></tr></tbody></table></div>';

    if (hist) {
      var igual = Math.abs(hist.gasto - tot) < 0.005;
      h += '<p class="mas">' + (igual
        ? 'Todos los años dan lo mismo: <b>' + soles(hist.gasto) + '</b> en ' +
          ent(hist.movimientos) + ' movimientos. El libro de caja va de ' +
          esc(((D.movimientos || {}).resumen || {}).periodo || "") +
          ', así que ningún movimiento con nombre de obra es anterior a 2026.'
        : 'Todos los años: <b>' + soles(hist.gasto) + '</b> en ' + ent(hist.movimientos) +
          ' movimientos. La diferencia contra el año en curso es ' +
          soles(hist.gasto - tot) + ' de meses anteriores.') + '</p>';
    }
    return h;
  },

  detRotulos: function () {
    var sa = ((D.movimientos || {}).sin_atribuir || []);
    if (!sa.length) return '<button class="cerrar">Cerrar</button><p>Sin filas.</p>';
    var noObra = {};
    sa.forEach(function (x) { noObra[x.proyecto] = true; });
    var gasto = {};
    (((D.movimientos || {}).desglose || {}).gasto || []).forEach(function (x) {
      if (noObra[x.clave]) gasto[x.clave] = x;
    });
    var tot = sa.reduce(function (s, x) { return s + (x.monto || 0); }, 0);
    var max = Math.max.apply(null, sa.map(function (x) { return x.monto || 0; })) || 1;

    var h = '<button class="cerrar">Cerrar</button><h3>Los ' + sa.length +
      ' rótulos de «proyecto» que no son ninguna de las 18 obras</h3>' +
      '<div class="regla">El monto de la izquierda mueve <b>todos los tipos de ' +
      'movimiento</b> —gasto, ventas y presupuesto—, por eso suma mucho más que el ' +
      'gasto. La columna «De eso, gasto» aísla la parte que sí es gasto, y solo se ' +
      'puede medir en los rótulos más grandes: el payload trae el desglose de gasto ' +
      'de los 30 mayores.</div>' +
      '<div class="resumen-det"><span>' + sa.length + ' rótulos</span>' +
      '<span class="suma">Mueven en total · <b>' + soles(tot) + '</b></span>' +
      '<span>De eso, gasto sin obra · ' +
      soles(((D.movimientos || {}).resumen || {}).gasto_sin_atribuir) + '</span></div>' +
      '<div class="envoltura-tabla"><table class="datos"><thead><tr>' +
      '<th>Rótulo</th><th style="width:26%">Peso sobre el total</th>' +
      '<th class="num">Movimientos</th><th class="num">Mueve en total</th>' +
      '<th class="num">De eso, gasto</th></tr></thead><tbody>';
    sa.forEach(function (x) {
      var g = gasto[x.proyecto];
      h += '<tr><td class="obra"><span class="ob-nom">' +
        esc(rotuloProyecto(x.proyecto)) + '</span></td>' +
        '<td><span class="riel-obra" style="width:' +
        Math.max(3, 100 * (x.monto || 0) / max) + '%"><span class="lleno" ' +
        'style="width:100%"></span></span></td>' +
        '<td class="num">' + ent(x.filas) + '</td>' +
        '<td class="num">' + soles(x.monto) + '</td>' +
        '<td class="num">' + (g ? soles(g.monto) : '<span class="raya">—</span>') +
        '</td></tr>';
    });
    return h + '</tbody></table></div>' +
      '<p class="mas">La raya en «De eso, gasto» no dice cero: dice que ese rótulo ' +
      'no entra en los 30 mayores del desglose de gasto, y su parte de gasto no se ' +
      'puede aislar desde esta pantalla.</p>';
  },

  conectar: function (M, D) {
    var r = (D.movimientos || {}).resumen || {};
    var gTot = ((r.gasto || {}).monto) || 0;
    if (gTot) sello(pct(100 * (r.gasto_sin_atribuir || 0) / gTot) +
      " del gasto sin obra", "sinobra");
    else sello("");
  }
};

function cifraSol(o) {
  var abre = o.abre ? ' class="abrible" data-abre="' + o.abre +
    '" aria-expanded="false" tabindex="0" role="button"' : '';
  return '<div' + abre + '><span class="k">' + esc(o.k) + '</span>' +
    '<div class="v"' + (o.raya ? ' style="color:var(--gris-300)"' : '') + '>' + o.v + '</div>' +
    '<div class="n">' + o.n + '</div>' +
    (o.abre ? '<div class="abrir abrir-osc"><span>' + esc(o.rot || "Ver el detalle") +
      '</span><span class="flecha">▸</span></div>' : '') + '</div>';
}

function faltaBloque(titulo, porQue, requiere, area) {
  var linea = 'margin-top:var(--e3);padding-top:var(--e2);' +
    'border-top:1px solid var(--borde);font-size:var(--t-overline)';
  return '<div class="tarjeta" style="border-style:dashed;border-color:var(--borde-fuerte)">' +
    '<span class="overline">Dato que no existe</span>' +
    '<div class="cifra-g raya">—</div>' +
    '<p style="color:var(--texto-fuerte);font-weight:var(--p-etiqueta)">' +
      esc(titulo) + '</p>' +
    '<p style="color:var(--texto-suave);margin-top:4px">' + esc(limpio(porQue)) + '</p>' +
    (requiere ? '<div style="' + linea + ';color:var(--texto-cuerpo);line-height:1.5">' +
      '<b>Requiere</b> ' + esc(limpio(requiere)) + '</div>' : '') +
    '<div style="' + (requiere ? 'margin-top:var(--e2)' : linea) + ';' +
      'letter-spacing:var(--tr-overline);text-transform:uppercase;' +
      'font-size:var(--t-overline);font-weight:var(--p-etiqueta);color:var(--navy-600)">' +
      esc(area || "") + '</div></div>';
}

function rotuloProyecto(v) {
  var s = String(v === null || v === undefined ? "" : v);
  if (s === "(vacío)") return "(nadie escribió obra · campo sin cargar)";
  if (s === "") return "(nadie escribió obra · campo en blanco)";
  return s;
}

function limpio(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/\*\*/g, "").replace(/`/g, "");
}
function mayus(s) {
  s = String(s || "");
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
}
function plu(n, sing, plur) { return n === 1 ? sing : plur; }

/* Un conteo se escribe como conteo y un porcentaje como porcentaje. */
function cifraLog(etiqueta, v) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  if (/concentraci|porcentaje|%/i.test(String(etiqueta)) || v % 1 !== 0) return pct(v);
  return ent(v);
}

function ventana(formula) {
  var m = /del (\d{2})-(\d{2})-(\d{4}) al (\d{2})-(\d{2})-(\d{4})/.exec(String(formula || ""));
  if (!m) return null;
  var a = new Date(+m[3], +m[2] - 1, +m[1]), b = new Date(+m[6], +m[5] - 1, +m[4]);
  var d = Math.round((b - a) / 86400000) + 1;
  if (!isFinite(d) || d < 1) return null;
  return {desde: m[1] + "-" + m[2] + "-" + m[3], hasta: m[4] + "-" + m[5] + "-" + m[6], dias: d};
}
