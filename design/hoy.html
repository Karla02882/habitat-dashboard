<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoy · Habitat Control</title>
<link rel="stylesheet" href="cockpit.css?v=1786485196">
</head>
<body>
<div class="envoltorio">

  <header class="cabecera">
    <div class="cabecera-fila">
      <span class="hoja-nombre" id="hoja-nombre"></span>
      <span class="cabecera-der" id="cab-der"></span>
    </div>
  </header>
  <nav class="nav" id="nav"></nav>
  <div class="subnav" id="subnav"></div>

  <div class="filtros-zona">
    <div class="filtros">
      <div class="filtro"><label for="f-periodo">Período</label><select id="f-periodo"></select></div>
      <div class="filtro" id="caja-rs"><label for="f-rs">Razón social</label><select id="f-rs"></select></div>
      <div class="filtro" id="caja-obra"><label for="f-obra">Proyecto</label><select id="f-obra"></select></div>
      <button class="btn-act" id="btn-act">Actualizar ahora</button>
    </div>
  </div>

  <div class="fuentes" id="fuentes"></div>
  <div id="cargando">leyendo <code>tablero_datos.json</code>…</div>
  <div id="hoja" hidden></div>

</div>

<script>
window.HOJA = {
  id: "hoy",
  nombre: "Resumen",
  pregunta: "¿Qué decido hoy?",
  fuentes: ["AXION"],

  sinRazonObra: false,
  filtros: ["banco"],

  ventanas: {
    "d-saldo": "el filtro de período no mueve esta tabla",
    "d-mesmes": "el filtro de período no mueve esta tabla",
    "d-cierre": "la proyección es del AÑO COMPLETO; los filtros de arriba " +
      "no la recortan",
    "d-evol": "con el mes en curso compara los mismos días del mes anterior " +
      "(del 1 al día de la data); un mes cerrado, completo · no sigue a " +
      "razón social ni proyecto",
  },

  _rsCuenta: function (c) {
    c = String(c || "").toUpperCase();
    if (c.indexOf("CONSTRUCTORA VELASCO") >= 0)
      return "CONSTRUCTORA VELASCO LEON SOCIEDAD ANONIMA CERRADA";
    if (c.indexOf("CORPORACION HABITAT") >= 0)
      return "CORPORACION HABITAT SOCIEDAD ANONIMA CERRADA";
    if (c.indexOf("BIENES RAICES") >= 0)
      return "HABITAT BIENES RAICES EMPRESA INDIVIDUAL DE RESPONSABILIDAD LIMITADA";
    if (c.indexOf("ESCALAR") >= 0)
      return "ESCALAR Y HABITAT GRUPO INMOBILIARIO S.A.C.";
    if (c.indexOf("YEAN") >= 0) return "YEAN WILLIAM VELASCO LEON";
    return "";
  },
  _entraRSCuenta: function (c) { return !RS || this._rsCuenta(c) === RS; },

  pintar: function (M, D) {
    var self = this;
    var pp = perPartes();
    var fl = D.flujo || {};
    var anioCaja = Number(fl.anio || 0);
    var esMes = !pp.hist && pp.mes && pp.anio === anioCaja;
    var mesF = esMes ? (fl.meses || []).filter(function (m) {
      return m.mes === pp.mes; })[0] : null;
    var esAnio = !pp.hist && !pp.mes && pp.anio === anioCaja;
    var E = (M || {}).estructura || {};
    var hayFiltro = !!(RS || OBRA || TIPO || BANCO);

    var cobros = [];
    try {
      (((D.areas_filas || {}).Cobranza || []).filter(function (x) {
        return x.nombre === "Cobrado"; })[0].filas || []).forEach(function (r) {
        var dd = r.d || [];
        cobros.push({f: String(r.fecha || ""), obra: String(r.obra || "—"),
          monto: r.monto || 0, tipo: String(dd[0] || ""),
          cliente: String(dd[1] || "—"), cuenta: String(dd[3] || "")});
      });
    } catch (e) { cobros = []; }

    var prefP = pp.hist ? "" : (String(pp.anio || "") +
      (pp.mes ? "-" + (pp.mes < 10 ? "0" : "") + pp.mes : ""));
    var mesTope = 0;
    (fl.meses || []).forEach(function (m) {
      if (m.pasado || m.en_curso) mesTope = Math.max(mesTope, m.mes); });
    var entraCobro = function (c, pref) {
      if (pref && c.f.indexOf(pref) !== 0) return false;
      if (c.f.indexOf(String(anioCaja)) === 0 &&
          parseInt(c.f.slice(5, 7), 10) > mesTope) return false;
      return entraObra(c.obra) && entraBanco(c.cuenta);
    };
    var Fb0 = ((D.libro || {}).filas) || {};
    var noms0 = Fb0.cuenta || [], obrasLib0 = Fb0.obra || [];
    var esFilaSaldo = function (r) {
      return r[7] === "presupuesto" &&
        String(r[3] || "").trim().toUpperCase().indexOf("SALDO") === 0;
    };
    var entroDe = function (pref) {
      var s = 0;
      (Fb0.f || []).forEach(function (r) {
        if (pref && String(r[0] || "").indexOf(pref) !== 0) return;
        if (r[7] !== "venta" && r[7] !== "presupuesto") return;
        if (esFilaSaldo(r)) return;
        var cu = noms0[r[6]];
        if (!entraBanco(cu)) return;
        if (!self._entraRSCuenta(cu)) return;
        if (OBRA) {
          var ob = (r[5] !== null && r[5] !== undefined) ? obrasLib0[r[5]] : "";
          if (ob !== OBRA) return;
        }
        s += r[4] || 0;
      });
      return s;
    };

    var salioDe = function (pref) {
      var Fb = ((D.libro || {}).filas) || {};
      var noms = Fb.cuenta || [], obrasLib = Fb.obra || [], s = 0;
      (Fb.f || []).forEach(function (r) {
        if (pref && String(r[0] || "").indexOf(pref) !== 0) return;
        if (r[7] !== "gasto") return;
        var cu = noms[r[6]];
        if (!entraBanco(cu)) return;
        if (!self._entraRSCuenta(cu)) return;
        if (OBRA) {
          var ob = (r[5] !== null && r[5] !== undefined) ? obrasLib[r[5]] : "";
          if (ob !== OBRA) return;
        }
        s += r[4] || 0;
      });
      return s;
    };

    var MESLY = ["", "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
                 "Julio", "Agosto", "Setiembre", "Octubre", "Noviembre",
                 "Diciembre"];
    var vivos = (fl.meses || []).filter(function (m) {
      return (m.pasado || m.en_curso) &&
             ((m.entro || 0) > 0 || (m.salio || 0) > 0); });

    var entro = (esMes || esAnio || pp.hist || pp.anio)
      ? entroDe(prefP) : 0;
    var salio = hayFiltro || !(mesF || esAnio)
      ? salioDe(prefP)
      : (mesF ? mesF.salio : ((fl.acumulado || {}).salio || 0));
    var neta = entro - salio;
    var cob = !RS && !OBRA && salio > 0 ? 100 * entro / salio : null;

    /* LO FIRMADO, recortado por razón social / proyecto (filas del motor). */
    var hayRSObra = !!(RS || OBRA || TIPO);
    var EF = E;
    if (E.hay && hayRSObra) {
      var mods = [], tc = 0, tv = 0, te = 0;
      (E.modalidad || []).forEach(function (x) {
        var rows = (x.detalle || []).filter(function (v) {
          return entraObra(String(v.obra || "")); });
        if (!rows.length) return;
        var mm = rows.reduce(function (a, v) { return a + (v.precio || 0); }, 0);
        var me = rows.reduce(function (a, v) { return a + (v.entro || 0); }, 0);
        mods.push({modalidad: x.modalidad, ventas: rows.length, monto: mm,
                   detalle: rows});
        tc += mm; tv += rows.length; te += me;
      });
      EF = {hay: tv > 0, contratado: tc, ventas: tv, entro: te,
            pct_entro: tc > 0 ? 100 * te / tc : 0, modalidad: mods};
    }

    /* LOS DEUDORES VENCIDOS — siguen a período, razón social y proyecto. */
    var pref = prefP;
    var deudores = [];
    try {
      var filasV = ((D.areas_filas || {}).Cobranza || []).filter(function (x) {
        return x.nombre === "Vencido"; })[0].filas || [];
      var porCli = {};
      filasV.forEach(function (r) {
        if (r.fuera) return;
        if (pref && String(r.fecha || "").indexOf(pref) !== 0) return;
        if (!entraObra(String(r.obra || ""))) return;
        var dd = r.d || [];
        var k = String(dd[0] || "—");
        var o = porCli[k] = porCli[k] ||
          {cliente: k, obra: String(r.obra || "—"), unidad: String(dd[4] || ""),
           asesor: String(dd[5] || "—"), cuotas: 0, monto: 0};
        o.cuotas++; o.monto += r.monto || 0;
      });
      deudores = Object.keys(porCli).map(function (k) { return porCli[k]; })
        .sort(function (a, b) { return b.monto - a.monto; });
    } catch (e) { deudores = []; }
    var top5deuda = deudores.slice(0, 5).reduce(function (a, x) {
      return a + x.monto; }, 0);
    var totalDeuda = deudores.reduce(function (a, x) { return a + x.monto; }, 0);

    var Fb2 = ((D.libro || {}).filas) || {};
    var noms2 = Fb2.cuenta || [];
    var apInt = {}, mvMes = {}, mesTopeL = "", fechaTope = "";
    (Fb2.f || []).forEach(function (r) {
      var f = String(r[0] || "");
      if (f.slice(0, 4) !== String(anioCaja)) return;
      var m = f.slice(0, 7);
      if (m > mesTopeL) mesTopeL = m;
      if (f > fechaTope) fechaTope = f;
      var cu = String(noms2[r[6]] || "");
      if (!cu) return;
      var con = String(r[3] || "").replace(/^\s+/, "").toUpperCase();
      if (r[7] === "presupuesto" && con.indexOf("SALDO") === 0) {
        (apInt[cu] = apInt[cu] || {})[m] = (apInt[cu][m] || 0) + (r[4] || 0);
        return;
      }
      var o = (mvMes[cu] = mvMes[cu] || {})[m] =
        mvMes[cu][m] || {e: 0, s: 0, tr: 0, n: 0};
      o.n++;
      if (r[7] === "venta") o.e += r[4] || 0;
      else if (r[7] === "gasto") o.s += r[4] || 0;
      else if (r[7] === "presupuesto") o.tr += r[4] || 0;
    });
    /* Lo de la contadora, por fecha y con la fuente de cada cuenta */
    var ext = (D.saldos_externos || {});
    var EXA = ext.aperturas ||
      (ext.fecha ? (function () { var o = {}; o[ext.fecha] = {cuentas: ext.cuentas || {}}; return o; })() : {});
    var extVal = {}, extFue = {}, corteM = "";
    Object.keys(EXA).forEach(function (f) {
      var m = f.slice(0, 7);
      if (m > mesTopeL) return;             /* una fecha futura no ancla nada */
      var cs = (EXA[f] || {}).cuentas || {};
      var fu = (EXA[f] || {}).fuente || {};
      if (Object.keys(cs).length && m > corteM) corteM = m;
      Object.keys(cs).forEach(function (cu) {
        (extVal[cu] = extVal[cu] || {})[m] = cs[cu];
        (extFue[cu] = extFue[cu] || {})[m] = fu[cu] || "contadora";
      });
    });
    var hayContadora = !!corteM;
    var mesDato = String(D.generado || "").slice(0, 7);
    corteM = (mesDato.slice(0, 4) === String(anioCaja) && mesDato > mesTopeL)
      ? mesDato : mesTopeL;
    var corteN = corteM ? parseInt(corteM.slice(5, 7), 10) : 0;
    var cierreN = corteN > 1 ? corteN - 1 : 12;
    var mesTopeN = mesTopeL ? parseInt(mesTopeL.slice(5, 7), 10) : 0;
    /* Las filas sin cuenta, para declararlas */
    var sinCta = {n: 0, e: 0, s: 0, tr: 0};
    (Fb2.f || []).forEach(function (r) {
      if (String(r[0] || "").slice(0, 4) !== String(anioCaja)) return;
      if (String(noms2[r[6]] || "")) return;
      sinCta.n++;
      if (r[7] === "venta") sinCta.e += r[4] || 0;
      else if (r[7] === "gasto") sinCta.s += r[4] || 0;
      else if (r[7] === "presupuesto") sinCta.tr += r[4] || 0;
    });

    var apAX = D.saldos_iniciales || {};
    var CCm = {};
    var CCb = {}, CCbF = {}, CCax = {};   /* el saldo del banco en la foto del día, su fuente, y lo que AXION decía ESE día */
    (((D.control_cuentas || {}).cuentas) || []).forEach(function (c) {
      if (c.bhoy !== undefined && c.bhoy !== null) CCb[c.cu] = c.bhoy;
      if (c.bhoy_f) CCbF[c.cu] = c.bhoy_f;
      if (c.axb !== undefined && c.axb !== null) CCax[c.cu] = c.axb;
      var porMes = {}, orden = [];
      (c.meses || []).forEach(function (f) { porMes[f.m] = f; orden.push(f.m); });
      if (orden.length) CCm[c.cu] = {ap: c.ap, porMes: porMes, orden: orden};
    });
    var saldos = [], totSaldo = 0, totCierre = 0, cmacSin = 0, alertas = [];
    var universo = {};
    Object.keys(apInt).forEach(function (cu) { universo[cu] = 1; });
    Object.keys(mvMes).forEach(function (cu) { universo[cu] = 1; });
    Object.keys(extVal).forEach(function (cu) { universo[cu] = 1; });
    Object.keys(apAX).forEach(function (cu) { universo[cu] = 1; });
    Object.keys(CCm).forEach(function (cu) { universo[cu] = 1; });
    var nomCorto = function (cu) { return String(cu || ""); };
    Object.keys(universo).forEach(function (cu) {
      if (!entraBanco(cu)) return;
      if (!self._entraRSCuenta(cu)) return;
      var extC = (extVal[cu] || {})[corteM];
      var intC = (apInt[cu] || {})[corteM];
      var cierre = null, fuente = "", nota = "",
          hayAlgunaInt = Object.keys(apInt[cu] || {}).length > 0;
      var apAXm = apAX[cu] || {};
      var apAXk = Object.keys(apAXm).sort()[0];
      if (apAXk && apAXk <= corteM) {
        cierre = apAXm[apAXk];
        Object.keys(mvMes[cu] || {}).forEach(function (m) {
          if (m < apAXk || m >= corteM) return;
          var o = mvMes[cu][m]; cierre += o.tr + o.e - o.s;
        });
        cierre = Math.round(cierre * 100) / 100;
        fuente = "axion-inicial";
        if (intC !== undefined)
          nota = "cargado dos veces: " + soles(intC) + " · Administración";
      }
      else
      if (extC !== undefined) {
        cierre = extC; fuente = extFue[cu][corteM];
        if (intC !== undefined && Math.abs(intC - extC) > 0.01) {
          alertas.push({tipo: "axion-vs-contadora", cuenta: nomCorto(cu),
                        axion: intC, contadora: extC, dif: intC - extC});
          nota = "AXION abrió con " + soles(intC);
        }
        if (fuente === "axion" && !hayAlgunaInt) {
          alertas.push({tipo: "sin-apertura-axion", cuenta: nomCorto(cu), monto: extC});
          nota = "sin apertura en AXION";
        }
      }
      /* 2 · sin contadora para esta cuenta: la fila SALDO de AXION del corte */
      else if (intC !== undefined) {
        cierre = intC; fuente = "registro";
        if (hayContadora) {
          alertas.push({tipo: "fuera-de-lista", cuenta: nomCorto(cu), monto: intC});
          nota = "fuera de la lista de la contadora";
        }
      }
      /* 3 · ni una ni otra: la última apertura anterior más lo movido hasta el corte */
      else {
        var base = "";
        Object.keys(apInt[cu] || {}).concat(Object.keys(extVal[cu] || {})).forEach(function (m) {
          if (m < corteM && m > base) base = m; });
        if (base) {
          cierre = (extVal[cu] || {})[base] !== undefined ? extVal[cu][base] : apInt[cu][base];
          Object.keys(mvMes[cu] || {}).forEach(function (m) {
            if (m < base || m >= corteM) return;
            var o = mvMes[cu][m]; cierre += o.tr + o.e - o.s;
          });
          fuente = "calculado";
          if (hayContadora) {
            alertas.push({tipo: "fuera-de-lista", cuenta: nomCorto(cu), monto: cierre});
            nota = "fuera de la lista de la contadora";
          }
        } else {
          fuente = "sin-apertura";
        }
      }
      /* lo que se movió desde el corte */
      var e = 0, s = 0, tr = 0, nMov = 0;
      Object.keys(mvMes[cu] || {}).forEach(function (m) {
        if (m < corteM || m > mesTopeL) return;
        var o = mvMes[cu][m]; e += o.e; s += o.s; tr += o.tr; nMov += o.n;
      });
      /* y lo que se movió en el mes cerrado, que queda DENTRO del cierre */
      var mesCerrado = String(anioCaja) + "-" + (cierreN < 10 ? "0" : "") + cierreN;
      var oc = (mvMes[cu] || {})[mesCerrado] || {e: 0, s: 0, tr: 0, n: 0};
      var hoy = (cierre || 0) + tr + e - s;
      var ccu = CCm[cu];
      if (ccu) {
        var mTope = ccu.orden[ccu.orden.length - 1];
        var mCierre = corteN - 1;
        var fCierre = ccu.porMes[mCierre];
        cierre = ccu.ap === null || ccu.ap === undefined ? null
               : (mCierre >= 1 && fCierre ? fCierre.ax : ccu.ap);
        fuente = cierre === null ? "sin-apertura" : "axion-inicial";
        e = 0; s = 0; tr = 0; nMov = 0; nota = "";
        ccu.orden.forEach(function (n) {
          if (n < corteN) return;
          var f = ccu.porMes[n]; e += f.v; tr += f.tr; s += f.s; nMov += f.n;
          if (f.dup) nota = "cargado dos veces: " + soles(f.dup) + " · Administración";
        });
        var fc = ccu.porMes[cierreN];
        oc = fc ? {e: fc.v, s: fc.s, tr: fc.tr, n: fc.n} : {e: 0, s: 0, tr: 0, n: 0};
        hoy = ccu.porMes[mTope].ax;
        if (cu === "SIN BANCO") nota = "movimientos sin banco asignado · Administración";
      }
      var pz = cu.split(" - ");
      saldos.push({cu: cu, banco: pz[0] || cu, cuenta: pz.slice(1).join(" - ") || "—",
                   cierre: cierre, fuente: fuente, nota: nota,
                   dentro: oc, tr: tr, e: e, s: s, nMov: nMov, saldo: hoy,
                   bhoy: CCb.hasOwnProperty(cu) ? CCb[cu] : undefined,
                   bhoyF: CCbF[cu],
                   axb: CCax.hasOwnProperty(cu) ? CCax[cu] : undefined});
      totSaldo += hoy; totCierre += (cierre || 0);
      if (cierre === null) cmacSin++;
    });
    saldos.sort(function (a, b) { return b.saldo - a.saldo; });

    var brechas = [];
    Object.keys(extVal).forEach(function (cu) {
      if (!entraBanco(cu) || !self._entraRSCuenta(cu)) return;
      var extC = extVal[cu][corteM];
      if (extC === undefined) return;
      var prev = "";
      Object.keys(apInt[cu] || {}).concat(Object.keys(extVal[cu] || {})).forEach(function (m) {
        if (m < corteM && m > prev) prev = m; });
      if (!prev) return;
      var est = (extVal[cu] || {})[prev] !== undefined ? extVal[cu][prev] : apInt[cu][prev];
      Object.keys(mvMes[cu] || {}).forEach(function (m) {
        if (m < prev || m >= corteM) return;
        var o = mvMes[cu][m]; est += o.tr + o.e - o.s;
      });
      var br = extC - est;
      if (Math.abs(br) < 0.01) return;
      brechas.push({cu: cu, cuenta: nomCorto(cu), fuente: extFue[cu][corteM],
                    desde: prev, hasta: corteM, est: est, contadora: extC, br: br});
    });
    if (Object.keys(CCm).length) {
      brechas = [];
      Object.keys(CCm).forEach(function (cu) {
        if (!entraBanco(cu) || !self._entraRSCuenta(cu)) return;
        var f = CCm[cu].porMes[cierreN];
        if (!f || f.bco === undefined || Math.abs(f.bco - f.ax) < 0.01) return;
        brechas.push({cu: cu, cuenta: nomCorto(cu), fuente: "banco", desde: "", hasta: corteM,
                      est: f.ax, contadora: f.bco, br: f.bco - f.ax});
      });
    }
    brechas.sort(function (a, b) { return Math.abs(b.br) - Math.abs(a.br); });
    var brechaMag = brechas.reduce(function (a, x) { return a + Math.abs(x.br); }, 0);
    var historico = Object.keys(EXA).sort().map(function (f) {
      var cs = (EXA[f] || {}).cuentas || {};
      var tot = 0, nn = 0;
      Object.keys(cs).forEach(function (cu) { tot += cs[cu]; nn++; });
      return {fecha: f, cuentas: nn, total: tot};
    }).filter(function (x) { return x.cuentas > 0; });

    var P2 = D.proyeccion || {};

    var h = '<div class="d-lienzo">';

    /* Las observaciones abiertas del dinero, que publica el motor. */
    var nObs = ((D || {}).observaciones || []).length;

    h += '<div class="d-kpis">';
    if (saldos.length) {
      h += '<div class="d-carta d-kpi-saldo d-abrible abrible" data-abre="d-saldo" ' +
        'aria-expanded="false" tabindex="0" role="button">' +
        '<div class="d-cab"><span class="d-chip">◈</span>' +
        '<span class="d-preg">¿Cuánto dinero tengo?</span></div>' +
        '<div class="d-cifra">' + solesM(totSaldo) + '</div>' +
        '<div class="d-exacta">' + soles(totSaldo) + ' · ' + ent(saldos.length) +
        ' cuentas · al ' + esc(fechaTope) + '</div>' +
        '<div class="d-pie"><span class="d-tag">' +
        (function () {
          var fb = ((D.control_cuentas || {}).banco_al_dia || {}).fecha || "";
          return 'según AXION' + (fb ? ' · banco al ' + Number(fb.slice(8, 10)) + ' de ' +
            String(MESLY[Number(fb.slice(5, 7))] || "").toLowerCase() : '');
        })() +
        '</span>' +
        (nObs && puedeVer("observaciones")
          ? '<a class="d-tag mal" href="#observaciones" data-hoja="observaciones" ' +
            'onclick="event.stopPropagation();event.preventDefault();irAHoja(&quot;observaciones&quot;)">' + ent(nObs) +

      if (prefijo && String(r[0] || "").indexOf(prefijo) !== 0) return;
      if (r[7] !== "gasto") return;
      if (!entraBanco(nombres[r[6]])) return;
      if (!self._entraRSCuenta(nombres[r[6]])) return;
      var nom = String(nombres[r[6]] || "(sin cuenta)");
      acu[nom] = (acu[nom] || 0) + (r[4] || 0);
    });
    return Object.keys(acu).map(function (k) {
      return [k, "—", acu[k]];
    }).sort(function (a, b) { return b[2] - a[2]; });
  },

  _ingresos: function (pref) {
    var self = this;
    var Fb0 = this._Fb0 || {}, noms0 = this._noms0 || [], obras0 = Fb0.obra || [];
    var rx = /se\s+(deposit[oó]|retir[oó])|retiro\s+de|traspaso/i;
    var filas = [], n = 0, monto = 0;
    (Fb0.f || []).forEach(function (r) {
      if (pref && String(r[0] || "").indexOf(pref) !== 0) return;
      if (r[7] !== "venta" && r[7] !== "presupuesto") return;
      if (r[7] === "presupuesto" &&
          String(r[3] || "").trim().toUpperCase().indexOf("SALDO") === 0) return;
      var cu = noms0[r[6]];
      if (!entraBanco(cu)) return;
      if (!self._entraRSCuenta(cu)) return;
      if (OBRA) {
        var ob = (r[5] !== null && r[5] !== undefined) ? obras0[r[5]] : "";
        if (ob !== OBRA) return;
      }
      var tr = rx.test(String(r[3] || ""));
      if (tr) { n++; monto += r[4] || 0; }
      filas.push({f: String(r[0]), que: r[3] ? String(r[3]).slice(0, 46) : "No existe",
                  banco: cu ? String(cu) : "", monto: r[4] || 0, tr: tr});
    });
    filas.sort(function (a, b) { return b.monto - a.monto; });
    return {top: filas.slice(0, 5), n: n, monto: monto};
  },

  _traspasos: function (D, prefijo) {
    var self = this;
    var F = ((D.libro || {}).filas) || {};
    var nombres = F.cuenta || [], n = 0, monto = 0;
    var rx = /se\s+(deposit[oó]|retir[oó])|retiro\s+de|traspaso/i;
    (F.f || []).forEach(function (r) {
      if (prefijo && String(r[0] || "").indexOf(prefijo) !== 0) return;
      if (r[7] !== "gasto") return;
      if (!entraBanco(nombres[r[6]])) return;
      if (!self._entraRSCuenta(nombres[r[6]])) return;
      if (!rx.test(String(r[3] || ""))) return;
      n++; monto += r[4] || 0;
    });
    return {n: n, monto: monto};
  },

  _tablaCorte: function (filas, cuentas, tr) {
    var NE = "No existe";
    cuentas = cuentas || [];
    var t = '<div class="envoltura-tabla"><table class="datos"><thead><tr>' +
      '<th>Corte</th><th>Detalle</th><th class="num">Monto</th></tr></thead><tbody>';
    (filas || []).forEach(function (r) {
      t += '<tr><td class="obra">' + esc(r[0]) + '</td><td>' + r[1] + '</td>' +
        '<td class="num">' + soles(r[2]) + '</td></tr>';
    });
    cuentas.forEach(function (r) {
      t += '<tr><td class="obra">Gasto por cuenta</td><td>' + esc(r[0]) +
        (r[1] && r[1] !== "—" ? ' · ' + esc(r[1]) : '') + '</td>' +
        '<td class="num">' + soles(r[2]) + '</td></tr>';
    });
    if (cuentas.length) {
      var tot = cuentas.reduce(function (a, r) { return a + r[2]; }, 0);
      t += '<tr class="total"><td class="obra">TOTAL · gasto por cuenta</td><td></td>' +
        '<td class="num">' + soles(tot) + '</td></tr>';
      if (tr && tr.n) {
        t += '<tr><td class="obra">De eso, traspasos entre cuentas</td><td>' +
          ent(tr.n) + (tr.n === 1 ? ' movimiento' : ' movimientos') +
          ' · «Se depositó» o «Se retiró» en el concepto</td>' +
          '<td class="num">' + soles(tr.monto) + '</td></tr>' +
          '<tr class="total"><td class="obra">Gasto sin traspasos</td><td></td>' +
          '<td class="num">' + soles(tot - tr.monto) + '</td></tr>';
      }
    }
    if (!(filas || []).length && !cuentas.length) {
      t += '<tr><td class="obra">' + NE + '</td><td>' + NE + '</td>' +
        '<td class="num">' + NE + '</td></tr>';
    }
    return t + '</tbody></table></div>';
  },

  conectar: function () {
    var self = this;
    var detN = document.getElementById("det-d-neta");
    if (detN) {
      detN.addEventListener("click", function (e) {
        var b = e.target.closest ? e.target.closest(".pill-vn") : null;
        if (!b) return;
        e.stopPropagation();
        var v = b.getAttribute("data-vn");
        if (v === (self._vNeta || "neto")) return;
        self._vNeta = v;
        var tarjeta = document.querySelector('[data-abre="d-neta"]');
        if (!tarjeta || typeof alternar !== "function") return;
        var y = window.scrollY || document.documentElement.scrollTop || 0;
        alternar(tarjeta, "d-neta"); alternar(tarjeta, "d-neta");
        window.scrollTo(0, y);
      });
    }
    var pills = document.getElementById("pills-caja");
    if (!pills) return;
    pills.addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest(".pill-vc") : null;
      if (!b) return;
      var v = b.getAttribute("data-vc");
      if (v === self._vCaja) return;
      self._vCaja = v;
      [].forEach.call(pills.querySelectorAll(".pill-vc"), function (x) {
        x.classList.toggle("activa", x.getAttribute("data-vc") === v);
      });
      var caja = document.getElementById("graf-caja");
      if (!caja) return;
      caja.innerHTML = self._grafCaja();
      conectarAbribles(caja);
    });
  }
};
</script>
