<script>
window.HOJA = {
  id: "comercial",
  nombre: "Comercial",
  pregunta: "¿De dónde salen las ventas y quién las trae?",
  fuentes: ["AXION", "KOMMO"],

  filtros: ["asesor", "tipo"],

  pintar: function (M, D) {
    var A = this.asesores(M);
    var H = "";
    H += this.sol(M, D, A);
    H += avisoAlcance(
      "el contratado, el ticket y la tabla de asesores, que salen de las ventas de AXION",
      "el embudo del CRM, el origen declarado de la venta y la inversión de Marketing",
      "nada de Kommo —embudo, tiempos de atención, responsables y campañas—, porque el " +
      "responsable del CRM es otro padrón que el asesor de AXION: de los 12 responsables de " +
      "Kommo solo 7 escriben su nombre igual, y filtrar por parecido dejaría a los otros en " +
      "cero sin avisar. Tampoco el origen declarado ni la inversión de Marketing, que el " +
      "motor calcula sobre el total y no vendedor por vendedor");
    H += this.tablaAsesores(M, D, A);
    H += this.producto(M, D);
    H += this.origen(M, D);
    H += this.resumenCRM(M, D);
    return H;
  },

  asesores: function (M, todosLosVendedores) {
    var E = M.estructura || {};
    var m = {}, ventas = 0, monto = 0;
    (E.modalidad || []).forEach(function (mo) {
      (mo.detalle || []).forEach(function (r) {
        if (!entraObra(String(r.obra || ""))) return;
        var a = String(r.asesor === null || r.asesor === undefined ? "" : r.asesor).trim();
        if (!a || a.toLowerCase() === "nan") a = "(sin asesor)";
        if (!todosLosVendedores && !entraAsesor(a)) return;
        if (!m[a]) m[a] = {asesor: a, n: 0, monto: 0, cobrado: 0, sinCred: 0,
                          obras: {}, filas: []};
        var q = m[a], p = Number(r.precio) || 0;
        q.n++; q.monto += p; q.obras[String(r.obra || "—")] = 1;
        q.cobrado += Number(r.entro) || 0;
        if (r.sin_credito) q.sinCred++;
        q.filas.push({fecha: r.fecha, obra: r.obra, unidad: r.unidad, cliente: r.cliente,
                      modalidad: mo.modalidad, banco: r.banco, precio: p,
                      entro: Number(r.entro) || 0, sinCred: !!r.sin_credito,
                      compartido: !!r.credito_compartido,
                      nCred: Number(r.creditos) || 0});
        ventas++; monto += p;
      });
    });
    var lista = Object.keys(m).map(function (k) { return m[k]; })
      .sort(function (a, b) { return b.monto - a.monto || b.n - a.n; });
    return {lista: lista, ventas: ventas, monto: monto};
  },

  sol: function (M, D, A) {
    var kVend = drillDe(M, ["Vendido", "Vendido en el mes"]);
    var top = A.lista[0];
    var hist = this.asesores(D.meses.hist || D.meses["None"], true);
    var ticket = A.ventas ? A.monto / A.ventas : null;
    var todo = ASESOR ? this.asesores(M, true) : A;

    return '<div class="sol">' +
      '<span class="overline">Lo que firmó Comercial en el período · AXION</span>' +
      '<div class="sol-tres">' +
        solCifra("firmado", "Contratado", A.ventas ? soles(A.monto) : null,
          ent(A.ventas) + (A.ventas === 1 ? " venta" : " ventas") +
          ' con estado «Vendido» · ticket promedio <b>' + soles(ticket) + '</b>' +
          ' — contratado ÷ ventas, el mismo universo en los dos lados de la división', kVend) +
        solCifra("", "Asesores que firmaron", A.lista.length ? ent(A.lista.length) : null,
          (ASESOR ? 'con el vendedor elegido. De los ' : 'de los ') +
          ent(hist.lista.length) + ' que firmaron alguna venta en todos los años. ' +
          'Se cuentan los que aparecen firmando, no los dados de alta en AXION', null) +
        (ASESOR
          ? solCifra("", "Cuánto de lo firmado es suyo",
              top ? pct(todo.monto ? 100 * top.monto / todo.monto : null) : null,
              top ? '<b>' + esc(top.asesor) + '</b> · ' + top.n + ' de las ' + ent(todo.ventas) +
                    ' ventas del período · el período completo firmó <b>' + soles(todo.monto) +
                    '</b>, y este vendedor <b>' + soles(top.monto) + '</b>'
                  : 'ninguna venta con estado «Vendido» en este corte', null)
          : solCifra("", "El que más firmó", top ? soles(top.monto) : null,
              top ? '<b>' + esc(top.asesor) + '</b> · ' + top.n + ' de ' + A.ventas +
                    ' ventas · ' + pct(A.monto ? 100 * top.monto / A.monto : null) +
                    ' del contratado del período'
                  : 'ninguna venta con estado «Vendido» en este corte', null)) +
      '</div>' +
      '<div class="detalle" id="det-firmado"></div></div>';
  },

  tablaAsesores: function (M, D, A) {
    if (!A.lista.length)
      return cabSeccion("Los vendedores, de mayor a menor", "", "asesores") +
        '<div class="tarjeta"><p>Ninguna venta con estado «Vendido» en el período y el alcance ' +
        'elegidos. No es un cero de ventas del negocio: es un cero de este corte.</p></div></section>';

    var max = A.lista[0].monto || 1;
    var vis = porEtiqueta(D.areas.Comercial || [])["Visitas hechas"];

    var h = cabSeccion("Los vendedores, de mayor a menor", "", "asesores");

    h += '<div class="tarjeta" style="padding:var(--e4) var(--e2)">' +
      '<div class="envoltura-tabla"><table class="datos"><thead><tr>' +
      '<th>Asesor</th><th style="width:20%">Reparto del contratado</th>' +
      '<th class="num">Ventas</th><th class="num">Contratado</th>' +
      '<th class="num">Cobrado</th>' +
      '<th class="num">Ticket</th><th class="num">% del contratado</th>' +
      '</tr></thead><tbody>';

    A.lista.forEach(function (a, i) {
      var p = A.monto ? 100 * a.monto / A.monto : 0;
      var ob = Object.keys(a.obras).sort();
      var sub = ob.length + (ob.length === 1 ? " proyecto · " : " proyectos · ") +
        ob.slice(0, 3).join(" · ") + (ob.length > 3 ? " y " + (ob.length - 3) + " más" : "");
      h += '<tr class="fila-obra abrible" data-abre="asesor-' + i + '" ' +
        'data-asesor="' + esc(a.asesor) + '" aria-expanded="false" tabindex="0" role="button">' +
        '<td class="obra"><span class="ob-nom">' + esc(a.asesor) + '</span>' +
          '<span class="ob-sub">' + esc(sub) + '</span></td>' +
        '<td><span class="riel-obra" style="width:' + Math.max(3, 100 * a.monto / max) + '%">' +
          '<span class="lleno" style="width:100%"></span></span></td>' +
        '<td class="num">' + ent(a.n) + '</td>' +
        '<td class="num">' + soles(a.monto) + '</td>' +
        '<td class="num"' +
          (a.sinCred
            ? ' title="No es el total: ' + a.sinCred + ' de sus ' + a.n +
              ' ventas no tienen crédito cargado en AXION, y sin crédito no hay' +
              ' dónde leer los pagos"' : '') + '>' + soles(a.cobrado) +
          (a.sinCred ? ' <span class="marca-area">no es el total</span>' : '') + '</td>' +
        '<td class="num">' + soles(a.n ? a.monto / a.n : null) + '</td>' +
        '<td class="num"><b class="pct-obra">' + pct(p) + '</b></td></tr>';
    });

    if (A.lista.length > 1) {
      h += '<tr class="total"><td class="obra"><span class="ob-nom">TOTAL</span>' +
        '<span class="ob-sub">suma de las ' + ent(A.ventas) + ' ventas del período</span></td>' +
        '<td><span class="riel-obra" style="width:100%"><span class="lleno" style="width:100%"></span></span></td>' +
        '<td class="num">' + ent(A.ventas) + '</td><td class="num">' + soles(A.monto) + '</td>' +
        '<td class="num">' + soles(A.ventas ? A.monto / A.ventas : null) + '</td>' +
        '<td class="num"><b class="pct-obra">' + pct(A.monto ? 100 : null) + '</b></td></tr>';
    }
    h += '</tbody></table></div>';

    if (vis && vis.valor !== null && vis.valor !== undefined)
      h += '<p class="mas" style="padding:0 var(--e2)"><b>Visitas declaradas: ' + ent(vis.valor) +
        '</b> — ' + fraseP(vis.formula) + ' Va acá abajo y no entre las cifras de arriba porque ' +
        '<b>no sigue al filtro de período ni al de proyecto</b>.</p>';

    h += '</div>' +
      A.lista.map(function (a, i) { return '<div class="detalle" id="det-asesor-' + i + '"></div>'; }).join("") +
      '</section>';
    return h;
  },

  producto: function (M, D) {
    var E = M.estructura || {};
    var TIPOS = ["LOTE", "DPTO", "COCHERA", "OFICINA", "CASA", "TIENDA"];
    var m = {}, total = 0;
    (E.modalidad || []).forEach(function (mo) {
      (mo.detalle || []).forEach(function (r) {
        if (!entraObra(String(r.obra || ""))) return;
        var a = String(r.asesor === null || r.asesor === undefined ? "" : r.asesor).trim();
        if (!entraAsesor(a || "(sin asesor)")) return;
        var u = String(r.unidad || "").toUpperCase().trim(), tipo = "Otro";
        for (var k = 0; k < TIPOS.length; k++)
          if (u.indexOf(TIPOS[k]) === 0) { tipo = TIPOS[k]; break; }
        if (!m[tipo]) m[tipo] = {tipo: tipo, n: 0, monto: 0, filas: []};
        var q = m[tipo], precio = Number(r.precio) || 0;
        q.n++; q.monto += precio; total += precio;
        q.filas.push({fecha: r.fecha, obra: r.obra, unidad: r.unidad,
                      cliente: r.cliente, asesor: a || "(sin asesor)", precio: precio});
      });
    });
    var L = Object.keys(m).map(function (k) { return m[k]; })
      .sort(function (a, b) { return b.monto - a.monto; });
    if (!L.length) return "";
    this._tipos = L;
    var nV = 0; L.forEach(function (x) { nV += x.n; });
    var maxM = L[0].monto || 1;

    var lider = L[0];
    var porN = L.slice().sort(function (a, b) { return b.n - a.n; })[0];
    /* Para que la tarjeta del volumen sepa que fila suya abrir. */
    this._iVol = L.indexOf(porN);

    h += '</tr></thead><tbody>';
    filas.forEach(function (r) {
      h += '<tr><td>' + esc(r.fecha) + '</td><td class="obra">' + esc(r.obra) + '</td>';
      for (var k4 = 0; k4 < nMedio; k4++)
        h += '<td>' + esc((r.d || [])[k4] || "") + '</td>';
      h += '<td class="num">' + soles(r.monto) + '</td></tr>';
    });
    return h + '</tbody></table></div>';
  },

  fichaAsesor: function (nombre) {
    var M = D.meses[P] || D.meses["None"];
    var A = this.asesores(M);
    var q = null;
    A.lista.forEach(function (x) { if (x.asesor === nombre) q = x; });
    if (!q) return '<button class="cerrar">Cerrar</button>' +
      '<p>Ese asesor no tiene ventas con el filtro puesto.</p>';

    var filas = q.filas.slice().sort(function (a, b) {
      return String(b.fecha).localeCompare(String(a.fecha));
    });
    var h = '<button class="cerrar">Cerrar</button><h3>' + esc(q.asesor) + ' · ' +
      ent(q.n) + (q.n === 1 ? ' venta' : ' ventas') + ' del período</h3>' +
      '<div class="regla">Una fila por venta con estado «Vendido» en el período elegido. ' +
      'Separaciones y devoluciones no son venta y no están acá. La columna es el <b>contratado</b>, ' +
      'no lo cobrado: lo cobrado se sigue en Cobranza.</div>' +
      '<div class="resumen-det"><span>' + ent(q.n) + ' de ' + ent(A.ventas) +
      ' ventas del período</span>' +
      '<span class="suma">Contratado · <b>' + soles(q.monto) + '</b></span>' +
      '<span>Ticket · ' + soles(q.n ? q.monto / q.n : null) + '</span>' +
      '<span>' + pct(A.monto ? 100 * q.monto / A.monto : null) + ' del contratado del período</span>' +
      '</div><div class="envoltura-tabla"><table class="datos"><thead><tr>' +
      '<th>Fecha</th><th>Proyecto</th><th>Unidad</th><th>Tipo</th><th>Cliente</th>' +
      '<th>Modalidad</th><th>Banco</th><th class="num">Contratado</th>' +
      '<th class="num">Entró</th>' +
      '</tr></thead><tbody>';
    filas.forEach(function (r) {
      h += '<tr><td>' + esc(r.fecha) + '</td><td class="obra">' + esc(r.obra) + '</td>' +
        '<td>' + esc(r.unidad) + '</td>' +
        '<td>' + esc(tipoUnidad(r.unidad)) + '</td>' +
        '<td>' + esc(r.cliente) + '</td>' +
        '<td>' + esc(r.modalidad) + '</td><td>' + esc(r.banco || "—") + '</td>' +
        '<td class="num">' + soles(r.precio) + '</td>' +
        '<td class="num"' +
          (r.sinCred
            ? ' title="Su venta no tiene crédito cargado en AXION: sin crédito no hay dónde leer los pagos"'
            : (r.compartido || r.nCred > 1
               ? ' title="Comparte crédito con otra venta: lo cobrado del grupo se muestra en una sola de las filas, no repartido"'
               : '')) + '>' +
          (r.sinCred
            ? nota("sin crédito",
                "Esta venta <b>no tiene crédito cargado en AXION</b>, y los pagos " +
                "viven dentro del crédito: sin él no hay de dónde leer cuánto entró. " +
                "<b>No significa que el cliente no haya pagado</b> — significa que el " +
                "tablero no lo puede ver.<span class=\"quien\">Falta cargarlo · Comercial</span>")
            : soles(r.entro) +
              ((r.compartido || r.nCred > 1)
                ? ' ' + nota("compartido",
                    "Esta venta y otra del mismo cliente <b>comparten un solo crédito</b>: " +
                    "en AXION la unidad del crédito está escrita como una sola cadena " +
                    "—por ejemplo <b>«COCHERA 3 + DPTO 801»</b>— mientras las ventas van " +
                    "por separado. Los pagos están en ese crédito único, así que el " +
                    "tablero <b>no puede repartirlos</b> entre las dos: pone el total en " +
                    "una fila y la otra queda en S/ 0.00. " +
                    "<b>Sumadas están bien; leídas por separado, no.</b>" +
                    "<span class=\"quien\">Un crédito por unidad · Comercial</span>")
                : '')) +
        '</td></tr>';
    });
    return h + '</tbody></table></div>';
  },

  conectar: function (M, D) {
    var A = this.asesores(M);
    if (A.lista.length > 1 && A.monto)
      sello("1 de " + A.lista.length + " asesores concentra " +
            pct(100 * A.lista[0].monto / A.monto) + " del contratado", "asesores");
    else sello("");
    var self = this, caja = document.getElementById("costos-caja");
    if (caja) caja.addEventListener("change", function (e) {
      if (!e.target.classList.contains("cac-cat")) return;
      self._catCAC[e.target.getAttribute("data-cat")] = e.target.checked;
      caja.innerHTML = self._costosCaja(M, D);
      conectarAbribles(caja);
    });
  }
};

function nota(marca, texto) {
  return '<span class="nota"><button type="button" aria-label="Qué significa ' +
    esc(marca) + '">' + esc(marca) + '</button>' +
    '<span class="globo" role="note">' + texto + '</span></span>';
}

function tipoUnidad(nombre) {
  var t = String(nombre || "").toUpperCase();
  if (t.indexOf("DPTO") >= 0 || t.indexOf("DEPART") >= 0) return "Departamento";
  if (t.indexOf("CASA") >= 0) return "Casa";
  if (t.indexOf("LOTE") >= 0) return "Lote";
  if (t.indexOf("COCHERA") >= 0) return "Cochera";
  if (t.indexOf("OFICINA") >= 0) return "Oficina";
  if (t.indexOf("TERRENO") >= 0) return "Terreno";
  return t ? "Otro" : "—";
}


function solCifra(id, k, vTexto, nHtml, clave) {
  var abre = clave ? ' class="abrible" data-abre="' + id + '" data-drill="' + esc(clave) +
    '" aria-expanded="false" tabindex="0" role="button"' : '';
  return '<div' + abre + '><span class="k">' + esc(k) + '</span>' +
    '<div class="v"' + (vTexto === null || vTexto === undefined ? ' style="color:var(--gris-300)"' : '') +
    '>' + (vTexto === null || vTexto === undefined ? "—" : vTexto) + '</div>' +
    '<div class="n">' + nHtml + '</div>' +
    (clave ? '<div class="abrir abrir-osc"><span>Ver las filas que la componen</span>' +
             '<span class="flecha">▸</span></div>' : '') + '</div>';
}

function paso(rot, n, base, nota, id, rotulo) {
  if (n === null || n === undefined)
    return tarjetaSimple(rot, null, nota, {crudo: true, html: '<div class="cifra-g raya">—</div>'});
  var p = base ? 100 * n / base : 0;
  var cuerpo = '<span class="riel"><span style="width:' +
      Math.max(n > 0 ? 1.5 : 0, Math.min(100, p)) + '%"></span></span>' + nota;
  var opc = {crudo: true,
     html: '<div class="cifra-g">' + ent(n) + '</div>' +
           '<div class="exacta">' + pct(p) + ' de los ' + ent(base) + ' leads del período</div>'};
  return id ? tarjetaAbrible(id, rot, null, cuerpo, rotulo, null, opc)
            : tarjetaSimple(rot, null, cuerpo, opc);
}

function hrs(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  if (n < 1) return Math.round(n * 60) + " min";
  return Number(n).toFixed(1) + " h";
}

function fraseP(s) {
  var f = frase(s);
  return f && !/[.!?…:;»]\s*$/.test(f.replace(/<\/?b>/g, "")) ? f + "." : f;
}
function frase(s) {
  var t = String(s === null || s === undefined ? "" : s).trim();
  var ab = (t.match(/\(/g) || []).length, ce = (t.match(/\)/g) || []).length;
  if (ab > ce) t = t.slice(0, t.lastIndexOf("(")).replace(/[\s,;:·-]+$/, "") + "…";
  return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*\*/g, "");
}

function ventana(formula) {
  if (!formula) return null;
  var MES = {enero: 1, febrero: 2, marzo: 3, abril: 4, mayo: 5, junio: 6, julio: 7,
             agosto: 8, septiembre: 9, setiembre: 9, octubre: 10, noviembre: 11, diciembre: 12};
  var m = /de ([a-záéíóúñ]+) a ([a-záéíóúñ]+)/i.exec(String(formula));
  if (!m) return null;
  var a = MES[m[1].toLowerCase()], b = MES[m[2].toLowerCase()];
  if (!a || !b || b < a) return null;
  var y = /de (\d{4})/.exec(String(formula));
  return {a: a, b: b, na: m[1], nb: m[2], anio: y ? y[1] : ""};
}
