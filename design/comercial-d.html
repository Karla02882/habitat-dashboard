<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comercial · Habitat Control</title>
<link rel="stylesheet" href="cockpit.css?v=1786485196">
</head>
<body>
<div class="envoltorio">
  <header class="cabecera"><div class="cabecera-fila">
    <span class="hoja-nombre" id="hoja-nombre"></span>
    <span class="cabecera-der" id="cab-der"></span></div></header>
  <nav class="nav" id="nav"></nav>
  <div class="subnav" id="subnav"></div>
  <div class="filtros-zona"><div class="filtros">
    <div class="filtro"><label for="f-periodo">Período</label><select id="f-periodo"></select></div>
    <div class="filtro" id="caja-rs"><label for="f-rs">Razón social</label><select id="f-rs"></select></div>
    <div class="filtro" id="caja-obra"><label for="f-obra">Proyecto</label><select id="f-obra"></select></div>
    <button class="btn-act" id="btn-act">Actualizar ahora</button>
  </div></div>
  <div class="fuentes" id="fuentes"></div>
  <div id="cargando">leyendo <code>tablero_datos.json</code>…</div>
  <div id="hoja" hidden></div>
</div>

<script>
window.HOJA = {
  id: "comercial-d",
  nombre: "Ventas",
  pregunta: "¿Cómo va la venta?",
  fuentes: ["AXION", "KOMMO"],

  ventanas: {
    "v-crm": "el CRM sigue al período, pero no a razón social ni proyecto: " +
      "sus proyectos no cruzan con AXION",
    "v-cobrar": "la cartera es una foto de hoy: no sigue al período"
  },

  pintar: function (M, D) {
    var EF = (M.estructura || {});
    var det = [];
    (EF.modalidad || []).forEach(function (mo) {
      (mo.detalle || []).forEach(function (r) {
        det.push({obra: String(r.obra || "—"), unidad: String(r.unidad || "—"),
          precio: r.precio || 0, entro: r.entro || 0, falta: r.falta || 0,
          entroDe: String(r.entro_de || ""), entroAx: r.entro_axion || 0,
          fecha: String(r.fecha || ""),
          asesor: String(r.asesor || "—"), modo: String(mo.modalidad || "—")});
      });
    });
    var vivas = det.filter(function (v) { return entraObra(v.obra); });
    var firmado = 0;
    vivas.forEach(function (v) { firmado += v.precio; });
    var ticket = vivas.length ? firmado / vivas.length : 0;
    var ingresoAx = 0;
    vivas.forEach(function (v) { ingresoAx += v.entroAx || 0; });

    var AV = D.avance || {};
    var libresU = 0, libresS = 0, bloqU = 0, obrasAv = [];
    Object.keys(AV).forEach(function (ob) {
      if (!entraObra(ob)) return;
      var a = AV[ob];
      var lu = (a.u_libre !== undefined && a.u_libre !== null)
        ? a.u_libre : ((a.u_tot || 0) - (a.u_vend || 0));
      var ls = (a.libre_precio !== undefined && a.libre_precio !== null)
        ? a.libre_precio : ((a.total || 0) - (a.vendido || 0));
      var bq = (a.u_bloq || 0) + (a.u_sep || 0);
      libresU += lu; libresS += ls; bloqU += bq;
      obrasAv.push({obra: ob, libres: lu, libresS: ls, bloq: bq,
        vendidas: a.u_vend || 0, pct: a.pct || 0});
    });

    /* ritmo por proyecto: ventas del año en curso ÷ meses transcurridos */
    var anioHoy = Number(((D.flujo || {}).anio) || 0);
    var anioSel = 0;
    det.forEach(function (v) {
      var a = parseInt(String(v.fecha).slice(0, 4), 10) || 0;
      if (a > anioSel) anioSel = a;
    });
    if (!anioSel) anioSel = anioHoy;
    var MA = (D.meses || {})[anioSel === anioHoy ? "None" : String(anioSel)] || {};
    var detA = [];
    (((MA.estructura || {}).modalidad) || []).forEach(function (mo) {
      (mo.detalle || []).forEach(function (r) {
        detA.push({obra: String(r.obra || "—"), unidad: String(r.unidad || "—"),
          precio: r.precio || 0, entro: r.entro || 0, falta: r.falta || 0,
          entroDe: String(r.entro_de || ""), entroAx: r.entro_axion || 0,
          fecha: String(r.fecha || ""),
          asesor: String(r.asesor || "—"), modo: String(mo.modalidad || "—")});
      });
    });
    if (!detA.length) detA = det;
    var mesesTrans = 0;
    ((D.flujo || {}).meses || []).forEach(function (m) {
      if (m.pasado || m.en_curso) mesesTrans++;
    });
    var ventasAnio = {};
    detA.forEach(function (v) {
      if (v.fecha.indexOf(String(anioSel)) !== 0) return;
      ventasAnio[v.obra] = (ventasAnio[v.obra] || 0) + 1;
    });
    obrasAv.forEach(function (o) {
      var va = ventasAnio[o.obra] || 0;
      o.ventasAnio = va;
      o.meses = (va > 0 && mesesTrans > 0 && o.libres > 0)
        ? o.libres / (va / mesesTrans) : null;
    });
    obrasAv.sort(function (a, b) {
      var am = a.meses === null ? (a.libres > 0 ? 9e9 : -1) : a.meses;
      var bm = b.meses === null ? (b.libres > 0 ? 9e9 : -1) : b.meses;
      return bm - am;
    });

    var vend = {};
    vivas.forEach(function (v) {
      var o = vend[v.asesor] = vend[v.asesor] || {n: 0, s: 0};
      o.n++; o.s += v.precio;
    });
    var vendL = Object.keys(vend).map(function (k) {
      return [k, vend[k].n, vend[k].s]; });
    vendL.sort(function (a, b) { return b[2] - a[2]; });

    var tipoDe = function (u) {
      u = String(u || "").toUpperCase();
      if (u.indexOf("DPTO") === 0) return "Departamentos";
      if (u.indexOf("LOTE") === 0) return "Lotes";
      if (u.indexOf("CASA") === 0) return "Casas";
      if (u.indexOf("COCHERA") === 0) return "Cocheras";
      if (u.indexOf("OFICINA") === 0) return "Oficinas";
      return "Otros";
    };
    var tipos = {};
    vivas.forEach(function (v) {
      var t = tipoDe(v.unidad);
      var o = tipos[t] = tipos[t] || {n: 0, s: 0};
      o.n++; o.s += v.precio;
    });
    var tiposL = Object.keys(tipos).map(function (k) {
      return [k, tipos[k].n, tipos[k].s]; })
      .sort(function (a, b) { return b[1] - a[1]; });
    var topTipo = tiposL.length ? tiposL[0] : null;

    var crm = (M.crm && M.crm.disponible) ? M.crm : null;
    var leads = 0, vendidosCrm = null, sinGestion = null;
    if (crm) {
      (crm.etapas || []).forEach(function (e) {
        leads += e.leads || 0;
        var v = String(e.valor || "").toUpperCase();
        if (v === "VENDIDO") vendidosCrm = e.leads || 0;
        if (v.indexOf("SIN GESTI") === 0 || v === "LEADS DE ENTRADA")
          sinGestion = (sinGestion || 0) + (e.leads || 0);
      });
    }

    var h = '<div class="d-lienzo">';

    var EMB = (crm && crm.embudo && crm.embudo.hay) ? crm.embudo : null;
    var metasG = D.metas_gerencia || {};
    var ventasAnioTot = 0;
    Object.keys(ventasAnio).forEach(function (ob) {
      if (entraObra(ob)) ventasAnioTot += ventasAnio[ob];
    });
    var mesesStock = (ventasAnioTot > 0 && mesesTrans > 0 && libresU > 0)
      ? libresU / (ventasAnioTot / mesesTrans) : null;
    var topVend = vendL.length ? vendL[0] : null;

    var MES3V = ["", "Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul",
                 "Ago", "Set", "Oct", "Nov", "Dic"];
    var mesTopeV = 0;
    ((D.flujo || {}).meses || []).forEach(function (m) {
      if (m.pasado || m.en_curso) mesTopeV = Math.max(mesTopeV, m.mes); });
    var chispaV = function (serie, sufijo, rot, extra) {
      var ms = Object.keys(serie).map(Number).sort(function (a, b) { return a - b; });
      if (!ms.length) return '';
      var max = 1;
      ms.forEach(function (m) { max = Math.max(max, serie[m] || 0); });
      var t = '<div class="d-chispa" data-eje="Mes"' +
        (extra ? ' data-extra-rot="' + esc(extra.rot) + '" data-extra-fmt="' + esc(extra.fmt || 'n') + '"' : '') +
        ' data-rot="' +
        esc(rot || (sufijo === 'n' ? 'Cantidad' : 'Monto')) + '" data-fmt="' +
        (sufijo === '%' ? 'pct' : (sufijo === 'n' ? 'n' : 'soles')) + '" data-serie="' +
        encodeURIComponent(JSON.stringify(ms.map(function (m) {
          return extra ? [MES3V[m], serie[m] || 0, m === mesTopeV ? 1 : 0, 0, (extra.serie || {})[m] || 0]
                       : [MES3V[m], serie[m] || 0, m === mesTopeV ? 1 : 0, 0];
        }))) + '">';
      ms.forEach(function (m) {
        var v = serie[m] || 0;
        t += '<i class="' + (m === mesTopeV ? 'act' : '') + '" style="height:' +
          Math.max(2, Math.round(30 * v / max)) + 'px" title="' + esc(MES3V[m]) +
          ' ' + (sufijo === '%' ? fmt1(v) + '%' :
                 (sufijo === 'n' ? ent(v) : soles(v))) + '"></i>';
      });
      return t + '</div><div class="d-chispa-pie"><span>' + esc(MES3V[ms[0]]) +
        '</span><span>' + esc(MES3V[ms[ms.length - 1]]) + '</span></div>';
    };
    var ventasMes = {}, montoMes = {};
    detA.forEach(function (v) {
      if (String(v.fecha).indexOf(String(anioSel)) !== 0) return;
      if (!entraObra(v.obra)) return;
      var m = parseInt(String(v.fecha).slice(5, 7), 10);
      ventasMes[m] = (ventasMes[m] || 0) + 1;
      montoMes[m] = (montoMes[m] || 0) + v.precio;
    });
    var vendMes = {};
    if (topVend) {
      detA.forEach(function (v) {
        if (String(v.fecha).indexOf(String(anioSel)) !== 0) return;
        if (!entraObra(v.obra) || v.asesor !== topVend[0]) return;
        var m = parseInt(String(v.fecha).slice(5, 7), 10);
        vendMes[m] = (vendMes[m] || 0) + v.precio;
      });
    }
    var acumAnio = 0, ventasAnio = 0;
    Object.keys(montoMes).forEach(function (m) { acumAnio += montoMes[m]; });
    Object.keys(ventasMes).forEach(function (m) { ventasAnio += ventasMes[m]; });

    var detHist = [];
    ((((D.meses || {}).hist || {}).estructura || {}).modalidad || [])
      .forEach(function (mo) {
        (mo.detalle || []).forEach(function (v) {
          if (entraObra(v.obra)) detHist.push(v); });
      });
    var acumHist = 0, anioSerie = {}, anioMin = null, anioMax = null;
    detHist.forEach(function (v) {
      acumHist += v.precio || 0;
      var a = parseInt(String(v.fecha).slice(0, 4), 10);
      if (!a) return;
      anioSerie[a] = (anioSerie[a] || 0) + (v.precio || 0);
      if (anioMin === null || a < anioMin) anioMin = a;
      if (anioMax === null || a > anioMax) anioMax = a;
    });
    var chispaAnios = function () {
      var as = Object.keys(anioSerie).map(Number).sort(function (a, b) { return a - b; });
      if (!as.length) return '';
      var mx = 1;
      as.forEach(function (a) { mx = Math.max(mx, anioSerie[a]); });
      var s = '<div class="d-chispa" data-eje="Año" data-rot="Firmado" data-fmt="soles" data-serie="' +
        encodeURIComponent(JSON.stringify(as.map(function (a) {
          return [String(a), anioSerie[a], a === anioSel ? 1 : 0, 0];
        }))) + '">';
      as.forEach(function (a) {
        s += '<i class="' + (a === anioSel ? 'act' : '') + '" style="height:' +
          Math.max(2, Math.round(30 * anioSerie[a] / mx)) + 'px" title="' +
          esc(String(a)) + ' ' + soles(anioSerie[a]) + '"></i>';
      });
      return s + '</div><div class="d-chispa-pie"><span>' + esc(String(as[0])) +
        '</span><span>' + esc(String(as[as.length - 1])) + '</span></div>';
    };

    h += '<div class="d-kpis">' +
      (vivas.length
        ? '<div class="d-carta d-abrible abrible" data-abre="v-firmado" aria-expanded="false" tabindex="0" role="button">' +
          '<div class="d-cab"><span class="d-chip">✎</span><span class="d-preg">¿Quién vende?</span></div>' +
          '<div class="d-cifra">' + solesM(firmado) + '</div>' +
          '<div class="d-exacta">' + ent(vivas.length) +
          (vivas.length === 1 ? ' venta firmada · ' : ' ventas firmadas · ') +
          ent(vendL.length) + (vendL.length === 1 ? ' vendedor' : ' vendedores') + '</div>' +
          '<div class="d-exacta">Ingreso real AXION ' + soles(ingresoAx) + '</div>' +
          '<div class="d-pie">' + (topVend
            ? '<span class="d-tag">' + (firmado ? fmt1(topVend[2] / firmado * 100) : '0.0') +
              '%</span>' + esc(topVend[0])
            : 'del período') + '</div>' +
          chispaV(montoMes, '', 'Firmado', {rot: 'Ventas', fmt: 'n', serie: ventasMes}) + '</div>'
        : '<div class="d-carta"><div class="d-cab"><span class="d-chip">✎</span>' +
          '<span class="d-preg">¿Quién vende?</span></div>' +
          '<div class="d-cifra">—</div>' +
          '<div class="d-exacta">sin ventas con estos filtros</div></div>') +
      '<div class="d-carta d-abrible abrible" data-abre="v-unidades" aria-expanded="false" tabindex="0" role="button">' +
        '<div class="d-cab"><span class="d-chip">⌂</span>' +
        '<span class="d-preg">¿Qué se vende?</span></div>' +
        '<div class="d-cifra">' + ent(vivas.length) + '</div>' +
        '<div class="d-exacta">unidades · ticket ' + soles(ticket) + '</div>' +
        '<div class="d-pie">' + (topTipo
          ? '<span class="d-tag">' + esc(topTipo[0]) + '</span>' +
            ent(topTipo[1]) + ' de ' + ent(vivas.length)
          : 'del período') + '</div>' +
        chispaV(ventasMes, 'n', 'Unidades vendidas') + '</div>' +
      '<div class="d-carta d-abrible abrible" data-abre="v-stock" aria-expanded="false" tabindex="0" role="button">' +
        '<div class="d-cab"><span class="d-chip">▦</span><span class="d-preg">¿Cuánto queda por vender?</span></div>' +
        '<div class="d-cifra">' + ent(libresU) + '</div>' +
        '<div class="d-exacta">' + soles(libresS) + ' en stock' +
        (bloqU ? ' · ' + ent(bloqU) + ' bloqueadas aparte' : '') + '</div>' +
        '<div class="d-pie">padrón de unidades</div>' +
        chispaV(ventasMes, 'n', 'Unidades vendidas') + '</div>';
    h += '<div class="d-carta d-abrible abrible" data-abre="v-anio" aria-expanded="false" tabindex="0" role="button">' +
      '<div class="d-cab"><span class="d-chip">∑</span>' +
      '<span class="d-preg">¿Cuánto llevamos firmado?</span></div>' +
      '<div class="d-cifra">' + solesM(acumHist) + '</div>' +
      '<div class="d-exacta">' + soles(acumHist) + ' · ' + ent(detHist.length) +
      (detHist.length === 1 ? ' venta' : ' ventas') + '</div>' +
      '<div class="d-pie"><span class="d-tag">' + solesM(acumAnio) + '</span>' +
      esc(String(anioSel)) + ' · desde ' + esc(String(anioMin || anioSel)) + '</div>' +
      chispaAnios() + '</div>';
    h += '</div>' +
      '<div class="detalle" id="det-v-firmado"></div>' +
      '<div class="detalle" id="det-v-unidades"></div>' +
      '<div class="detalle" id="det-v-stock"></div>' +
      '<div class="detalle" id="det-v-anio"></div>';

    var venc = [];
    try {
      venc = ((D.areas_filas || {}).Cobranza || []).filter(function (x) {
        return x.nombre === "Vencido"; })[0].filas || [];
    } catch (e) { venc = []; }
    var comp = (D.vencimientos || {}).composicion || {};
    var vDentro = venc.filter(function (r) {
      return !r.fuera && entraObra(String(r.obra || "")); });
    var vSuma = 0;
    vDentro.forEach(function (r) { vSuma += r.monto || 0; });
    var deud = {};
    vDentro.forEach(function (r) {
      var dd = r.d || [];
      var k = String(dd[0] || "—");
      var o = deud[k] = deud[k] || {n: 0, s: 0, obra: String(r.obra || "—"), u: {}};
      o.n++; o.s += r.monto || 0;
      var un = String(dd[4] || "").trim();
      if (un) o.u[un] = 1;
    });
    var deudL = Object.keys(deud).map(function (k) {
      return [k, deud[k].n, deud[k].s, deud[k].obra, Object.keys(deud[k].u).join(" · ")]; })
      .sort(function (a, b) { return b[2] - a[2]; });
    var hayFiltroObra = !!(OBRA || TIPO || RS);
    var cobrarMes = {};
    vDentro.forEach(function (r) {
      var f = String(r.fecha || "");
      if (f.indexOf(String(anioHoy)) !== 0) return;
      var m = parseInt(f.slice(5, 7), 10);
      if (m >= 1 && m <= 12) cobrarMes[m] = (cobrarMes[m] || 0) + (r.monto || 0);
    });
    var cartera = comp.cartera || 0;
    var porVencer = (comp.por_vencer || {}).monto || 0;
    var sinCrono = (comp.sin_cronograma || {}).monto || 0;

    h += '<div class="d-kpis d-dosk">' +
      '<div class="d-carta d-abrible abrible" data-abre="v-cobrar" aria-expanded="false" tabindex="0" role="button">' +
        '<div class="d-cab"><span class="d-chip">⏱</span><span class="d-preg">¿Cuánto falta cobrar?</span></div>' +
        '<div class="d-cifra">' + solesM(hayFiltroObra ? vSuma : cartera) + '</div>' +
        '<div class="d-exacta">' + (hayFiltroObra ?
          ent(vDentro.length) + ' cuotas vencidas' :
          soles(cartera) + ' · ' + ent(comp.creditos || 0) + ' créditos') + '</div>' +
        '<div class="d-pie"><span class="d-tag mal">' +
        (cartera ? fmt1(vSuma / cartera * 100) : '0.0') + '%</span>ya venció · ' +
        ent(vDentro.length) + ' cuotas</div>' +
        chispaV(cobrarMes, '', 'Vencido en ' + anioHoy) + '</div>' +
      (EMB && EMB.leads_por_venta
        ? '<div class="d-carta d-kpi-saldo d-abrible abrible" data-abre="v-crm" ' +
          'aria-expanded="false" tabindex="0" role="button">' +
          '<div class="d-cab"><span class="d-chip">◎</span>' +
          '<span class="d-preg">¿Cuánto cuesta cerrar?</span></div>' +
          '<div class="d-cifra">1 de ' + ent(Math.round(EMB.leads_por_venta)) + '</div>' +
          '<div class="d-exacta">1 venta cada ' + ent(Math.round(EMB.leads_por_venta)) +
          ' leads · ' + ent(EMB.vendidos) + ' en VENDIDO de Kommo de ' + ent(EMB.leads) + '</div>' +
          '<div class="d-pie">el embudo completo está en CRM</div></div>'
        : '') +
      '</div>' +
      '<div class="detalle" id="det-v-cobrar"></div>' +
      '<div class="detalle" id="det-v-crm"></div>';

    this._vSuma = vSuma; this._deudL = deudL; this._venc = venc;
    this._comp = comp; this._porVencer = porVencer; this._sinCrono = sinCrono;
    this._cartera = cartera; this._hayFiltroObra = hayFiltroObra;

    var monto25 = {}, ventas25 = {};
    ((((D.meses || {})["2025"] || {}).estructura || {}).modalidad || [])
      .forEach(function (mo) {
        (mo.detalle || []).forEach(function (r) {
          if (!entraObra(String(r.obra || "—"))) return;
          var m = parseInt(String(r.fecha || "").slice(5, 7), 10);
          if (!(m >= 1 && m <= 12)) return;
          monto25[m] = (monto25[m] || 0) + (r.precio || 0);
          ventas25[m] = (ventas25[m] || 0) + 1;
        });
      });
    var sinConteo25 = false;
    var _VC = D.ventas_contadora || {};
    if (_VC.hay && !hayFiltroObra) {
      monto25 = {}; ventas25 = {}; sinConteo25 = true;
      (_VC.meses || []).forEach(function (x) {
        if (x && x.monto) monto25[x.mes] = x.monto; });
    }
    var mesActV = 0;
    ((D.flujo || {}).meses || []).forEach(function (m) {
      if (m.en_curso) mesActV = m.mes; });
    var hay25 = Object.keys(monto25).length > 0 && anioSel === anioHoy;
    this._gf = {montoMes: montoMes, ventasMes: ventasMes, monto25: monto25,
                ventas25: ventas25, anioSel: anioSel, mesActV: mesActV,
                acumAnio: acumAnio, ventasAnio: ventasAnio,
                hayFiltroObra: hayFiltroObra, hay25: hay25,
                sinConteo25: sinConteo25, mesesSin25: (_VC.meses || [])
                  .filter(function (x) { return x && !x.monto; })
                  .map(function (x) { return x.mes; })};
    if (!this._vFirm || !hay25) this._vFirm = "act";

    if (Object.keys(montoMes).length || hay25) {
      h += '<div class="d-carta">' +
        '<div class="gt-cab"><h3 class="d-tit">Lo firmado, mes a mes</h3>' + gtBotones("firmado") + '</div>' +
        (hay25
          ? '<div class="pills-emp" id="pills-firmado" style="margin:6px 0 2px">' +
            '<button class="pill-emp pill-vf' + (this._vFirm === "act" ? ' activa' : '') +
            '" data-vf="act" type="button">' + esc(String(anioSel)) + '</button>' +
            '<button class="pill-emp pill-vf' + (this._vFirm === "2025" ? ' activa' : '') +
            '" data-vf="2025" type="button">2025</button>' +

      this._vivas.forEach(function (v) { efT.a += v.entroAx || 0; });
      return tv + '<tr class="total"><td class="obra">TOTAL</td><td></td>' +
        '<td class="num">' + ent(this._vivas.length) + '</td>' +
        '<td class="num">' + soles(this._firmado) + '</td>' +
        '<td class="num">100%</td><td class="num">' + soles(this._ticket) + '</td>' +
        efCel(efT) + '</tr></tbody></table></div>';
    }
    if (id === "v-stock") {
      var tt2 = t + '<h3>Stock por proyecto · libres y bloqueadas</h3>' +
        '<div class="envoltura-tabla"><table class="datos"><thead><tr>' +
        '<th>Proyecto</th><th class="num">Libres</th><th class="num">Bloqueadas</th>' +
        '<th class="num">En stock</th>' +
        '<th class="num">Vendidas ' + esc(String(this._anioHoy)) + '</th>' +
        '</tr></thead><tbody>';
      if (!(this._obrasAv || []).length) return tt2 + this._filaNE(5) + '</tbody></table></div>';
      this._obrasAv.forEach(function (o) {
        tt2 += '<tr><td class="obra">' + self._nx(o.obra) + '</td>' +
          '<td class="num">' + ent(o.libres) + '</td>' +
          '<td class="num">' + ent(o.bloq || 0) + '</td>' +
          '<td class="num">' + soles(o.libresS) + '</td>' +
          '<td class="num">' + ent(o.ventasAnio || 0) + '</td></tr>';
      });
      return tt2 + '</tbody></table></div>';
    }

    if (id === "v-crm" && this._EMB) {
      var E = this._EMB;
      var fila = function (corte, det, leads, pTot, cierres, conv, estilo) {
        return '<tr><td class="obra">' + corte + '</td>' +
          '<td style="white-space:normal">' + det + '</td>' +
          '<td class="num">' + leads + '</td><td class="num">' + pTot + '</td>' +
          '<td class="num">' + cierres + '</td>' +
          '<td class="num"' + (estilo || '') + '>' + conv + '</td></tr>';
      };
      var te = t + '<h3>El embudo · peldaños y cortes</h3>' +
        '<div class="envoltura-tabla"><table class="datos"><thead><tr>' +
        '<th>Corte</th><th>Detalle</th><th class="num">Leads</th>' +
        '<th class="num">% del total</th><th class="num">Vendidos en Kommo</th>' +
        '<th class="num">Conversión</th></tr></thead><tbody>' +
        fila('Peldaño', 'Leads', ent(E.leads), '100%', '',
          fmt1(E.pct_cierre_leads) + '%') +
        fila('Peldaño', 'Contactados o más allá', ent(E.contactados),
          fmt1(E.pct_contactados) + '%', '', fmt1(E.pct_cierre_contactados) + '%');
      if (E.citas && E.citas.hay) {
        te += fila('Peldaño', 'Con cita agendada', ent(E.citas.leads_con_cita),
            (E.leads ? fmt1(E.citas.leads_con_cita / E.leads * 100) : '0.0') + '%', '',
            (E.citas.leads_con_cita ? fmt1(E.citas.cerraron_con_cita / E.citas.leads_con_cita * 100) : '0.0') + '%') +
          fila('Peldaño', 'Cita completada' +
            (E.citas.vencidas_sin_completar
              ? '<span class="ob-sub"> ' + ent(E.citas.vencidas_sin_completar) +
                ' vencidas sin completar</span>' : '') +
            (E.citas.vendidos_sin_cita
              ? '<span class="ob-sub"> ' + ent(E.citas.vendidos_sin_cita) +
                ' cierres sin cita</span>' : ''),
            ent(E.citas.leads_con_cita_completada),
            (E.leads ? fmt1(E.citas.leads_con_cita_completada / E.leads * 100) : '0.0') + '%', '',
            (E.citas.leads_con_cita_completada ? fmt1(E.citas.cerraron_con_cita_completada / E.citas.leads_con_cita_completada * 100) : '0.0') + '%');
      }
      te += fila('Peldaño', 'Visita presencial registrada', ent(E.visitas),
        fmt1(E.pct_visitas) + '%', '', fmt1(E.pct_cierre_visitas) + '%');
      var alcance = [];
      [["Campaña", "campañas", E.por_campana], ["Asesor", "asesores", E.por_asesor],
       ["Proyecto", "proyectos", E.por_proyecto]].forEach(function (c) {
        var lista = (c[2] || []).filter(function (x) { return x.leads >= 20; });
        if (!lista.length) return;
        alcance.push(ent(Math.min(10, lista.length)) + ' de ' + ent(lista.length) + ' ' + c[1]);
        var filaCorte = function (x) {
          return fila(c[0], self._nx(x.clave), ent(x.leads), '', ent(x.vendidos),
            fmt1(x.pct) + '%', x.vendidos === 0 ? ' style="color:var(--rojo)"' : '');
        };
        lista.slice(0, 10).forEach(function (x) { te += filaCorte(x); });
        if (lista.length > 10) {
          var rs = lista.slice(10), rl = 0, rv = 0;
          rs.forEach(function (x) { rl += x.leads; rv += x.vendidos; });
          te += filaOtros(esc(c[0]),
            '<td style="white-space:normal">… ' + ent(rs.length) + ' ' + c[1] + ' más</td>' +
            '<td class="num">' + ent(rl) + '</td><td class="num"></td>' +
            '<td class="num">' + ent(rv) + '</td><td class="num"></td>',
            rs.map(function (x) {
              return filaCorte(x).replace(/^<tr[^>]*>/, '').replace(/<\/tr>$/, ''); }));
        }
      });
      if (alcance.length) {
        te += '<tr class="total"><td class="obra" colspan="2">Cortes desde 20 leads · ' +
          'se muestran ' + alcance.join(' · ') + '</td><td class="num"></td>' +
          '<td class="num"></td><td class="num"></td><td class="num"></td></tr>';
      }
      return te + '<tr class="total"><td class="obra">VENDIDO</td><td></td>' +
        '<td class="num">' + ent(E.vendidos) + '</td>' +
        '<td class="num">' + fmt1(E.pct_cierre_leads) + '%</td>' +
        '<td class="num"></td><td class="num">100%</td></tr></tbody></table></div>';
    }
    if (id === "v-cobrar") {
      var DL = this._deudL || [];
      var nCuotas = 0;
      DL.forEach(function (r) { nCuotas += r[1]; });
      var h4 = t + '<h3>Quién debe más · cuotas vencidas por deudor</h3>' +
        '<div class="envoltura-tabla"><table class="datos"><thead><tr>' +
        '<th>Deudor</th><th>Proyecto</th><th>Unidad</th><th class="num">Cuotas</th>' +
        '<th class="num">Monto</th></tr></thead><tbody>';
      if (!DL.length) h4 += this._filaNE(5);
      var celdasD = function (r) {
        return '<td class="obra">' + self._nx(r[0]) + '</td>' +
          '<td style="white-space:normal">' + self._nx(r[3]) + '</td>' +
          '<td>' + (r[4] ? esc(r[4]) : 'No existe') + '</td>' +
          '<td class="num">' + ent(r[1]) + '</td>' +
          '<td class="num">' + soles(r[2]) + '</td>';
      };
      DL.slice(0, 5).forEach(function (r) { h4 += '<tr>' + celdasD(r) + '</tr>'; });
      if (DL.length > 5) {
        var rD = DL.slice(5), rn = 0, rm = 0;
        rD.forEach(function (r) { rn += r[1]; rm += r[2]; });
        h4 += filaOtros('… ' + ent(rD.length) + (rD.length === 1 ? ' deudor más' : ' deudores más'),
          '<td></td><td></td><td class="num">' + ent(rn) + '</td>' +
          '<td class="num">' + soles(rm) + '</td>', rD.map(celdasD));
      }
      h4 += '<tr class="total"><td class="obra">TOTAL ya vencido · ' + ent(DL.length) +
        (DL.length === 1 ? ' deudor' : ' deudores') +
        '</td><td></td><td></td>' +
        '<td class="num">' + ent(nCuotas) + '</td>' +
        '<td class="num">' + soles(this._vSuma) + '</td></tr>';
      if (!this._hayFiltroObra) {
        h4 += '<tr class="total"><td class="obra">Por vencer</td><td></td><td></td>' +
          '<td class="num"></td><td class="num">' + soles(this._porVencer) + '</td></tr>' +
          '<tr class="total"><td class="obra">Sin cronograma</td><td></td><td></td>' +
          '<td class="num">No existe</td><td class="num">' + soles(this._sinCrono) + '</td></tr>';
        var fuera = this._venc.filter(function (r) { return r.fuera; });
        var fs = fuera.reduce(function (a, r) { return a + (r.monto || 0); }, 0);
        if (fuera.length) {
          h4 += '<tr class="total"><td class="obra">Vencido de créditos fuera de ' +
            'esta cartera · Cobranzas</td><td></td><td></td>' +
            '<td class="num">' + ent(fuera.length) + '</td>' +
            '<td class="num">' + soles(fs) + '</td></tr>';
        }
      }
      return h4 + '</tbody></table></div>';
    }
    if (id === "v-crm" && this._crm) {
      var tt3 = t + '<h3>El embudo · por etapa</h3>' +
        '<div class="envoltura-tabla"><table class="datos"><thead><tr>' +
        '<th>Etapa</th><th class="num">Leads</th><th class="num">%</th>' +
        '</tr></thead><tbody>';
      if (!(this._crm.etapas || []).length) tt3 += this._filaNE(3);
      (this._crm.etapas || []).forEach(function (e) {
        tt3 += '<tr><td class="obra">' + self._nx(e.valor) + '</td>' +
          '<td class="num">' + ent(e.leads || 0) + '</td>' +
          '<td class="num">' + fmt1(e.pct || 0) + '%</td></tr>';
      });
      return tt3 + '<tr class="total"><td class="obra">TOTAL</td>' +
        '<td class="num">' + ent(this._leads) + '</td><td class="num"></td></tr>' +
        '</tbody></table></div>';
    }
    return null;
  },

  conectar: function () {
    var self = this;
    var pills = document.getElementById("pills-firmado");
    if (!pills) return;
    pills.addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest(".pill-vf") : null;
      if (!b) return;
      var v = b.getAttribute("data-vf");
      if (v === self._vFirm) return;
      self._vFirm = v;
      [].forEach.call(pills.querySelectorAll(".pill-vf"), function (x) {
        x.classList.toggle("activa", x.getAttribute("data-vf") === v);
      });
      var caja = document.getElementById("graf-firmado");
      if (!caja) return;
      caja.innerHTML = self._grafFirmado();
      conectarAbribles(caja);
    });
  }
};
</script>
</body>
</html>
