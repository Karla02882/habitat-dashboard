<script>
"use strict";
window.HOJA = {
  id: "crm-informe",
  nombre: "Informe",
  pregunta: "¿Qué dice hoy el informe que Comercial arma a mano?",
  filtros: ["fuente", "fechas"],
  sinRazonObra: true,

  _filtro: null,

  _empresa: "habitat",

  pintar: function (M, D) {
    var C = M.crm || {};
    if (!C.disponible) return "<p class='mas'>Sin data de Kommo en este período.</p>";
    this._filtro = null;
    var kl = this._verKL;
    var h = '<section class="seccion"><div class="seccion-cab">' +
      '<h2>Informe comercial</h2>' +
      '<button type="button" class="kl-boton' + (kl ? ' activa' : '') +
      '" id="kl-boton" aria-pressed="' + (kl ? 'true' : 'false') + '">KPI\'s de leads</button>' +
      '</div>' +
      '<div id="kl-panel"' + (kl ? '' : ' hidden') + '>' + (kl ? this._klPanel(M, D) : '') + '</div>' +
      '<div id="informe-normal"' + (kl ? ' hidden' : '') + '>' + this._pillsEmpresa(D) +
      '<div id="informe-caja">' + this._cuerpo(M, D) + '</div></div></section>';
    return h;
  },

  _verKL: false,
  _klVend: "",
  _klContesto: "etapa",
  _klG: null,

  _klNorm: function (s) {
    return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "")
      .toUpperCase().replace(/[^A-Z ]/g, " ").replace(/\s+/g, " ").trim();
  },

  _klMismo: function (a, b) {
    var na = this._klNorm(a), nb = this._klNorm(b);
    if (!na || !nb) return false;
    if (na === nb) return true;
    var wa = na.split(" "), wb = nb.split(" ");
    var com = wa.filter(function (x) { return x.length >= 4 && wb.indexOf(x) >= 0; }).length;
    return com >= 2 && (wb.indexOf(wa[0]) >= 0 || wa.indexOf(wb[0]) >= 0);
  },

  _klAnioHoy: function (D) {
    return parseInt(String((D.nombres_mes || {})["None"] || ""), 10) || new Date().getFullYear();
  },

  _klContratos: function (D) {
    return [].concat.apply([], ((((D.meses || {}).hist || {}).estructura || {}).modalidad || [])
      .map(function (mo) { return mo.detalle || []; }));
  },

  _klGrupos: function (D) {
    if (this._klG && this._klG.D === D) return this._klG;
    var self = this, grupos = [], de = {};
    var meter = function (nombre, deAxion) {
      var crudo = String(nombre || "").trim(), n = self._klNorm(crudo);
      if (!n) return;
      if (de.hasOwnProperty(n)) {
        var g0 = grupos[de[n]];
        if (deAxion && !g0.axion) { g0.axion = true; g0.rot = crudo; }
        return;
      }
      var idx = -1;
      for (var i = 0; i < grupos.length && idx < 0; i++) {
        for (var j = 0; j < grupos[i].nombres.length; j++) {
          if (self._klMismo(grupos[i].nombres[j], crudo)) { idx = i; break; }
        }
      }
      if (idx < 0) { grupos.push({nombres: [], rot: crudo, axion: !!deAxion}); idx = grupos.length - 1; }
      var g = grupos[idx];
      g.nombres.push(crudo);
      if (deAxion && !g.axion) { g.axion = true; g.rot = crudo; }
      de[n] = idx;
    };
    Object.keys(D.meses || {}).forEach(function (k) {
      (((D.meses[k] || {}).asesores_axion || {}).asesores || []).forEach(function (a) { meter(a.asesor, true); });
    });
    this._klContratos(D).forEach(function (v) { meter(v.asesor, true); });
    ((((D.meses || {}).hist || {}).crm_filas) || []).forEach(function (f) { meter(f.responsable, false); });
    this._klG = {D: D, grupos: grupos, de: de, cache: {}};
    return this._klG;
  },

  _klPersona: function (D, nombre) {
    var G = this._klGrupos(D), k = String(nombre || "");
    if (G.cache.hasOwnProperty(k)) return G.cache[k];
    var i = G.de[this._klNorm(k)];
    return (G.cache[k] = (i === undefined ? k.trim() : G.grupos[i].rot));
  },

  _klPer: function (D) {
    var p = String(P), hoy = this._klAnioHoy(D), m;
    if (p === "hist") return {tipo: "hist"};
    if ((m = /^(\d{4})-(\d{1,2})$/.exec(p))) return {tipo: "mes", y: +m[1], m: +m[2]};
    if (/^\d{4}$/.test(p)) return {tipo: "anio", y: +p};
    if (/^\d{1,2}$/.test(p)) return {tipo: "mes", y: hoy, m: +p};
    return {tipo: "anio", y: hoy};
  },

  _klAniosKommo: function (D) {
    var s = {};
    ((((D.meses || {}).hist || {}).crm_filas) || []).forEach(function (f) {
      var a = String(f.creado || "").slice(0, 4);
      if (/^\d{4}$/.test(a)) s[a] = 1;
    });
    return Object.keys(s).sort().map(Number);
  },

  _klSel: function (D, per) {
    var self = this, hoy = this._klAnioHoy(D);
    if (per.tipo === "mes") {
      return {pref: [per.y + "-" + (per.m < 10 ? "0" : "") + per.m],
              ax: [per.y === hoy ? String(per.m) : per.y + "-" + per.m]};
    }
    if (per.tipo === "anio") return {pref: [String(per.y)], ax: [per.y === hoy ? "None" : String(per.y)]};
    var anios = this._klAniosKommo(D);
    return {pref: anios.map(String),
            ax: anios.map(function (y) { return y === hoy ? "None" : String(y); })};
  },

  _klCifras: function (D, sel, vend, conPersonas) {
    var self = this;
    var enPref = function (fecha) {
      var s = String(fecha || "");
      for (var i = 0; i < sel.pref.length; i++) if (s.indexOf(sel.pref[i]) === 0) return true;
      return false;
    };
    var contesto = this._klContesto === "etapa"
      ? function (f) { return String(f.etapa || "").toUpperCase() === "CONTACTADO"; }
      : function (f) { return /^SI LLAMADAS/i.test(String(f.contactabilidad || "")); };
    var nuevo = function () {
      return {leads: 0, contestaron: 0, citas: 0, asistieron: 0, ventas: 0, mvt: 0, mei: 0, ax: false};
    };
    var o = nuevo(), pp = {};
    var de = function (nombre) {
      var q = self._klPersona(D, nombre);
      if (vend && q !== vend) return null;
      if (!conPersonas) return [o];
      return [o, pp[q] = pp[q] || nuevo()];
    };
    ((((D.meses || {}).hist || {}).crm_filas) || []).forEach(function (f) {
      if (!enPref(f.creado)) return;
      var t = de(f.responsable); if (!t) return;
      var c = contesto(f);
      t.forEach(function (x) { x.leads++; if (c) x.contestaron++; });
    });
    sel.ax.forEach(function (k) {
      (((D.meses[k] || {}).asesores_axion || {}).asesores || []).forEach(function (a) {
        var t = de(a.asesor); if (!t) return;
        t.forEach(function (x) {
          if (a.agendas !== null && a.agendas !== undefined) { x.citas += +a.agendas || 0; x.ax = true; }
          if (a.visitas !== null && a.visitas !== undefined) { x.asistieron += +a.visitas || 0; x.ax = true; }
        });
      });
    });
    this._klContratos(D).forEach(function (v) {
      if (!enPref(v.fecha)) return;
      var t = de(v.asesor); if (!t) return;
      t.forEach(function (x) { x.ventas++; x.mvt += v.precio || 0; x.mei += v.entro_axion || 0; });
    });
    var cerrar = function (x) { if (!x.ax) { x.citas = null; x.asistieron = null; } return x; };
    cerrar(o);
    if (conPersonas) {
      o.personas = Object.keys(pp).map(function (q) { return {rot: q, c: cerrar(pp[q])}; });
    }
    return o;
  },

  _klSerie: function (D, per) {
    var MES = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Set", "Oct", "Nov", "Dic"];
    if (per.tipo === "hist") {
      return this._klAniosKommo(D).map(function (y) {
        return {rot: String(y), sel: false, per: {tipo: "anio", y: y}}; });
    }
    var y = per.y, tope = 12;
    if (y === this._klAnioHoy(D)) {
      tope = 0;
      for (var m = 1; m <= 12; m++) if ((D.meses || {})[String(m)]) tope = m;
    }
    var out = [];
    for (var mm = 1; mm <= tope; mm++) {
      out.push({rot: MES[mm - 1], sel: per.tipo === "mes" && per.m === mm,
                per: {tipo: "mes", y: y, m: mm}});
    }
    return out;
  },

  _klCorto: function (v) {
    var a = Math.abs(v || 0);
    if (a >= 1e6) return "S/ " + (v / 1e6).toFixed(2) + "M";
    if (a >= 1e3) return "S/ " + Math.round(v / 1e3) + "k";
    return soles(v);
  },

  _klDona: function (tit, cifra, sub, serie, campo, esSoles) {
    var self = this;
    var COL = ["#1e7cf5", "#60a5fa", "#1e40af", "#93c5fd", "#2563eb", "#38bdf8",
               "#1d4ed8", "#bfdbfe", "#172554", "#7dd3fc", "#0369a1", "#3b82f6"];
    var tot = 0;
    serie.forEach(function (s) { tot += s.c[campo] || 0; });
    var h = '<div class="kl-graf"><div class="kl-graf-tit">' + esc(tit) + '</div>' +
      '<div class="kl-graf-cif">' + cifra + '</div><div class="kl-graf-sub">' + esc(sub) + '</div>' +
      '<svg viewBox="0 0 42 42" class="kl-dona" role="img" aria-label="' + esc(tit) + '">' +
      '<circle cx="21" cy="21" r="15.9155" fill="none" stroke="#eef2f7" stroke-width="7"></circle>';
    var acum = 0;
    serie.forEach(function (s, i) {
      var v = s.c[campo] || 0;
      if (!tot || !v) return;
      var frac = 100 * v / tot;
      h += '<circle cx="21" cy="21" r="15.9155" fill="none" stroke="' + COL[i % COL.length] +
        '" stroke-width="7" stroke-dasharray="' + frac.toFixed(3) + ' ' + (100 - frac).toFixed(3) +
        '" stroke-dashoffset="' + (25 - acum).toFixed(3) + '"><title>' + esc(s.rot) + ': ' +
        (esSoles ? soles(v) : ent(v)) + '</title></circle>';
      acum += frac;
    });

  _cuerpo: function (M, D) {

    if (de || ha) {

        var c = String(f.creado || "").slice(0, 10);
        if (!c) return false;
        if (de && c < de) return false;
        if (ha && c > ha) return false;
        return true;

      this.bloqueBarras("Estado de lead", contarPor(Ff, "etapa"), "etapa", filtro, 12) +
      this.bloqueBarras("Proyecto de interés", contarPor(Ff, "proyecto"), "proyecto", filtro, 10) +
      '</div>';

      var mot = contarPor(Ff, "motivo_perdida");

    var celda = function (b) {

  _atencionDeFilas: function (F) {
    var ETQ = /(WSP\s*OFICIAL|FB\s*MESSENGER)/i;
    var porAsesor = {};
    (F || []).forEach(function (f) {
      var etq = f.etiquetas;
      var txt = Array.isArray(etq) ? etq.join(" ") : String(etq || "");
      if (!ETQ.test(txt)) return;
      var h = Number(f.horas_atencion);
      if (!isFinite(h) || h < 0) return;
      var d = new Date(String(f.creado || "").replace(" ", "T"));
      if (isNaN(d.getTime())) return;
      var fds = (d.getDay() === 0 || d.getDay() === 6);
      var enJornada = (d.getHours() >= 9 && d.getHours() < 18);
      var k = String(f.responsable || "(sin responsable)");
      var o = porAsesor[k] = porAsesor[k] ||
        {responsable: k, leads: 0, lab: [], fue: [], fds: []};
      o.leads++;
      if (fds) o.fds.push(h);
      else if (enJornada) o.lab.push(h);
      else o.fue.push(h);
    });
    var mediana = function (a) {
      if (!a.length) return {leads: 0, mediana_h: null};
      var s = a.slice().sort(function (x, y) { return x - y; });
      var m = s.length % 2 ? s[(s.length - 1) / 2]
                           : (s[s.length / 2 - 1] + s[s.length / 2]) / 2;
      return {leads: s.length, mediana_h: m};
    };
    return Object.keys(porAsesor).map(function (k) {
      var o = porAsesor[k];
      return {responsable: o.responsable, leads: o.leads,
              laboral: mediana(o.lab), fuera_horario: mediana(o.fue),
              fin_de_semana: mediana(o.fds)};
    }).sort(function (a, b) { return b.leads - a.leads; });
  },

  bloqueBarras: function (titulo, items, campo, filtroActivo, tope) {
    var L = (items || []).slice();
    if (!L.length) return '<div class="tarjeta"><span class="overline">' + esc(titulo) +
      '</span><div class="cifra-g raya">—</div></div>';
    var max = L[0].leads || 1;
    var h = '<div class="tarjeta" style="padding:var(--e4) var(--e2)">' +
      '<span class="overline" style="padding:0 var(--e2)">' + esc(titulo) + '</span>' +
      '<table class="grafico-pb" style="margin-top:var(--e3)"><tbody>';
    L.slice(0, tope).forEach(function (x) {
      var nom = String(x.valor);
      var sel = campo && filtroActivo && filtroActivo.campo === campo && filtroActivo.valor === nom;
      h += '<tr' + (campo ? ' class="pb-clic' + (sel ? ' pb-sel' : '') +
          '" data-campo="' + esc(campo) + '" data-valor="' + esc(nom) +
          '" data-rotulo="' + esc(titulo) + '" tabindex="0" role="button"' : '') + '>' +
        '<td class="pb-nom" title="' + esc(nom) + '">' + esc(nom) + '</td>' +
        '<td class="pb-barra"><span style="width:' + Math.max(2, 100 * x.leads / max) +
        '%"></span></td>' +
        '<td class="pb-cif">' + ent(x.leads) + '</td></tr>';
    });
    if (L.length > tope) {
      var resto = L.slice(tope), s = 0;
      resto.forEach(function (x) { s += x.leads; });
      var idOtros = "otros-" + String(campo || "x") + "-" +
        String(titulo).replace(/[^A-Za-z0-9]+/g, "");
      h += '<tr class="pb-otros pb-desplegar" data-otros="' + idOtros +
        '" tabindex="0" role="button">' +
        '<td class="pb-nom">otros ' + resto.length + ' <span class="pb-mas">▾</span></td>' +
        '<td class="pb-barra"><span style="width:' + Math.max(2, 100 * s / max) +
        '%"></span></td><td class="pb-cif">' + ent(s) + '</td></tr>';
      resto.forEach(function (x) {
        var nom2 = String(x.valor);
        var sel2 = campo && filtroActivo && filtroActivo.campo === campo &&
                   filtroActivo.valor === nom2;
        h += '<tr class="pb-oculta ' + idOtros +
          (campo ? ' pb-clic' + (sel2 ? ' pb-sel' : '') : '') + '"' +
          (campo ? ' data-campo="' + esc(campo) + '" data-valor="' + esc(nom2) +
                   '" data-rotulo="' + esc(titulo) + '" tabindex="0" role="button"' : '') +
          '><td class="pb-nom pb-hijo" title="' + esc(nom2) + '">' + esc(nom2) + '</td>' +
          '<td class="pb-barra"><span style="width:' +
          Math.max(2, 100 * x.leads / max) + '%"></span></td>' +
          '<td class="pb-cif">' + ent(x.leads) + '</td></tr>';
      });
    }
    return h + '</tbody></table></div>';
  },

  dona: function (titulo, items, campo, filtroActivo) {
    var L = (items || []).slice();
    if (!L.length) return "";
    var vacio = L.every(function (x) {
      var v = String(x.valor || "").toLowerCase();
      return v === "(sin dato)" || v === "" || v === "—";
    });
    if (vacio) {
      var tot = 0; L.forEach(function (x) { tot += x.leads; });
      return '<div class="tarjeta"><span class="overline">' + esc(titulo) +
        '</span><p class="linea-meta" style="margin-top:var(--e2)">' +
        ent(tot) + ' leads sin este dato · el campo no existe entre los 30 ' +
        'que Kommo define para un lead · Comercial</p></div>';
    }
    var COLORES = ["#1f3a5f", "#5b7ba6", "#b8860b", "#9aa4b2", "#6b4e71", "#c9a86a"];
    var suma = 0; L.forEach(function (x) { suma += x.leads; });
    var h = '<div class="tarjeta"><span class="overline">' + esc(titulo) + '</span>' +
      '<div class="dona-caja"><svg viewBox="0 0 42 42" class="dona">' +
      '<circle cx="21" cy="21" r="15.9155" fill="none" stroke="#eef1f6" stroke-width="6"></circle>';
    var acum = 0;
    L.forEach(function (x, i) {
      var frac = suma ? 100 * x.leads / suma : 0;
      h += '<circle cx="21" cy="21" r="15.9155" fill="none" stroke="' +
        COLORES[i % COLORES.length] + '" stroke-width="6" ' +
        'stroke-dasharray="' + frac + ' ' + (100 - frac) + '" ' +
        'stroke-dashoffset="' + (25 - acum) + '"></circle>';
      acum += frac;
    });
    h += '</svg><div class="dona-leyenda">';
    L.forEach(function (x, i) {
      var nom = String(x.valor);
      var sel = filtroActivo && filtroActivo.campo === campo && filtroActivo.valor === nom;
      h += '<div class="pb-clic' + (sel ? ' pb-sel' : '') + '" data-campo="' + esc(campo) +
        '" data-valor="' + esc(nom) + '" data-rotulo="' + esc(titulo) +
        '" tabindex="0" role="button"><span class="pto" style="background:' +
        COLORES[i % COLORES.length] + '"></span>' + esc(nom) + ' · <b>' + ent(x.leads) +
        '</b> (' + pct(suma ? 100 * x.leads / suma : null) + ')</div>';
    });
    return h + '</div></div></div>';
  },

  detalle: function () { return null; },

  conectar: function (M, D) {
    var self = this;

    var klBoton = document.getElementById("kl-boton");
    var klPanel = document.getElementById("kl-panel");
    var klNormal = document.getElementById("informe-normal");
    if (klBoton && klPanel && klNormal) {
      var repintarKL = function () { klPanel.innerHTML = self._klPanel(M, D); };
      klBoton.addEventListener("click", function () {
        self._verKL = !self._verKL;
        klBoton.classList.toggle("activa", self._verKL);
        klBoton.setAttribute("aria-pressed", self._verKL ? "true" : "false");
        if (self._verKL) repintarKL();
        klPanel.hidden = !self._verKL;
        klNormal.hidden = self._verKL;
      });
      klPanel.addEventListener("change", function (e) {
        if (e.target && e.target.id === "kl-vend") { self._klVend = e.target.value; repintarKL(); }
      });
      klPanel.addEventListener("click", function (e) {
        var b = e.target.closest ? e.target.closest("[data-kl-contesto]") : null;
        if (b) { self._klContesto = b.getAttribute("data-kl-contesto"); repintarKL(); return; }
        var fila = e.target.closest ? e.target.closest("[data-kl-persona]") : null;
        if (fila) {
          var v = fila.getAttribute("data-kl-persona");
          self._klVend = self._klVend === v ? "" : v;
          repintarKL();
        }
      });
      klPanel.addEventListener("keydown", function (e) {
        if (e.key !== "Enter" && e.key !== " ") return;
        var fila = e.target.closest ? e.target.closest("[data-kl-persona]") : null;
        if (!fila) return;
        e.preventDefault();
        fila.click();
      });
    }

    var caja = document.getElementById("informe-caja");
    if (!caja) return;

    var pills = document.querySelector(".pills-emp");
    if (pills) {
      pills.addEventListener("click", function (e) {
        var b = e.target.closest ? e.target.closest(".pill-emp") : null;
        if (!b) return;
        var v = b.getAttribute("data-emp");
        if (v === self._empresa) return;
        self._empresa = v;
        self._filtro = null;
        [].forEach.call(pills.querySelectorAll(".pill-emp"), function (x) {
          x.classList.toggle("activa", x.getAttribute("data-emp") === v);
        });
        caja.innerHTML = self._cuerpo(M, D);
      });
    }
    caja.addEventListener("click", function (e) {
      var d = e.target.closest ? e.target.closest(".pb-desplegar") : null;
      if (!d) return;
      e.stopPropagation();
      var id = d.getAttribute("data-otros");
      var abierto = d.classList.toggle("abierto");
      caja.querySelectorAll("." + id).forEach(function (f) {
        f.style.display = abierto ? "table-row" : "none";
      });
      var s = d.querySelector(".pb-mas");
      if (s) s.textContent = abierto ? "▴" : "▾";
    });

    caja.addEventListener("click", function (e) {
      if (e.target.closest && e.target.closest(".pb-desplegar")) return;
      var boton = e.target.closest ? e.target.closest("#informe-quitar-filtro") : null;
      if (boton) { self._filtro = null; caja.innerHTML = self._cuerpo(M, D); return; }
      var fila = e.target.closest ? e.target.closest(".pb-clic") : null;
      if (!fila) return;
      var campo = fila.getAttribute("data-campo"), valor = fila.getAttribute("data-valor");
      var actual = self._filtro;
      self._filtro = (actual && actual.campo === campo && actual.valor === valor)
        ? null
        : {campo: campo, valor: valor, rotulo: fila.getAttribute("data-rotulo")};
      caja.innerHTML = self._cuerpo(M, D);
    });
    caja.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" && e.key !== " ") return;
      var fila = e.target.closest ? e.target.closest(".pb-clic") : null;
      if (!fila) return;
      e.preventDefault();
      fila.click();
    });
  }
};

var _DIAS_INF = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
function _cuandoDe(filas) {
  var n = filas.length;
  var cd = {}, ch = {};
  filas.forEach(function (f) {
    var m = /^(\d{4})-(\d{2})-(\d{2})[ T](\d{2}):/.exec(String(f.creado || ""));
    if (!m) return;
    var dow = new Date(+m[1], +m[2] - 1, +m[3]).getDay(); // 0=domingo..6=sábado
    var nombreDia = _DIAS_INF[dow === 0 ? 6 : dow - 1];
    cd[nombreDia] = (cd[nombreDia] || 0) + 1;
    var hh = m[4] + ":00";
    ch[hh] = (ch[hh] || 0) + 1;
  });
  return {
    dias: _DIAS_INF.map(function (d) {
      return {valor: d, leads: cd[d] || 0, pct: n ? 100 * (cd[d] || 0) / n : 0}; }),
    horas: Array.from({length: 24}, function (_, hh) {
      var k = (hh < 10 ? "0" + hh : "" + hh) + ":00";
      return {valor: k, leads: ch[k] || 0, pct: n ? 100 * (ch[k] || 0) / n : 0}; }),
  };
}
</script>
