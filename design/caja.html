<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body>
<div class="envoltorio">
  <header class="cabecera"><div class="cabecera-fila">
    <span class="hoja-nombre" id="hoja-nombre"></span>
    <span class="cabecera-der" id="cab-der"></span></div></header>
  <nav class="nav" id="nav"></nav>
  <div class="subnav" id="subnav"></div>
  <div class="filtros-zona"><div class="filtros">
    <div class="filtro"><label for="f-periodo">Período</label><select id="f-periodo"></select></div>
    <div class="filtro" id="caja-rs"><label for="f-rs">Razón social</label><select id="f-rs"></select></div>
    <div class="filtro" id="caja-obra"><label for="f-obra">Proyecto</label><select id="f-obra"></select></div>
    <button class="btn-act" id="btn-act">Actualizar ahora</button>
  </div></div>
  <div class="fuentes" id="fuentes"></div>
  <div id="cargando">leyendo <code>tablero_datos.json</code>…</div>
  <div id="hoja" hidden></div>
</div>

<script>
window.HOJA = {
  id: "caja",
  nombre: "Caja",
  pregunta: "¿Alcanza el dinero?",
  fuentes: ["AXION"],

  filtros: ["banco"],
  ventanas: {
    "k-30d": "la proyección es del grupo entero: no sigue a ningún filtro",
    "k-colchon": "el colchón usa el saldo del MES EN CURSO: el período y el proyecto no lo mueven"
  },

  _rsCuenta: function (c) {
    c = String(c || "").toUpperCase();
    if (c.indexOf("CONSTRUCTORA VELASCO") >= 0)
      return "CONSTRUCTORA VELASCO LEON SOCIEDAD ANONIMA CERRADA";
    if (c.indexOf("CORPORACION HABITAT") >= 0)
      return "CORPORACION HABITAT SOCIEDAD ANONIMA CERRADA";
    if (c.indexOf("BIENES RAICES") >= 0)
      return "HABITAT BIENES RAICES EMPRESA INDIVIDUAL DE RESPONSABILIDAD LIMITADA";
    if (c.indexOf("ESCALAR") >= 0)
      return "ESCALAR Y HABITAT GRUPO INMOBILIARIO S.A.C.";
    if (c.indexOf("YEAN") >= 0) return "YEAN WILLIAM VELASCO LEON";
    return "";
  },
  _entraRSCuenta: function (c) { return !RS || this._rsCuenta(c) === RS; },
  _rsNombre: function (c) {
    c = String(c || "").toUpperCase();
    if (c.indexOf("CONSTRUCTORA VELASCO") >= 0) return "CONSTRUCTORA VELASCO LEON S.A.C.";
    if (c.indexOf("CORPORACION HABITAT") >= 0) return "CORPORACION HABITAT S.A.C.";
    if (c.indexOf("BIENES RAICES") >= 0) return "HABITAT BIENES RAICES E.I.R.L.";
    if (c.indexOf("ESCALAR") >= 0) return "ESCALAR Y HABITAT GRUPO INMOBILIARIO S.A.C.";
    if (c.indexOf("HABITAT LE") >= 0) return "HABITAT LEÓN S.A.C.";
    if (c.indexOf("YEAN") >= 0) return "YEAN WILLIAM VELASCO LEON";
    return "";
  },

  pintar: function (M, D) {
    var self = this;
    var pp = perPartes();
    var fl = D.flujo || {};
    var anioCaja = Number(fl.anio || 0);
    var MESL = ["", "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
                "Julio", "Agosto", "Setiembre", "Octubre", "Noviembre", "Diciembre"];
    var vivos = (fl.meses || []).filter(function (m) {
      return (m.pasado || m.en_curso) &&
             ((m.entro || 0) > 0 || (m.salio || 0) > 0); });
    var mesTope = 0;
    vivos.forEach(function (m) { mesTope = Math.max(mesTope, m.mes); });

    var mesSel = (!pp.hist && pp.mes && pp.anio === anioCaja) ? pp.mes : mesTope;
    var prefMes = String(anioCaja) + "-" + (mesSel < 10 ? "0" : "") + mesSel;
    var prefP = pp.hist ? "" : (String(pp.anio || "") +
      (pp.mes ? "-" + (pp.mes < 10 ? "0" : "") + pp.mes : ""));

    var Fb = ((D.libro || {}).filas) || {};
    var noms = Fb.cuenta || [], obrasLib = Fb.obra || [];
    var entroDe = function (pref) {
      var s = 0;
      (Fb.f || []).forEach(function (r) {
        if (pref && String(r[0] || "").indexOf(pref) !== 0) return;
        if (r[7] !== "venta") return;
        var cu = noms[r[6]];
        if (!entraBanco(cu) || !self._entraRSCuenta(cu)) return;
        if (OBRA) {
          var ob = (r[5] !== null && r[5] !== undefined) ? obrasLib[r[5]] : "";
          if (ob !== OBRA) return;
        }
        s += r[4] || 0;
      });
      return s;
    };
    var salioDe = function (pref) {
      var s = 0;
      (Fb.f || []).forEach(function (r) {
        if (pref && String(r[0] || "").indexOf(pref) !== 0) return;
        if (r[7] !== "gasto") return;
        var cu = noms[r[6]];
        if (!entraBanco(cu) || !self._entraRSCuenta(cu)) return;
        if (OBRA) {
          var ob = (r[5] !== null && r[5] !== undefined) ? obrasLib[r[5]] : "";
          if (ob !== OBRA) return;
        }
        s += r[4] || 0;
      });
      return s;
    };

    var prefAct = String(anioCaja) + "-" + (mesTope < 10 ? "0" : "") + mesTope;
    var apInt = {}, mvMes = {}, mesTopeL = "", fechaTope = "";
    (Fb.f || []).forEach(function (r) {
      var f = String(r[0] || "");
      if (f.slice(0, 4) !== String(anioCaja)) return;
      var m = f.slice(0, 7);
      if (m > mesTopeL) mesTopeL = m;
      if (f > fechaTope) fechaTope = f;
      var cu = String(noms[r[6]] || "");
      if (!cu) return;
      var con = String(r[3] || "").replace(/^\s+/, "").toUpperCase();
      if (r[7] === "presupuesto" && con.indexOf("SALDO") === 0) {
        (apInt[cu] = apInt[cu] || {})[m] = (apInt[cu][m] || 0) + (r[4] || 0);
        return;
      }
      var o = (mvMes[cu] = mvMes[cu] || {})[m] =
        mvMes[cu][m] || {e: 0, s: 0, tr: 0, n: 0};
      o.n++;
      if (r[7] === "venta") o.e += r[4] || 0;
      else if (r[7] === "gasto") o.s += r[4] || 0;
      else if (r[7] === "presupuesto") o.tr += r[4] || 0;
    });
    var ext = (D.saldos_externos || {});
    var EXA = ext.aperturas ||
      (ext.fecha ? (function () { var o = {}; o[ext.fecha] = {cuentas: ext.cuentas || {}}; return o; })() : {});
    var extVal = {}, extFue = {}, corteM = "";
    Object.keys(EXA).forEach(function (f) {
      var m = f.slice(0, 7);
      if (m > mesTopeL) return;
      var cs = (EXA[f] || {}).cuentas || {};
      var fu = (EXA[f] || {}).fuente || {};
      if (Object.keys(cs).length && m > corteM) corteM = m;
      Object.keys(cs).forEach(function (cu) {
        (extVal[cu] = extVal[cu] || {})[m] = cs[cu];
        (extFue[cu] = extFue[cu] || {})[m] = fu[cu] || "contadora";
      });
    });
    var hayContadora = !!corteM;
    var mesDato = String(D.generado || "").slice(0, 7);
    corteM = (mesDato.slice(0, 4) === String(anioCaja) && mesDato > mesTopeL)
      ? mesDato : mesTopeL;
    var corteN = corteM ? parseInt(corteM.slice(5, 7), 10) : 0;
    var cierreN = corteN > 1 ? corteN - 1 : 12;
    var sinCta = {n: 0, e: 0, s: 0, tr: 0};
    (Fb.f || []).forEach(function (r) {
      if (String(r[0] || "").slice(0, 4) !== String(anioCaja)) return;
      if (String(noms[r[6]] || "")) return;
      sinCta.n++;
      if (r[7] === "venta") sinCta.e += r[4] || 0;
      else if (r[7] === "gasto") sinCta.s += r[4] || 0;
      else if (r[7] === "presupuesto") sinCta.tr += r[4] || 0;
    });

    var apAX = D.saldos_iniciales || {};
    /* Lo que publica el motor, por cuenta (ver el mismo bloque en Resumen). */
    var CCm = {};
    (((D.control_cuentas || {}).cuentas) || []).forEach(function (c) {
      var porMes = {}, orden = [];
      (c.meses || []).forEach(function (f) { porMes[f.m] = f; orden.push(f.m); });
      if (orden.length) CCm[c.cu] = {ap: c.ap, porMes: porMes, orden: orden};
    });
    var saldos = [], tengo = 0, tengoCierre = 0, positivos = 0, negN = 0, negS = 0,
        trTot = 0, sinApert = 0, extUsadas = 0, alertas = [];
    var universo = {};
    Object.keys(apInt).forEach(function (cu) { universo[cu] = 1; });
    Object.keys(mvMes).forEach(function (cu) { universo[cu] = 1; });
    Object.keys(extVal).forEach(function (cu) { universo[cu] = 1; });
    Object.keys(apAX).forEach(function (cu) { universo[cu] = 1; });
    Object.keys(CCm).forEach(function (cu) { universo[cu] = 1; });
    Object.keys(universo).forEach(function (cu) {
      if (!entraBanco(cu) || !self._entraRSCuenta(cu)) return;
      var extC = (extVal[cu] || {})[corteM];
      var intC = (apInt[cu] || {})[corteM];
      var cierre = null, fuente = "", nota = "",
          hayAlgunaInt = Object.keys(apInt[cu] || {}).length > 0;
      var apAXm = apAX[cu] || {};
      var apAXk = Object.keys(apAXm).sort()[0];
      if (apAXk && apAXk <= corteM) {
        cierre = apAXm[apAXk];
        Object.keys(mvMes[cu] || {}).forEach(function (m) {
          if (m < apAXk || m >= corteM) return;
          var o = mvMes[cu][m]; cierre += o.tr + o.e - o.s;
        });
        cierre = Math.round(cierre * 100) / 100;
        fuente = "axion-inicial";
        if (intC !== undefined)
          nota = "cargado dos veces: " + soles(intC) + " · Administración";
      }
      else if (extC !== undefined) {
        cierre = extC; fuente = extFue[cu][corteM]; extUsadas++;
        if (intC !== undefined && Math.abs(intC - extC) > 0.01) {
          alertas.push({tipo: "axion-vs-contadora", cuenta: cu, axion: intC, contadora: extC, dif: intC - extC});
          nota = "AXION abrió con " + soles(intC);
        }
        if (fuente === "axion" && !hayAlgunaInt) {
          alertas.push({tipo: "sin-apertura-axion", cuenta: cu, monto: extC});
          nota = "sin apertura en AXION";
        }
      } else if (intC !== undefined) {
        cierre = intC; fuente = "registro";
        if (hayContadora) {
          alertas.push({tipo: "fuera-de-lista", cuenta: cu, monto: intC});
          nota = "fuera de la lista de la contadora";
        }
      } else {
        var base = "";
        Object.keys(apInt[cu] || {}).concat(Object.keys(extVal[cu] || {})).forEach(function (m) {
          if (m < corteM && m > base) base = m; });
        if (base) {
          cierre = (extVal[cu] || {})[base] !== undefined ? extVal[cu][base] : apInt[cu][base];
          Object.keys(mvMes[cu] || {}).forEach(function (m) {
            if (m < base || m >= corteM) return;
            var o = mvMes[cu][m]; cierre += o.tr + o.e - o.s;
          });
          fuente = "calculado";
          if (hayContadora) {
            alertas.push({tipo: "fuera-de-lista", cuenta: cu, monto: cierre});
            nota = "fuera de la lista de la contadora";
          }
        } else {
          fuente = "sin-apertura";
        }
      }
      var e = 0, s2 = 0, tr = 0, nMov = 0;
      Object.keys(mvMes[cu] || {}).forEach(function (m) {
        if (m < corteM || m > mesTopeL) return;
        var o = mvMes[cu][m]; e += o.e; s2 += o.s; tr += o.tr; nMov += o.n;
      });
      var mesCerrado = String(anioCaja) + "-" + (cierreN < 10 ? "0" : "") + cierreN;
      var oc = (mvMes[cu] || {})[mesCerrado] || {e: 0, s: 0, tr: 0, n: 0};
      var s = (cierre || 0) + tr + e - s2;
      var ccu = CCm[cu];
      if (ccu) {
        var mTope = ccu.orden[ccu.orden.length - 1];
        var mCierre = corteN - 1;
        var fCierre = ccu.porMes[mCierre];
        cierre = ccu.ap === null || ccu.ap === undefined ? null
               : (mCierre >= 1 && fCierre ? fCierre.ax : ccu.ap);
        fuente = cierre === null ? "sin-apertura" : "axion-inicial";
        e = 0; s2 = 0; tr = 0; nMov = 0; nota = "";
        ccu.orden.forEach(function (n) {
          if (n < corteN) return;
          var f = ccu.porMes[n]; e += f.v; tr += f.tr; s2 += f.s; nMov += f.n;
          if (f.dup) nota = "cargado dos veces: " + soles(f.dup) + " · Administración";
        });
        var fc = ccu.porMes[cierreN];
        oc = fc ? {e: fc.v, s: fc.s, tr: fc.tr, n: fc.n} : {e: 0, s: 0, tr: 0, n: 0};
        s = ccu.porMes[mTope].ax;
        if (cu === "SIN BANCO") nota = "movimientos sin banco asignado · Administración";
      }
      if (cierre === null) sinApert++;
      saldos.push({cuenta: cu, apert: cierre, cierre: cierre, fuente: fuente,
                   ext: extC !== undefined, dentro: oc, nota: nota,
                   tr: tr, e: e, s: s2, nMov: nMov, saldo: s});
      tengo += s; tengoCierre += (cierre || 0); trTot += tr;
      if (s > 0) positivos += s; else if (s < 0) { negN++; negS += s; }
    });
    /* La cifra de la contadora contra lo cargado en AXION en el mes cerrado */
    var brechas = [];
    Object.keys(extVal).forEach(function (cu) {
      if (!entraBanco(cu) || !self._entraRSCuenta(cu)) return;
      var extC = extVal[cu][corteM];
      if (extC === undefined) return;
      var prev = "";
      Object.keys(apInt[cu] || {}).concat(Object.keys(extVal[cu] || {})).forEach(function (m) {
        if (m < corteM && m > prev) prev = m; });
      if (!prev) return;
      var est = (extVal[cu] || {})[prev] !== undefined ? extVal[cu][prev] : apInt[cu][prev];
      Object.keys(mvMes[cu] || {}).forEach(function (m) {
        if (m < prev || m >= corteM) return;
        var o = mvMes[cu][m]; est += o.tr + o.e - o.s;
      });
      var br = extC - est;
      if (Math.abs(br) < 0.01) return;
      brechas.push({cuenta: cu, fuente: extFue[cu][corteM], desde: prev, hasta: corteM,
                    est: est, contadora: extC, br: br});
    });
    if (Object.keys(CCm).length) {
      brechas = [];
      Object.keys(CCm).forEach(function (cu) {
        if (!entraBanco(cu) || !self._entraRSCuenta(cu)) return;
        var f = CCm[cu].porMes[cierreN];
        if (!f || f.bco === undefined || Math.abs(f.bco - f.ax) < 0.01) return;
        brechas.push({cuenta: cu, fuente: "banco", desde: "", hasta: corteM,
                      est: f.ax, contadora: f.bco, br: f.bco - f.ax});
      });
    }
    brechas.sort(function (a, b) { return Math.abs(b.br) - Math.abs(a.br); });
    var ocPendL = (D.ordenes_compra || []).filter(function (o) {
      return String(o.estado || "").toLowerCase() === "pendiente"; });
    var ocPend = ocPendL.reduce(function (a, o) { return a + (o.total || 0); }, 0);
    var dispongo = positivos - ocPend;
    saldos.sort(function (a, b) { return ordenCuenta(a.cuenta, b.cuenta); });
    var cmacSin = sinApert;

    var mesHoy = 0;
    Object.keys(CCm).forEach(function (cu) {
      var o = CCm[cu].orden;
      if (o.length) mesHoy = Math.max(mesHoy, o[o.length - 1]);
    });
    if (!mesHoy) mesHoy = mesTope;
    var esMesCaja = !pp.hist && pp.anio === anioCaja && !!pp.mes;
    var esAnioCaja = !pp.hist && pp.anio === anioCaja && !pp.mes;
    var vDesde = esMesCaja ? pp.mes : (esAnioCaja ? 1 : mesHoy);
    var vHasta = esMesCaja ? pp.mes : mesHoy;
    var vista = [];
    Object.keys(CCm).forEach(function (cu) {
      if (!entraBanco(cu) || !self._entraRSCuenta(cu)) return;
      var c = CCm[cu], fF = c.porMes[vHasta];
      if (!fF) return;
      var sinAp = c.ap === null || c.ap === undefined;
      var fI = c.porMes[vDesde - 1];
      var ini = sinAp ? null : (vDesde === 1 ? c.ap : (fI ? fI.ax : null));
      var tr = 0, e = 0, s = 0, dup = 0;
      for (var n = vDesde; n <= vHasta; n++) {
        var f = c.porMes[n];
        if (!f) continue;
        tr += f.tr || 0; e += f.v || 0; s += f.s || 0; dup += f.dup || 0;
      }
      /* una cuenta sin saldo y sin movimiento en el período no dice nada */
      if (Math.abs(ini || 0) < 0.005 && !tr && !e && !s && Math.abs(fF.ax) < 0.005) return;
      var nota = [];
      if (sinAp) nota.push("sin saldo inicial en AXION · Administración");
      if (dup) nota.push("cargado dos veces: " + soles(dup) + " · Administración");
      if (cu === "SIN BANCO") nota.push("movimientos sin banco asignado · Administración");
      vista.push({cuenta: cu, ini: ini, tr: tr, e: e, s: s, fin: fF.ax, nota: nota.join(" · ")});
    });
    vista.sort(function (a, b) { return ordenCuenta(a.cuenta, b.cuenta); });
    var rotVista = esAnioCaja ? String(anioCaja) : (MESL[vDesde] + " " + anioCaja);
    var rotIni = vDesde === 1 ? "Saldo inicial " + anioCaja : "Cierre " + MESL[vDesde - 1];
    var rotFin = vHasta === mesHoy ? "Hoy" : "Cierre " + MESL[vHasta];
    var rotMov = esAnioCaja ? String(anioCaja) : MESL[vDesde];

    var conSaldo = (esMesCaja || esAnioCaja) && !OBRA;
    var filasCuadro = vista;
    var rotCuadro = rotVista;
    if (!conSaldo) {
      var movP = {};
      (Fb.f || []).forEach(function (r) {
        if (prefP && String(r[0] || "").indexOf(prefP) !== 0) return;
        var cu = String(noms[r[6]] || "") || "SIN BANCO";
        if (!entraBanco(cu) || !self._entraRSCuenta(cu)) return;
        if (OBRA) {
          var ob = (r[5] !== null && r[5] !== undefined) ? obrasLib[r[5]] : "";
          if (ob !== OBRA) return;
        }
        var con = String(r[3] || "").replace(/^\s+/, "").toUpperCase();
        var x = movP[cu] = movP[cu] || {cuenta: cu, ini: null, fin: 0, tr: 0, e: 0, s: 0};
        if (r[7] === "venta") x.e += r[4] || 0;
        else if (r[7] === "gasto") x.s += r[4] || 0;
        else if (r[7] === "presupuesto" && con.indexOf("SALDO") !== 0) x.tr += r[4] || 0;
      });
      filasCuadro = Object.keys(movP).map(function (k) { return movP[k]; })
        .filter(function (x) { return x.tr || x.e || x.s; })
        .sort(function (a, b) { return ordenCuenta(a.cuenta, b.cuenta); });
      rotCuadro = pp.hist ? "Todos los años"
        : (pp.mes ? MESL[pp.mes] + " " + pp.anio : String(pp.anio));
    }
    var agrupar = function (clave) {
      var o = {}, orden = [];
      filasCuadro.forEach(function (x) {
        var k = clave(x.cuenta);
        if (!o[k]) { o[k] = {k: k, ini: null, tr: 0, e: 0, s: 0, fin: 0}; orden.push(k); }
        var g = o[k];
        if (x.ini !== null) g.ini = (g.ini || 0) + x.ini;
        g.tr += x.tr; g.e += x.e; g.s += x.s; g.fin += x.fin || 0;
      });
      return orden.map(function (k) { return o[k]; });
    };
    var porBanco = agrupar(function (cu) {
      return cu.indexOf(" - ") > 0 ? cu.split(" - ")[0] : cu; });
    var porRS = agrupar(function (cu) { return self._rsNombre(cu) || cu; });

    var cobradoMes = entroDe(prefMes);
    var salioMeses = [];
    vivos.forEach(function (m) {
      var pm = String(anioCaja) + "-" + (m.mes < 10 ? "0" : "") + m.mes;
      salioMeses.push({mes: m.mes, s: salioDe(pm)});
    });
    var conGasto = salioMeses.filter(function (x) { return x.s > 0; });
    var promGasto = conGasto.length ? conGasto.reduce(function (a, x) {
      return a + x.s; }, 0) / conGasto.length : 0;
    var eq = promGasto > 0 ? 100 * cobradoMes / promGasto : null;

    var salioMesSinObra = function (pref) {
      var s = 0;
      (Fb.f || []).forEach(function (r) {
        if (String(r[0] || "").indexOf(pref) !== 0) return;
        if (r[7] !== "gasto") return;
        var cu = noms[r[6]];
        if (!entraBanco(cu) || !self._entraRSCuenta(cu)) return;
        s += r[4] || 0;
      });
      return s;
    };
    var promCaja = 0, nCaja = 0, cajaMeses = [];
    vivos.forEach(function (m) {
      var pm = String(anioCaja) + "-" + (m.mes < 10 ? "0" : "") + m.mes;
      var sm = salioMesSinObra(pm);
      cajaMeses.push({mes: m.mes, s: sm});
      if (sm > 0) { promCaja += sm; nCaja++; }
    });
    promCaja = nCaja ? promCaja / nCaja : 0;
    var colchon = promCaja > 0 ? tengo / promCaja : null;
    var saldoMes = {};
    vivos.forEach(function (m) {
      var sm = 0;
      Object.keys(CCm).forEach(function (cu) {
        if (!entraBanco(cu) || !self._entraRSCuenta(cu)) return;

      '<div class="detalle" id="det-k-eq"></div>' +

    var NEc = "No existe";

    h += cuadro("Por banco · " + rotCuadro, "Banco", porBanco) +

  detalle: function (id, el) {
    var self = this;
